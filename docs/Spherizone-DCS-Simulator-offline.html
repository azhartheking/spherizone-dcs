<style>
/* ISA-101 style: grey, low-contrast normal state, colour reserved for abnormal situations */
:root{
  --bg:#c6c8ca; --panel:#d9dbdc; --panel2:#e6e7e8; --line:#8d9195; --eq:#b3b6b9; --eqs:#53575c;
  --pipe:#45494e; --gas:#6c7177; --cw:#7d8c99; --txt:#121416; --mut:#4a4e53; --dim:#6b6f74;
  --p1:#e10600; --p2:#f0b000; --p3:#b400b4; --ok:#2f7d32; --sel:#1d4fbf; --white:#f7f7f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:12px/1.35 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:3px 8px;color:var(--txt)}
button:hover{background:#f0f1f2}
button.on{background:#53575c;color:#fff;border-color:#33373b}
button.warn{border-color:var(--p1);color:var(--p1);font-weight:600}
input,select{font:inherit;border:1px solid var(--line);background:#fff;padding:2px 4px;border-radius:2px}
input[type=number]{width:80px}
a{color:var(--sel)}

/* ---------- header ---------- */
#hdr{background:#a9acaf;border-bottom:1px solid #85898d;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:10px;padding:4px 10px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.06em;font-size:13px}
.brand small{font-weight:400;color:var(--mut);letter-spacing:0;margin-left:6px}
.clock{font:600 15px Consolas,monospace;background:#e8e9ea;border:1px solid var(--line);padding:1px 8px;min-width:96px;text-align:center}
.grp{display:flex;gap:2px;align-items:center}
.spacer{flex:1}
.chip{background:#e8e9ea;border:1px solid var(--line);padding:2px 8px;border-radius:2px;white-space:nowrap}
.chip b{font-weight:600}
.almbadge{display:flex;gap:3px;text-decoration:none;color:var(--txt)}
.almbadge span{min-width:34px;text-align:center;border:1px solid var(--line);padding:2px 5px;background:#e8e9ea;font-weight:600}
.almbadge .a1.act{background:var(--p1);color:#fff}
.almbadge .a2.act{background:var(--p2)}
.almbadge .a3.act{background:var(--p3);color:#fff}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
nav.pages{display:flex;gap:1px;padding:0 10px;flex-wrap:wrap;background:#9b9ea1}
nav.pages a{padding:5px 11px;color:var(--txt);text-decoration:none;background:#b9bcbf;border:1px solid #8d9195;border-bottom:none;margin-top:3px;position:relative}
nav.pages a.cur{background:var(--bg);font-weight:600}
nav.pages a .dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%}
nav.pages a .dot.p1{background:var(--p1)} nav.pages a .dot.p2{background:var(--p2)} nav.pages a .dot.p3{background:var(--p3)}

/* ---------- layout ---------- */
#main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:8px;padding:8px 10px}
#view{min-width:0;display:flex;flex-direction:column;gap:8px}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px}
.card h3{margin:0;padding:4px 8px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;background:#c3c5c7;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card h3 a{font-weight:400;text-transform:none;letter-spacing:0}
.card .bd{padding:6px 8px}
.gfxwrap{background:var(--panel);border:1px solid var(--line);position:relative}
svg.gfx{display:block;width:100%;height:auto;user-select:none}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
@media (max-width:1000px){#main{grid-template-columns:1fr}}

/* ---------- svg graphic ---------- */
.eq{fill:var(--eq);stroke:var(--eqs);stroke-width:1.5}
.eq2{fill:#c4c7ca;stroke:var(--eqs);stroke-width:1.2}
.bed{fill:#9fa3a7;stroke:none}
.pipe{fill:none;stroke:var(--pipe);stroke-width:2.6}
.pipe.gas{stroke:var(--gas);stroke-width:2;stroke-dasharray:none}
.pipe.liq{stroke:#3d4248;stroke-width:2}
.pipe.cw{stroke:var(--cw);stroke-width:1.6;stroke-dasharray:6 3}
.pipe.cat{stroke:#3d4248;stroke-width:1.6}
.pipe.sig{stroke:#777;stroke-width:1;stroke-dasharray:3 3}
.pipe.thin{stroke-width:1.4}
.pipe.dead{stroke:#a3a6a9}
.lbl{font:600 11px "Segoe UI",Arial;fill:var(--txt)}
.lbl.s{font-weight:400;font-size:10px;fill:var(--mut)}
.lbl.big{font-size:13px;letter-spacing:.04em}
.lbl.area{font-size:12px;fill:#55595e;letter-spacing:.08em}
.tagbox{cursor:pointer}
.tagbox rect.b{fill:#e4e5e6;stroke:#7d8186;stroke-width:1}
.tagbox:hover rect.b{stroke:var(--sel);stroke-width:1.6}
.tagbox.sel rect.b{stroke:var(--sel);stroke-width:2.2}
.tagbox .t{font:600 10.5px "Segoe UI",Arial}
.tagbox .v{font:600 13px Consolas,monospace}
.tagbox .u{font:10px "Segoe UI",Arial;fill:var(--mut)}
.tagbox .s{font:10px Consolas,monospace;fill:#333}
.tagbox .m{font:600 9px "Segoe UI";fill:var(--txt)}
.tagbox .mbg{fill:#f7f7f7;stroke:#333;stroke-width:.8}
.tagbox.standby .v,.tagbox.standby .s,.tagbox.standby .u{opacity:.45}
.tagbox.a1 rect.b{stroke:var(--p1);stroke-width:2.6}.tagbox.a2 rect.b{stroke:var(--p2);stroke-width:2.6}.tagbox.a3 rect.b{stroke:var(--p3);stroke-width:2.6}
.tagbox .ab{display:none}
.tagbox.a1 .ab,.tagbox.a2 .ab,.tagbox.a3 .ab{display:inline}
.tagbox.a1 .ab rect{fill:var(--p1)} .tagbox.a2 .ab rect{fill:var(--p2)} .tagbox.a3 .ab rect{fill:var(--p3)}
.tagbox.unack .ab{animation:blink 1s steps(2,start) infinite}
.ind rect.b{fill:#e9eaeb;stroke:#a2a5a8}
.motor{cursor:pointer}
.motor .body{fill:#f2f2f2;stroke:var(--eqs);stroke-width:1.6}
.motor.run .body{fill:#5b5f64}
.motor.run .mk{fill:#f2f2f2}
.motor .mk{fill:var(--eqs)}
.motor.trip .body{stroke:var(--p1);stroke-width:3}
.motor:hover .body{stroke:var(--sel)}
.valve{fill:#f2f2f2;stroke:var(--eqs);stroke-width:1.3}
.valve.open{fill:#6a6e73}
.link{cursor:pointer}
.link path{fill:#e4e5e6;stroke:#55595e;stroke-width:1.2}
.link:hover path{fill:#fff;stroke:var(--sel)}
.link text{font:600 10px "Segoe UI";fill:var(--txt)}
.area-r{fill:transparent;stroke:#8f9397;stroke-width:1.2;stroke-dasharray:5 4;cursor:pointer}
.area-r:hover{fill:rgba(255,255,255,.25);stroke:var(--sel)}
.lvl{fill:#7e8389}
.alarmfill{fill:var(--p1)!important}
.flow-anim{stroke-dasharray:8 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.particles circle{fill:#6e7378}

/* ---------- faceplate ---------- */
.fp .tag{font:700 16px Consolas,monospace}
.fp .desc{color:var(--mut);margin-bottom:6px}
.fp .grid{display:grid;grid-template-columns:44px 1fr;gap:8px}
.fp .bar{position:relative;height:150px;background:#eceded;border:1px solid var(--line)}
.fp .bar .pvb{position:absolute;left:4px;right:22px;bottom:0;background:#6b6f74}
.fp .bar .spm{position:absolute;left:0;right:16px;height:0;border-top:2px solid var(--sel)}
.fp .bar .opb{position:absolute;right:3px;width:12px;bottom:0;background:#a8abaf;border:1px solid #777}
.fp table{width:100%;border-collapse:collapse}
.fp td{padding:2px 3px;border-bottom:1px solid #c9cbcd}
.fp td.k{color:var(--mut);width:40px}
.fp td.v{font:600 14px Consolas,monospace;text-align:right}
.fp td.uu{color:var(--mut);width:46px}
.fp .row{display:flex;gap:4px;align-items:center;margin-top:5px;flex-wrap:wrap}
.fp .row input{width:84px}
.fp .note{color:var(--mut);font-size:11px;margin-top:4px}
.fp .big{font:700 20px Consolas,monospace}
.state{display:inline-block;padding:1px 7px;border:1px solid var(--line);background:#fff;font-weight:600}
.state.bad{background:var(--p1);color:#fff;border-color:var(--p1)}
.state.warn{background:var(--p2)}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th,table.t td{border:1px solid #b9bcbf;padding:3px 6px;text-align:right;white-space:nowrap}
table.t th{background:#cfd1d3;font-weight:600;text-align:center}
table.t td.l,table.t th.l{text-align:left}
table.t tr:nth-child(even) td{background:#e1e2e3}
table.t td.bad{background:var(--p1)!important;color:#fff;font-weight:600}
table.t td.diff{background:#f6dd8d!important;font-weight:600}
table.t td.okc{color:var(--ok);font-weight:600}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:#f4f4f4}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:1px 8px;align-items:baseline}
.kv .k{color:var(--mut)}
.kv .v{font:600 13px Consolas,monospace;text-align:right}
.kv .u{color:var(--mut);font-size:10.5px}
.kv .v.bad{color:var(--p1)}
.alm-row td{font-size:11.5px}
.alm-row.p1 td:first-child{background:var(--p1);color:#fff}
.alm-row.p2 td:first-child{background:var(--p2)}
.alm-row.p3 td:first-child{background:var(--p3);color:#fff}
.alm-row.unack td:first-child{animation:blink 1s steps(2,start) infinite}
.alm-row.rtn td{color:#777}

/* ---------- bottom banner ---------- */
#banner{background:#b3b6b9;border-top:1px solid #85898d;padding:3px 10px;font-size:11.5px;min-height:62px}
#banner table{width:100%;border-collapse:collapse}
#banner td{padding:1px 6px;white-space:nowrap}
#banner td.msg{width:100%;white-space:normal}
#banner tr{cursor:pointer}
canvas.trend{width:100%;display:block;background:#eceded;border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:14px 1fr auto auto;gap:1px 6px;font-size:11px;padding:4px 2px;align-items:center}
.legend i{display:inline-block;width:12px;height:3px}
.legend .v{font:600 12px Consolas,monospace;text-align:right}
.legend .r{color:var(--mut);font-size:10px}
.hint{color:var(--mut);font-size:11px}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.disclaimer{color:var(--mut);font-size:10.5px;padding:0 10px 6px}
.fail-grid{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.ex{border:1px solid #b9bcbf;background:#e4e5e6;padding:6px 8px;margin-bottom:6px}
.ex b{display:block}
.ex p{margin:3px 0 5px;color:var(--mut)}

/* ---------- session (shift handover) menu ---------- */
.modal{position:fixed;inset:0;background:rgba(40,42,45,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px}
.mbox{background:#f3f3f1;border:1px solid var(--line);border-radius:4px;max-width:940px;width:100%;padding:14px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mhd{display:flex;justify-content:space-between;align-items:center;font:700 19px "Segoe UI",Arial;margin-bottom:4px}
.mhd .mx{font-size:14px;padding:2px 9px}
.mgrade{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.msec{font:700 12.5px "Segoe UI",Arial;letter-spacing:.06em;text-transform:uppercase;color:#45494e;margin:14px 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mtile{text-align:left;background:#fcfcfb;border:1px solid #c9cbcd;border-radius:4px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.mtile b{font-size:13px}
.mtile span{color:var(--mut);font-size:11.5px;line-height:1.4}
.mtile:hover{border-color:var(--sel);background:#fff}
.mtile:focus-visible{outline:2px solid var(--sel)}
.mtile:disabled{opacity:.5;cursor:not-allowed}
ol.proc{margin:4px 0;padding-left:20px;font-size:11.5px}
ol.proc li{margin:2px 0}
ol.proc li a{color:var(--txt);text-decoration:none}
ol.proc li.done a{color:var(--ok);text-decoration:line-through}
ol.proc li.next{font-weight:600}
ol.proc li.next a{color:var(--sel)}
.motor.run .mk[stroke]{stroke:#f2f2f2}

/* faceplate recipe-SP hint */
.fp .row.recipe{background:#e6e7e8;border:1px solid #c3c5c7;padding:3px 5px;justify-content:space-between}
.fp .row.recipe.diff{background:#f6dd8d;border-color:#d8b33c}
.fp .row.recipe .hint b{color:var(--txt);font-family:Consolas,monospace}


/* ---------- pop-out windows (?pop=1) ---------- */
.popmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;background:var(--panel2);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:240px;padding:3px}
.popmenu button{border:none;background:transparent;text-align:left;padding:6px 10px}
.popmenu button:hover{background:#fff}
body.pop nav.pages, body.pop #side, body.pop #banner, body.pop .disclaimer, body.pop .brand small, body.pop #hdr .np{display:none!important}
body.pop #main{grid-template-columns:minmax(0,1fr);padding:6px}
body.pop .hrow{padding:3px 8px;gap:6px}
body.pop .brand::after{content:" · POP-OUT";font-weight:400;color:var(--mut)}
a.popa{text-decoration:none;margin-left:8px;font-weight:600}

/* ---------- run lamps on motors ---------- */
.motor .lamp{stroke:#333;stroke-width:.8}
.motor .lamp.on{fill:#22b04b}
.motor .lamp.off{fill:#d32f2f}
.motor .lamp.tr{fill:#ff1a1a;animation:blink .7s steps(2,start) infinite}
.motor.tripped .body{stroke:var(--p1);stroke-width:3;animation:blink 1s steps(2,start) infinite}

/* ---------- PSV / PRV symbols ---------- */
.psv{cursor:pointer}
.psv .pv{fill:#f2f2f2;stroke:#45494e;stroke-width:1.2}
.psv.static .pv{fill:#e2e3e4}
.psv.open .pv{fill:var(--p1);stroke:#7a0000}
.psv.open text{fill:var(--p1);font-weight:700}
.psv.sel .pv{stroke:var(--sel);stroke-width:2}
.psv:hover .pv{stroke:var(--sel)}
.pipe.flare{stroke:#8a6d3b;stroke-width:1.8;stroke-dasharray:7 3}
.pipe.flare.hot{stroke:var(--p1);stroke-dasharray:7 3;animation:flow .6s linear infinite}
.pipe.util{stroke-width:1.6}
.pipe.steam{stroke:#9c4f4f;stroke-width:1.6;stroke-dasharray:2 3}
.pipe.n2{stroke:#4f6d9c;stroke-width:1.6;stroke-dasharray:10 3 2 3}
.pipe.air{stroke:#5f8a5f;stroke-width:1.6;stroke-dasharray:1 3}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.08,.92)}}

/* ---------- safety alert pop-up ---------- */
#szalert{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(20,20,20,.28);pointer-events:auto}
#szalert .ab{width:min(560px,92vw);background:#fff;border:3px solid var(--p1);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#szalert.k-psv .ab{border-color:#d07a00}
#szalert .ah{background:var(--p1);color:#fff;font:700 16px "Segoe UI";padding:8px 12px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
#szalert.k-psv .ah{background:#d07a00}
#szalert .ah .at{margin-left:auto;font:600 13px Consolas,monospace}
#szalert .abd{padding:12px 14px}
#szalert .att{font:700 17px "Segoe UI";margin-bottom:6px}
#szalert .amsg{font-size:13px;line-height:1.45}
#szalert .amore{margin-top:8px;color:var(--mut);font-size:12px}
#szalert .abtn{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px 12px;flex-wrap:wrap}
#szalert .abtn button{padding:6px 12px;font-size:13px}

/* control-valve tag under the valve symbol */
.lbl.vtag{font:600 9.5px Consolas,monospace;fill:#2b2f33}


/* hot-oil lines (extrusion) */
.pipe.hotoil{stroke:#a0522d;stroke-width:1.7;stroke-dasharray:8 2 2 2}


/* update banner */
#szupd{position:fixed;right:14px;bottom:14px;z-index:150;background:#fff;border:2px solid var(--sel);box-shadow:0 6px 24px rgba(0,0,0,.3);padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-width:340px;font-size:12.5px}
#szupd span{color:var(--mut)}
#szupd button{align-self:flex-start}


/* ---------- phones and small tablets ---------- */
.fpclose{display:none;padding:2px 8px}
@media (max-width:1000px){
  #hdr{position:static}
  .hrow{gap:5px;padding:4px 8px}
  .brand small{display:none}
  nav.pages{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px}
  nav.pages a{flex:0 0 auto;white-space:nowrap;padding:7px 12px}
  #main{padding:6px;gap:6px}
  .gfxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .gfxwrap svg.gfx{min-width:960px}
  .gfxwrap::after{content:"← swipe the graphic sideways · tap a tag to open its faceplate →";display:block;text-align:center;font-size:11px;color:var(--mut);padding:3px 0}
  button{min-height:32px}
  input,select{font-size:16px}
  .panels{grid-template-columns:1fr}

function mkCtl(tag, sp, op, mode) { return { pv: sp, sp: sp, op: op, mode: mode || 'AUTO', e1: 0, e2: 0 }; }

/* ---------------- 3. CONTROLLERS (velocity-form PID, bumpless) ---------------- */
function pidStep(c, def, pv, dt) {
  // measurement noise: small filtered jitter on every transmitter (≈ 0.06 % of span)
  if (SZ.mnoise && !def.hand) { c.mn = (c.mn || 0) + (SZ.gauss() * 0.0017 * (def.hi - def.lo) - (c.mn || 0)) * Math.min(1, dt / 4); pv += c.mn; }
  c.pv = pv;
  if (def.hand) { c.mode = 'MAN'; return; }
  const span = def.hi - def.lo;
  const e = (pv - c.sp) / span * 100 * def.act;       // % of span; positive → increase OP
  const y = pv / span * 100 * def.act;                 // PV in % of span (for P and D on PV)
  if (c.y1 == null) c.y1 = y;
  if (c.mode === 'AUTO') {
    const ti = def.ti || 1e9, td = def.td || 0;
    // derivative acts on a filtered signal (like a real DCS PID) so transmitter jitter does not kick the valve.
    // ppv loops (temperatures) use "I on error, P and D on PV": an SP change moves the output smoothly (integral
    // only) instead of a step kick of Kc × ΔSP — a large kick on TIC-211 would dump the reactor temperature.
    const tf = Math.max(4, td / 4), ds = def.ppv ? y : e;
    c.ef = c.ef == null ? ds : c.ef + (ds - c.ef) * Math.min(1, dt / tf);
    const f1 = c.f1 == null ? c.ef : c.f1, f2 = c.f2 == null ? f1 : c.f2;
    const dP = def.ppv ? y - c.y1 : e - c.e1;
    const dOP = def.kc * (dP + dt / ti * e + td / dt * (c.ef - 2 * f1 + f2));
    c.op = clamp(c.op + dOP, 0, 100);
    c.f2 = f1; c.f1 = c.ef;
  } else {
    c.sp = pv;   // PV tracking in MAN gives bumpless MAN→AUTO
    c.ef = c.f1 = c.f2 = null;
  }
  c.e2 = c.e1; c.e1 = e; c.y1 = y;
}
SZ.pidStep = pidStep;

/* ---------------- 4. PROCESS MODEL STEP ---------------- */
SZ.pvap = function (Tc) { return Math.exp(10.03 - 2260 / (Tc + 273.15)); };  // propylene, bar abs

SZ.activity = function (o) {

  const fP = Math.max(0, (o.P + 1) / 29);
  const fC2 = 1 + 0.04 * (o.c2wt || 0);
  return fT * fTeal * fDon * fH2 * fP * fC2 * (1 - (o.poisonEff || 0)) * (1 - (o.kill || 0));
};

SZ.step = function (S, dt) {
  const p = S.p, C = S.ctl, E = S.eq, F = S.fail, D = SZ.CTL;
  S.t += dt;
  SZ.noise(S, dt); const N = S.nz;
  // ---- scheduled instructor events
  for (const ev of S.sched) if (!ev.done && S.t >= ev.t) { ev.done = true; SZ.applyFail(S, ev.fail, true, 'SCHEDULE'); }

  // ---- motors forced by failures
  if (F.cwTrip) E.P701 = false; if (F.k211Trip) E.K211 = false; if (F.k401Trip) E.K401 = false;
  if (F.exTrip) E.EX601 = false; if (F.tealTrip) E.TEALP = false;

  // ===== AREA 100 — catalyst / precontact / prepolymerisation =====
  if (S.sis.catCut) { C['FIC-101'].mode = 'MAN'; C['FIC-101'].op = 0; }
  const feederOn = E.CATF && !S.sis.catCut;
  const catCmd = feederOn ? C['FIC-101'].op / 100 * SPAN.FV101 : 0;
  p.catMeas = lag(p.catMeas, catCmd, 10, dt);              // what the flow meter reads
  p.catAct = F.catPlug ? lag(p.catAct, 0, 5, dt) : p.catMeas;  // plug: real flow lost, meter still normal
  p.teal = lag(p.teal, E.TEALP ? C['FFIC-102'].op / 100 * SPAN.TEAL : 0, 8, dt);
  p.donor = lag(p.donor, E.DONP ? C['FFIC-103'].op / 100 * SPAN.DONOR : 0, 8, dt);
  pidStep(C['FIC-101'], D['FIC-101'], p.catMeas, dt);
  pidStep(C['FFIC-102'], D['FFIC-102'], p.teal / Math.max(p.catMeas, 0.02), dt);
  pidStep(C['FFIC-103'], D['FFIC-103'], clamp(p.teal / Math.max(p.donor, 0.005), 0, 100), dt);

  // poisons in propylene feed consume TEAL first, then the catalyst (CO also poisons directly)
  const feedT = p.F201 + p.F212 + p.Fmk;
  const tealNeed = feedT * (p.poisonIn = (S.poison.H2O + S.poison.COS * 1.5)) * 0.006;
  const tealLeft = Math.max(0, p.teal - tealNeed);
  const excess = Math.max(0, tealNeed - p.teal);
  const poisonEff = clamp(1 - Math.exp(-excess / 0.3) * Math.exp(-0.15 * S.poison.CO), 0, 1);
  p.poisonEff = lag(p.poisonEff, poisonEff, 300, dt);
  const tealRatio = tealLeft / Math.max(p.catAct, 0.02);
  p.tealRatioAct = lag(p.tealRatioAct, p.catAct > 0.01 ? Math.min(tealRatio, 20) : p.tealRatioAct, 900, dt);
  p.donRatioAct = lag(p.donRatioAct, clamp(p.teal / Math.max(p.donor, 0.005), 1, 100), 900, dt);
  p.fracD = lag(p.fracD, S.donor === 'D' ? 1 : 0, K.tauPrecontact + K.tauPrepoly + K.tauMZ, dt);
  p.c1 = lag(p.c1, p.catAct, K.tauPrecontact, dt);
  p.c2 = lag(p.c2, p.c1, K.tauPrepoly, dt);
  p.T104 = lag(p.T104, 14 + (E.P701 ? 0 : 8), 300, dt);
  p.T101 = lag(p.T101, 19 + 3 * p.c2 / 0.6 + (E.P701 ? 0 : 10), 300, dt);

  // ===== AREA 200 — multizone circulating reactor R-211 =====
  p.F201 = lag(p.F201, C['FIC-201'].op / 100 * SPAN.FV201, 4, dt);
  p.F203 = lag(p.F203, C['FIC-203'].op / 100 * SPAN.FV203, 4, dt);
  p.F212 = lag(p.F212, C['FIC-212'].op / 100 * SPAN.FV212, 4, dt);
  pidStep(C['FIC-201'], D['FIC-201'], p.F201, dt);
  pidStep(C['FIC-203'], D['FIC-203'], p.F203, dt);
  pidStep(C['FIC-212'], D['FIC-212'], p.F212, dt);
  // PIC-211 "fails in AUTO": output ramps open regardless of PV
  if (F.pic211Fail && C['PIC-211'].mode === 'AUTO') { C['PIC-211'].pv = p.P211; C['PIC-211'].op = clamp(C['PIC-211'].op + 0.08 * dt, 0, 100); }
  else pidStep(C['PIC-211'], D['PIC-211'], p.P211, dt);
  // split range: OP 0-30 % opens vent to D-301, OP 30-100 % opens C3 make-up
  const op211 = C['PIC-211'].op;
  p.Fmk = lag(p.Fmk, Math.max(0, op211 - 30) / 70 * SPAN.MK211, 5, dt);
  p.Fvent = lag(p.Fvent || 0, Math.max(0, 30 - op211) / 30 * 12, 5, dt);
  p.H2f = lag(p.H2f, C['AIC-211'].op / 100 * SPAN.H2_211, 5, dt);
  const circ = C['HIC-213'].op;
  // hydrogen in riser; barrier efficiency keeps H2 out of the downer
  const Ftot = Math.max(feedT, 5);
  p.H2r = lag(p.H2r, clamp(0.6 * p.H2f * 33 / Ftot * (1 + N.h2), 0, 15), 300, dt);
  const eff = (1 - Math.exp(-p.F212 / 2.5)) * (1 - 0.004 * Math.max(0, circ - 60)) * (E.K211 ? 1 : 0.6);
  p.barEff = eff;
  p.H2d = lag(p.H2d, p.H2r * (1 - eff), 180, dt);
  if (!F.h2Frozen) p.H2gc = p.H2r; else if (p.H2gc === undefined) p.H2gc = p.H2r;
  pidStep(C['AIC-211'], D['AIC-211'], p.H2gc, dt);
  // ethylene in gas (RACO)
  p.C2gas = lag(p.C2gas, p.F203, 400, dt);

  // catalyst holdup & production
  p.hold = p.hold + (p.c2 - p.hold / (K.tauMZ / 3600)) * dt / 3600;
  const c2wtPrev = p.c2MZ || 0;
  const act = SZ.activity({ T: p.T211, tealRatio: p.tealRatioAct, donRatio: p.donRatioAct, H2r: p.H2r, P: p.P211, c2wt: c2wtPrev, poisonEff: p.poisonEff, kill: p.kill });
  p.rMZ = Math.max(0, p.hold / (K.tauMZ / 3600) * K.mileage * act * (1 + N.act));

  // energy balance R-211 / E-211
  const k211f = E.K211 ? 1 : 0.1, cwf = E.P701 ? 1 : 0.08;
  p.cwT = lag(p.cwT, (E.P701 ? 30 : 42) + N.cw + N.cwd, 120, dt);
  p.Qr = p.rMZ * 1000 * K.dHpoly / 3600;
  p.Qf = (p.F201 + p.F212 + p.Fmk) * 1000 * (0.30 + 0.0025 * (p.T211 - 25)) / 3600 * (1 + N.qf);
  p.Qc = K.UA211 * C['TIC-211'].op / 100 * Math.max(0, p.T211 - p.cwT) * cwf * k211f * (1 - 0.6 * p.foul / 100);
  if (E.HTR && !E.K211) { SZ.tripEq(S, 'HTR', 'No cycle-gas flow (K-211 stopped). Restart K-211 before the heater.'); SZ.log(S, 'SIS', 'E-212 start-up heater tripped: no cycle-gas flow (K-211 stopped)'); }
  // start-up heater duty, MW: TIC-212 throttles the E-212 steam valve TCV-212 (0-100 % → 0-4 MW, ~1 min response)
  p.Qh = lag(p.Qh || 0, E.HTR ? 4.0 * C['TIC-212'].op / 100 : 0, 60, dt);
  const Qloss = 0.004 * (p.T211 - 25);             // ambient heat loss, MW
  p.T211 += (p.Qr + p.Qh - p.Qf - p.Qc - Qloss) / K.C211 * dt;
  pidStep(C['TIC-211'], D['TIC-211'], p.T211, dt);
  // heater controller: output frozen while E-212 is stopped (no wind-up), so a restart is smooth
  const op212 = C['TIC-212'].op; pidStep(C['TIC-212'], D['TIC-212'], p.T211, dt); if (!E.HTR) C['TIC-212'].op = op212;
  // pressure (gas inventory)
  const disGas = 0.1 * p.rMZ + 0.3;
  p.P211 = clamp(p.P211 + (p.F201 + p.F212 + p.Fmk + p.F203 / 1000 + N.gas - p.rMZ - disGas - p.Fvent) * 0.0012 * dt, 0, 45);
  p.pvap = SZ.pvap(p.T211);
  p.dew = p.pvap - (p.P211 + 1.013);
  if (p.dew < 0.5 && E.K211) { SZ.tripEq(S, 'K211', 'Liquid carry-over protection: dew-point margin < 0.5 bar. Lower PIC-211 SP until the margin is > 3 bar, then restart.'); SZ.log(S, 'SIS', 'K-211 tripped: liquid carry-over (dew-point margin < 0.5 bar)'); }

  // ===== AREA 300 — HP flash D-301 =====
  const gasIn = disGas + p.Fvent + (E.GPR ? 0.3 : 0);
  p.F301 = C['PIC-301'].op / 100 * SPAN.PV301;
  p.P301 = clamp(p.P301 + (gasIn - p.F301) * 0.004 * dt, 0, 30);
  pidStep(C['PIC-301'], D['PIC-301'], p.P301, dt);
  p.T301 = lag(p.T301, 62 + 0.1 * (p.T211 - 80), 300, dt);

  // ===== AREA 400 — gas-phase reactor R-401 (HECO) =====
  const svc = E.GPR;
  p.actG = lag(p.actG, svc ? (p.rMZ / 30) * (1 - p.kill) : 0, 600, dt);
  if (!svc) { C['LIC-401'].mode = 'MAN'; C['LIC-401'].op = 0; }
  pidStep(C['PIC-401'], D['PIC-401'], p.P401, dt);
  pidStep(C['AIC-401'], D['AIC-401'], p.c2r, dt);
  pidStep(C['AIC-402'], D['AIC-402'], p.h2c2, dt);
  pidStep(C['LIC-401'], D['LIC-401'], p.lvl401, dt);
  if (!F.lv401Stuck) p.lv401 = C['LIC-401'].op; else if (p.lv401 === undefined) p.lv401 = C['LIC-401'].op;
  p.mk401 = lag(p.mk401, C['PIC-401'].op / 100 * SPAN.MK401, 5, dt);
  p.C2f401 = lag(p.C2f401, C['AIC-401'].op / 100 * SPAN.C2_401, 5, dt);
  p.H2f401 = lag(p.H2f401, C['AIC-402'].op / 100 * SPAN.H2_401, 5, dt);
  if (svc) {
    const fT4 = Math.exp(5000 * (1 / 348.15 - 1 / (p.T401 + 273.15))) * Math.exp(-0.1 * Math.max(0, p.T401 - 90));
    p.rG = 3.75 * p.actG * Math.max(0, (p.P401 + 1) / 15) * (1 + 1.5 * p.c2r) * (p.lvl401 / 60) * fT4 * (E.K401 ? 1 : 0.4) * (1 - p.chunk / 200) * (1 + N.actG);
    p.c2r = lag(p.c2r, p.C2f401 / (p.C2f401 + p.mk401 + 0.01), 600, dt);
    p.h2c2 = lag(p.h2c2, 14 * p.H2f401 / (1000 * Math.max(p.C2f401, 0.05)), 300, dt);
    p.P401 = clamp(p.P401 + (p.mk401 + p.C2f401 - p.rG - 0.3) * 0.003 * dt, 0, 25);
    const k401f = E.K401 ? 1 : 0.1;
    const Qr4 = p.rG * 1000 * K.dHpoly / 3600;
    const Qc4 = K.UA401 * C['TIC-401'].op / 100 * Math.max(0, p.T401 - p.cwT) * cwf * k401f * (1 - 0.5 * p.chunk / 100);
    p.T401 += (Qr4 - Qc4 - 0.004 * (p.T401 - 25)) / K.C401 * dt;
    p.dis401 = p.lv401 / 100 * SPAN.LV401 * Math.min(1, p.M401 / 3);
    p.M401 = Math.max(0, p.M401 + (p.rMZ + p.rG - p.dis401) * dt / 3600);
  } else { p.rG = 0; p.dis401 = 0; }
  p.lvl401 = p.M401 / K.gprBed_t * 100;
  pidStep(C['TIC-401'], D['TIC-401'], p.T401, dt);
  const rubFrac = svc ? p.rG / Math.max(p.rMZ + p.rG, 0.1) : 0;
  const dChunk = (svc ? (rubFrac > 0.25 ? 4 : 0) + (p.T401 > 85 ? (p.T401 - 85) : 0) + (!E.K401 ? 6 : 0) : 0);
  p.chunk = clamp(p.chunk + (dChunk - (dChunk === 0 ? 0.5 : 0)) * dt / 60, 0, 100);

  // ===== AREA 500/600 — steamer, silo, extruder =====
  const powder = svc ? p.dis401 : p.rMZ;
  p.D501in = lag(p.D501in, powder, 600, dt);
  p.silo = clamp(p.silo + (p.D501in - p.exRate) * dt / 3600, 0, K.silo_t);
  p.siloLvl = p.silo / K.silo_t * 100;
  pidStep(C['LIC-601'], D['LIC-601'], p.siloLvl, dt);
  p.exRate = lag(p.exRate, E.EX601 ? C['LIC-601'].op / 100 * SPAN.EX601 * (p.silo > 0.5 ? 1 : 0) : 0, 30, dt);
  p.prodTot = p.rMZ + p.rG;
  p.mileage = p.catMeas > 0.01 ? p.prodTot / p.catMeas : 0;

  // fouling: sticky product (XS too high for T) or poor circulation / K-211 stop
  const xsLimit = 12 - 0.15 * (p.T211 - 70);
  p.sticky = (p.xsMZ || 0) - xsLimit;     // matrix made in R-211 (rubber is made later in R-401)
  const dF = (p.sticky > 0 ? 2 * p.sticky : 0) + (circ < 30 && p.rMZ > 2 ? (30 - circ) * 0.2 : 0) + (!E.K211 && p.rMZ > 2 ? 5 : 0);
  p.foul = clamp(p.foul + dF * dt / 60 * 0.5, 0, 100);

  // CO kill dynamics
  const ks = S.sis.kill;
  if (ks === 'INJECTED') p.kill = lag(p.kill, 1, 30, dt);
  else if (ks === 'PURGE') { p.kill = lag(p.kill, 0, 900, dt); if (p.kill < 0.02) { S.sis.kill = 'NORMAL'; p.kill = 0; SZ.log(S, 'SIS', 'XV-901 purge complete — kill system NORMAL'); } }

  // ===== pressure relief: PSVs lift at set pressure, reseat at blowdown, relieve to the flare header
  SZ.relief(S, dt);

  // ===== properties & SIS
  SZ.props(S, dt);
  SZ.sis(S, dt);
};

/* ---------------- 4a. PROCESS NOISE ----------------
   Real plants are never perfectly steady. Slow random drifts (Ornstein-Uhlenbeck processes) act on
   catalyst activity, CW temperature, feed vaporisation, H2 uptake and the reactor gas balance, plus
   a daily cooling-water temperature cycle. Transmitters add small filtered jitter (in pidStep).
   [sigma, time constant s] — sigma is a fraction, except cw (°C) and gas (t/h).                     */
SZ.gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
const NZ = { act: [0.012, 1200], actG: [0.02, 900], cw: [0.5, 1800], qf: [0.025, 300], h2: [0.02, 600], gas: [0.12, 120] };
SZ.noise = function (S, dt) {
  const on = S.noiseOn !== false; SZ.mnoise = on;
  const n = S.nz || (S.nz = {});
  for (const k in NZ) {
    const [sig, tau] = NZ[k], x = n[k] || 0;
    n[k] = on ? x - x * dt / tau + sig * Math.sqrt(2 * dt / tau) * SZ.gauss() : x * (1 - Math.min(1, dt / 60));
  }
  n.cwd = on ? 0.8 * Math.sin(S.t * 2 * Math.PI / 86400) : 0;   // ±0.8 °C day/night CW cycle
};

/* ---------------- 4b. PRESSURE RELIEF & FLARE ----------------
   Live PSVs act on the gas-inventory pressure of their vessel. Static devices are shown on the
   graphics (thermal reliefs, PRVs, blowdown valve) but are not operated in this version.          */
SZ.PSV = {
  'PSV-211': { d: 'R-211 MZCR reactor relief valve', p: 'P211', set: 34, reseat: 31, cap: 30, k: 0.0012, page: 'mzcr' },
  'PSV-301': { d: 'D-301 HP flash drum relief valve', p: 'P301', set: 24, reseat: 21.5, cap: 12, k: 0.004, page: 'flash' },
  'PSV-401': { d: 'R-401 GPR relief valve', p: 'P401', set: 20, reseat: 18, cap: 10, k: 0.003, page: 'gpr' }
};
SZ.PSV_STATIC = {
  'PSV-102': ['D-102 TEAL drum relief (to flare)', 'catalyst', '10 barg'], 'PSV-212': ['E-211 cooling-water side thermal relief', 'mzcr', '10 barg'],
  'PSV-501': ['D-501 steamer relief (to atmosphere, safe location)', 'finishing', '3.5 barg'], 'PRV-801': ['LP steam header pressure-reducing valve', 'utilities', '4 barg out'],
  'PRV-802': ['Nitrogen header pressure-reducing valve', 'utilities', '7 barg out'], 'PSV-701': ['CW header relief', 'utilities', '6 barg'],
  'BDV-211': ['R-211 emergency depressuring (blowdown) valve — fail open, normally closed', 'mzcr', 'manual / ESD']
};
SZ.relief = function (S, dt) {
  const p = S.p; S.psv = S.psv || {};
  let load = 0;
  for (const tag in SZ.PSV) {
    const v = SZ.PSV[tag], st = S.psv[tag] || (S.psv[tag] = { open: false, n: 0, f: 0 }), P = p[v.p];
    if (!st.open && P >= v.set) {
      st.open = true; st.n++; st.t = S.t;
      SZ.log(S, 'SIS', tag + ' LIFTED at ' + P.toFixed(1) + ' barg (set ' + v.set + ') — relieving to flare');
      SZ.alert(S, 'psv', tag, tag + ' LIFTED — relieving to flare', v.d + ' opened at ' + P.toFixed(1) + ' barg (set pressure ' + v.set + ' barg). Find and remove the cause of the overpressure.');
    } else if (st.open && P <= v.reseat) { st.open = false; SZ.log(S, 'SIS', tag + ' reseated at ' + P.toFixed(1) + ' barg'); }
    st.f = st.open ? v.cap * clamp(0.35 + 0.65 * (P - v.reseat) / (v.set - v.reseat), 0.2, 1) : 0;
    if (st.f > 0) p[v.p] = Math.max(0, P - st.f * v.k * dt);
    load += st.f;
  }
  p.flareRelief = load;
  // trip flaring: compressor / reactor trips dump gas to the flare as a burst that decays (≈ 5 min)
  p.fb = Math.max(0, (p.fb || 0) * (1 - dt / 300));
  if (p.fb < 0.05) p.fb = 0;
  p.flare = lag(p.flare || 0.3, 0.3 + load + p.fb, 8, dt);   // 0.3 t/h purge + sweep gas
  p.flareCap = 60;                                            // flare design capacity, t/h
  p.koLvl = clamp(lag(p.koLvl == null ? 12 : p.koLvl, 12 + Math.min(load, 40) * 1.2, 600, dt), 0, 100);
};

/* equipment trips and on-screen alerts */
SZ.flareBurst = function (S, tph) { S.p.fb = Math.min(80, (S.p.fb || 0) + tph); };
SZ.alert = function (S, kind, tag, title, msg) {
  S.alerts = S.alerts || []; S.alertSeq = (S.alertSeq || 0) + 1;
  S.alerts.unshift({ id: S.alertSeq, t: S.t, kind, tag, title, msg, closed: false });
  if (S.alerts.length > 30) S.alerts.length = 30;
};
SZ.tripEq = function (S, eq, why) {
  if (!S.eq[eq] && S.trip && S.trip[eq]) return;
  S.eq[eq] = false; S.trip = S.trip || {}; S.trip[eq] = { t: S.t, why };
  // gas sent to flare by the trip (t/h burst, decays over ≈ 5 min); only if the plant is pressurised
  const burst = { K211: 10, K401: S.eq.GPR ? 6 : 0, P701: 3 }[eq] || 0;
  if (burst && S.p.P211 > 10) SZ.flareBurst(S, burst);
  const nm = (SZ.EQ[eq] && SZ.EQ[eq].d) || eq;
  SZ.alert(S, 'trip', eq, 'TRIP — ' + nm, why);
};

/* ---------------- 5. PRODUCT PROPERTIES ---------------- */
SZ.props = function (S, dt) {
  const p = S.p;
  if (p.rMZ >= 0.5) calcInst(S);   // no polymer being made → last properties are held
  for (const k in p.inst) {
    if (k === 'MFR') p.pel.MFR = Math.exp(lag(Math.log(Math.max(p.pel.MFR, 1e-3)), Math.log(Math.max(p.inst.MFR, 1e-3)), 900, dt));
    else p.pel[k] = lag(p.pel[k], p.inst[k], 900, dt);
  }
  // on/off-spec tonnes on pellets leaving the extruder
  const ok = SZ.inSpec(p.pel, S.target).all && S.eq.STEAM && SZ.addOk(S);
  const tons = p.exRate * dt / 3600;
  if (ok) S.tons.on += tons; else S.tons.off += tons;
  p.pelOk = ok;
};
function calcInst(S) {
  const p = S.p, fD = p.fracD;
  const a = DONOR.C.a * (1 - fD) + DONOR.D.a * fD, n = DONOR.C.n * (1 - fD) + DONOR.D.n * fD;
  const c2wt = clamp(100 * 0.9 * (p.C2gas / 1000) / Math.max(p.rMZ, 1), 0, 12);
  const tF = 1 + 0.01 * (p.T211 - 80), cF = 1 + 0.03 * c2wt;
  p.MFRr = a * Math.pow(Math.max(p.H2r, 0.01), n) * tF * cF;
  p.MFRd = a * Math.pow(Math.max(p.H2d, 0.005), n) * tF * cF;
  const w = K.wDown;
  const mfrMZ = Math.exp((1 - w) * Math.log(p.MFRr) + w * Math.log(p.MFRd));
  const pi0 = DONOR.C.pi0 * (1 - fD) + DONOR.D.pi0 * fD;
  const PI = pi0 + 0.6 * Math.abs(Math.log(p.MFRr / p.MFRd));
  const xs0 = DONOR.C.xs0 * (1 - fD) + DONOR.D.xs0 * fD, xsK = DONOR.C.xsK * (1 - fD) + DONOR.D.xsK * fD;
  const xsMZ = Math.max(0.8, xs0 + xsK * Math.log(p.donRatioAct / 10) + 0.04 * (80 - p.T211) + 1.6 * c2wt);
  // GPR rubber
  const svc = S.eq.GPR;
  const wR = svc ? p.rG / Math.max(p.rMZ + p.rG, 0.1) : 0;
  const y = p.c2r, xm = 1.6 * y / (1.6 * y + (1 - y) + 1e-9);
  const c2epr = 100 * 28 * xm / (28 * xm + 42 * (1 - xm) + 1e-9);
  const mfrRub = 3 * Math.pow(Math.max(p.h2c2, 0.002) / 0.05, 1.2);
  const mfr = wR > 0.001 ? Math.exp((1 - wR) * Math.log(mfrMZ) + wR * Math.log(mfrRub)) : mfrMZ;
  const cfac = clamp(1 - Math.abs(c2epr - 45) / 80, 0.3, 1);
  const inst = p.inst;
  inst.MFR = mfr; inst.PI = PI; inst.C2 = c2wt * (1 - wR) + c2epr * wR; inst.RUB = wR * 100;
  inst.XS = (1 - wR) * xsMZ + wR * 90;
  inst.IZOD = 2.2 + 0.08 * (PI - 4) + 0.4 * c2wt + 0.5 * wR * 100 * cfac;
  inst.FLEX = 1500 + 70 * (PI - 4) - 25 * (xsMZ - 2.5 - 1.6 * c2wt) - 80 * c2wt - 22 * wR * 100;
  inst.TM = 163 - 5 * c2wt;
  p.c2epr = c2epr; p.c2MZ = c2wt; p.mfrMZ = mfrMZ; p.xsMZ = xsMZ; p.mfrRub = mfrRub;
}

SZ.inSpec = function (props, grade) {
  const g = SZ.GRADES[grade], r = { all: true };
  if (!g) return r;
  for (const k in g.spec) { const [lo, hi] = g.spec[k]; const v = props[k]; const ok = v >= lo && v <= hi; r[k] = ok; if (!ok) r.all = false; }
  return r;
};
SZ.addOk = function (S) {
  const g = SZ.GRADES[S.target]; if (!g) return true;
  for (const k in g.add) { const t = g.add[k]; if (Math.abs((S.add[k] || 0) - t) > Math.max(50, 0.1 * t)) return false; }
  return true;
};

/* ---------------- 6. SAFETY INSTRUMENTED SYSTEM ---------------- */
SZ.sis = function (S, dt) {
  const p = S.p, s = S.sis, E = S.eq;
  s.k211StopT = (!E.K211 && p.rMZ > 1) ? s.k211StopT + dt : 0;
  const trip = (why) => {
    if (s.kill === 'INJECTED') return;
    if (s.bypass) { if (s.lastTrip !== why) { s.lastTrip = why; SZ.log(S, 'SIS', 'BYPASSED trip demand: ' + why); } return; }
    s.kill = 'INJECTED'; s.lastTrip = why; SZ.log(S, 'SIS', 'CO KILL XV-901 INJECTED — ' + why); if (S.p.P211 > 10) SZ.flareBurst(S, 15); SZ.alert(S, 'sis', 'XV-901', 'SIS TRIP — CO KILL INJECTED', why + '. Reaction stopped. Find the cause, then follow the restart checklist (manual §8.7).');
    S.ctl['FIC-101'].mode = 'MAN'; S.ctl['FIC-101'].op = 0;
  };
  if (E.HTR && p.T211 >= 85) { SZ.tripEq(S, 'HTR', 'TSH-212 high temperature: R-211 reached 85 °C. Put TIC-212 in AUTO at recipe − 2 °C (78) so the heater throttles itself instead of running flat out; stop it after light-off (> 5 t/h, TIC-212 OP < 10 %).'); SZ.log(S, 'SIS', 'TSH-212 E-212 start-up heater tripped at 85 °C'); }
  if (p.T211 >= 92) trip('TZHH-211 MZCR temperature ≥ 92 °C');
  if (E.GPR && p.T401 >= 95) trip('TZHH-401 GPR temperature ≥ 95 °C');
  if (s.k211StopT > 60) trip('K-211 stopped > 60 s');
  if (p.siloLvl >= 95 && !s.catCut) {
    if (s.bypass) { if (s.lastTrip !== 'silo') { s.lastTrip = 'silo'; SZ.log(S, 'SIS', 'BYPASSED trip demand: silo ≥ 95 %'); } }
    else { s.catCut = true; SZ.log(S, 'SIS', 'LZHH-601 silo ≥ 95 % — catalyst feed CUT'); SZ.alert(S, 'sis', 'FIC-101', 'SIS TRIP — CATALYST FEED CUT', 'LZHH-601: silo D-601 reached 95 %. Restore the extruder, lower the silo below 90 %, then reset the cut on the FIC-101 faceplate.'); }
  }
};

/* ---------------- 7. RECIPE SOLVER ---------------- */
// Solves riser H2 for the target MFR (given barrier and donor) and catalyst flow for ~30 t/h.
SZ.solveRecipe = function (grade) {
  const g = SZ.GRADES[grade], d = DONOR[g.donor];
  const eff = 1 - Math.exp(-g.barrier / 2.5);
  const cF = (1 + 0.03 * g.c2) * (1 + 0.01 * (g.T - 80));
  const H2r = Math.pow(g.mfr / (d.a * cF * Math.pow(1 - eff, K.wDown * d.n)), 1 / d.n);
  const act = SZ.activity({ T: g.T, tealRatio: g.tealCat, donRatio: g.tealDon, H2r: H2r, P: g.P, c2wt: g.c2 });
  const cat = 30 / (K.mileage * act);
  const ethyl = g.c2 / 100 * 30 * 1000 / 0.9;
  const r = { grade, H2r, cat, ethyl, barrier: g.barrier, T: g.T, P: g.P, tealCat: g.tealCat, tealDon: g.tealDon, donor: g.donor, gpr: g.gpr, circ: g.circ };
  if (g.gpr) Object.assign(r, { gprT: g.gprT, gprP: g.gprP, c2ratio: g.c2ratio, h2c2: g.h2c2, gprLvl: g.gprLvl });
  return r;
};

/* list of SP items a recipe sets: [label, tag or key, value, unit] */
SZ.recipeItems = function (grade) {
  const r = SZ.solveRecipe(grade);
  const it = [
    ['External donor', 'donor', r.donor, ''],
    ['Catalyst FIC-101', 'FIC-101', r.cat, 'kg/h'],
    ['TEAL/cat FFIC-102', 'FFIC-102', r.tealCat, 'g/g'],
    ['TEAL/donor FFIC-103', 'FFIC-103', r.tealDon, 'g/g'],
    ['MZCR T TIC-211', 'TIC-211', r.T, '°C'],
    ['Heater E-212 TIC-212', 'TIC-212', r.T - 2, '°C'],
    ['MZCR P PIC-211', 'PIC-211', r.P, 'barg'],
    ['Riser H2 AIC-211', 'AIC-211', r.H2r, 'mol%'],
    ['Barrier FIC-212', 'FIC-212', r.barrier, 't/h'],
    ['Circulation HIC-213', 'HIC-213', r.circ, '%'],
    ['Ethylene FIC-203', 'FIC-203', r.ethyl, 'kg/h'],
    ['GPR in service', 'GPR', r.gpr ? 'SERVICE' : 'BYPASS', '']
  ];
  if (r.gpr) it.push(['GPR T TIC-401', 'TIC-401', r.gprT, '°C'], ['GPR P PIC-401', 'PIC-401', r.gprP, 'barg'],
    ['C2/(C2+C3) AIC-401', 'AIC-401', r.c2ratio, ''], ['H2/C2 AIC-402', 'AIC-402', r.h2c2, ''], ['GPR level LIC-401', 'LIC-401', r.gprLvl, '%']);
  return it;
};

/* ---------------- 1. JOURNAL & ALARMS ---------------- */

  ['LAHH601', 'LIC-601', 1, 'Silo D-601 level HH ≥ 95 %', 'finishing', (S) => S.p.siloLvl >= 95],

SZ.ALM = ALM;

// State-based alarm suppression (ISA-18.2): alarms that are meaningless while the plant is down
const SUP_IDLE = new Set(['K211', 'P701', 'TEALP', 'FDV101', 'FFL102']);                        // no reaction & no catalyst
const SUP_LOW = new Set(['PRODL', 'PAL211', 'PAL301', 'LAL601', 'EX601', 'STEAM', 'OFFSPEC', 'GRADE', 'ADV211']);  // < 5 t/h

/* ---------------- 3. COMMANDS (operator + instructor) ---------------- */
const MOTOR_FAIL = { P701: 'cwTrip', K211: 'k211Trip', K401: 'k401Trip', EX601: 'exTrip', TEALP: 'tealTrip' };
const n = (v, d) => (+v).toFixed(d == null ? 2 : d);

SZ.recipeDiffCount = function (S) {
  let c = 0;
  for (const [, key, val] of SZ.recipeItems(S.target)) { const cur = SZ.currentValue(S, key); if (!SZ.sameVal(cur, val)) c++; }

SZ.currentValue = function (S, key) {

};

SZ.exec = function (S, c) {
  const src = c.src || 'OPERATOR', C = S.ctl, def = SZ.CTL[c.tag];
  const L = (m) => SZ.log(S, src, m);
  switch (c.type) {
    case 'sp': { if (!C[c.tag] || def.hand) return; const o = C[c.tag].sp; C[c.tag].sp = SZ.clamp(+c.v, def.lo, def.hi); L(c.tag + ' SP ' + n(o, def.dec) + ' → ' + n(C[c.tag].sp, def.dec)); break; }
    case 'op': { if (!C[c.tag]) return; if (C[c.tag].mode !== 'MAN') { L(c.tag + ' OP entry refused (not MAN)'); return; } const o = C[c.tag].op; C[c.tag].op = SZ.clamp(+c.v, 0, 100); L(c.tag + ' OP ' + n(o, 1) + ' → ' + n(C[c.tag].op, 1) + ' %'); break; }
    case 'mode': { if (!C[c.tag] || def.hand) return; if (c.tag === 'FIC-101' && S.sis.catCut && c.m === 'AUTO') { L('FIC-101 AUTO refused — SIS catalyst cut active'); return; }
      if (c.tag === 'LIC-401' && !S.eq.GPR && c.m === 'AUTO') { L('LIC-401 AUTO refused — GPR bypassed'); return; }
      C[c.tag].mode = c.m; C[c.tag].e1 = C[c.tag].e2 = 0; L(c.tag + ' mode → ' + c.m); break; }
    case 'nudge': { const x = C[c.tag]; if (!x) return; if (x.mode === 'AUTO' && !def.hand) { x.sp = SZ.clamp(x.sp + c.dir * (def.hi - def.lo) * 0.005, def.lo, def.hi); L(c.tag + ' SP nudge → ' + n(x.sp, def.dec)); }
      else { x.op = SZ.clamp(x.op + c.dir, 0, 100); L(c.tag + ' OP nudge → ' + n(x.op, 1) + ' %'); } break; }
    case 'motor': { const f = MOTOR_FAIL[c.eq]; if (c.on && f && S.fail[f]) { L(SZ.EQ[c.eq].d + ' START refused — motor tripped (MCC lock-out)'); return; }
      if (c.eq === 'CATF' && c.on && S.sis.catCut) { L('Catalyst feeder START refused — SIS cut active'); return; }
      if (c.eq === 'HTR' && c.on && !S.eq.K211) { L('E-212 heater START refused — K-211 not running (no cycle-gas flow)'); return; }
      if (c.eq === 'HTR' && c.on && S.p.T211 >= 85) { L('E-212 heater START refused — R-211 above 85 °C'); return; }
      S.eq[c.eq] = !!c.on; if (S.trip) delete S.trip[c.eq]; L(SZ.EQ[c.eq].d + (c.on ? ' START' : ' STOP')); break; }
    case 'gpr': { S.eq.GPR = !!c.on; if (c.on) { S.eq.K401 = !S.fail.k401Trip; } L('HS-302 GPR R-401 → ' + (c.on ? 'IN SERVICE' : 'BYPASS')); break; }
    case 'donor': { S.donor = c.v; L('External donor drum switched to ' + c.v + '-donor'); break; }
    case 'kill': { const k = S.sis;
      if (c.a === 'ARM' && k.kill === 'NORMAL') k.kill = 'ARMED';
      else if (c.a === 'DISARM' && k.kill === 'ARMED') k.kill = 'NORMAL';
      else if (c.a === 'INJECT' && k.kill === 'ARMED') { k.kill = 'INJECTED'; if (S.p.P211 > 10) SZ.flareBurst(S, 15); C['FIC-101'].mode = 'MAN'; C['FIC-101'].op = 0; }
      else if (c.a === 'RESET' && k.kill === 'INJECTED') k.kill = 'PURGE';
      else { L('XV-901 ' + c.a + ' not allowed in state ' + k.kill); return; }
      L('XV-901 CO kill ' + c.a + ' → ' + k.kill); break; }
    case 'recipe': if (S.level === 'hard' && src !== 'INSTRUCTOR') { L('Apply recipe refused — HARD mode (enter SPs from the manual)'); return; } SZ.applyRecipe(S, c.grade); L('Recipe SPs applied for grade ' + c.grade); break;
    case 'target': S.target = c.grade; L('Target grade set to ' + c.grade); break;
    case 'add': { const o = S.add[c.k]; S.add[c.k] = Math.max(0, +c.v); L('Additive ' + c.k + ' ' + o + ' → ' + S.add[c.k] + ' ppm'); break; }
    case 'speed': S.speed = +c.v; L('Simulation speed ' + c.v + '×'); break;
    case 'freeze': S.frozen = !!c.on; L(c.on ? 'Simulation FROZEN' : 'Simulation RUN'); break;
    case 'ack': SZ.ackAlarm(S, c.id || 'ALL'); if (c.id === 'ALL' || !c.id) L('Alarms acknowledged (all)'); break;
    case 'noise': S.noiseOn = !!c.on; L('Process noise / disturbances ' + (c.on ? 'ON' : 'OFF')); break;
    case 'alertClose': { for (const a of (S.alerts || [])) if (c.id === 'ALL' || a.id === c.id) { a.closed = true; if (c.ack) SZ.ackAlarm(S, 'ALL'); } return; }
    case 'spot': takeSample(S, 'SPOT'); L('Spot sample taken'); break;
    case 'level': { const v = c.v === 'hard' ? 'hard' : 'easy'; if (S.level === v) return; S.level = v; L('Difficulty set to ' + v.toUpperCase() + (v === 'hard' ? ' — recipe hints hidden' : ' — recipe hints shown')); if (S.proc && S.proc.complete == null && v === 'easy') S.proc.easyUsed = true; break; }
    case 'sisReset': if (S.p.siloLvl < 90) { S.sis.catCut = false; L('SIS catalyst cut RESET'); } else L('SIS reset refused — silo level ≥ 90 %'); break;
    // ---- instructor
    case 'fail': SZ.applyFail(S, c.name, c.on, 'INSTRUCTOR'); break;
    case 'clearFails': for (const f in S.fail) if (S.fail[f]) SZ.applyFail(S, f, false, 'INSTRUCTOR'); S.sched = []; break;
    case 'poison': S.poison[c.k] = Math.max(0, +c.v); L('Feed poison ' + c.k + ' = ' + c.v + ' ppm'); break;
    case 'sisBypass': S.sis.bypass = !!c.on; L('SIS bypass ' + (c.on ? 'ON' : 'OFF')); break;
    case 'resetFoul': S.p.foul = 0; S.p.chunk = 0; L('Fouling / chunk indices reset'); break;
  }
};

SZ.procEval = function (S) {
  const pr = S.proc; if (!pr || pr.complete != null) return;
  const steps = SZ.PROCS[pr.id].steps;
  while (pr.i < steps.length) {
    let ok = false; try { ok = !!steps[pr.i][2](S); } catch (e) { ok = false; }
    if (!ok) break;
    pr.done[pr.i] = S.t; SZ.log(S, 'PROCEDURE', 'Step ' + (pr.i + 1) + ' done: ' + steps[pr.i][0]); pr.i++;
  }
  if (pr.i >= steps.length) {
    pr.complete = S.t; pr.trips = S.journal.filter(j => j.src === 'SIS' && /INJECTED|tripped|CUT/.test(j.msg)).length;
    SZ.log(S, 'PROCEDURE', SZ.PROCS[pr.id].title + ' COMPLETE in ' + fmtT(S.t - pr.t0) + ' · off-spec ' + S.tons.off.toFixed(0) + ' t · SIS trips ' + pr.trips + ' · ' + (pr.easyUsed || S.level !== 'hard' ? 'EASY (recipe hints used)' : 'HARD mode'));
  }
};

/* ---- session start (chosen from the shift-handover menu) ---- */
SZ.startSession = function (c, prev) {
  let S;
  if (c.mode === 'steady') { S = SZ.initSteady(c.grade, prev); S.session = { mode: 'steady', title: 'Normal operation — steady state ' + c.grade, brief: 'Plant lined out at design rate. Free practice — no upset planned.' }; }
  else if (c.mode === 'startup') {
    S = SZ.initCold(c.grade, prev);
    S.session = { mode: 'startup', title: 'Full plant start-up from cold — ' + c.grade, brief: 'All equipment stopped, R-211 empty at 25 °C. Bring the plant up to rate and on-spec. Follow the procedure tracker (manual §8.4).' };
    S.proc = { id: 'startup', i: 0, done: [], t0: 0, complete: null };
  } else if (c.mode === 'shutdown') {
    S = SZ.initSteady(c.grade, prev);
    S.session = { mode: 'shutdown', title: 'Controlled plant shutdown — ' + c.grade, brief: 'Plant at steady state. Take it down safely to a stopped, depressurised condition. Follow the procedure tracker (manual §8.6).' };
    S.proc = { id: 'shutdown', i: 0, done: [], t0: 0, complete: null };
  } else return prev;
  SZ.log(S, 'INSTRUCTOR', 'Session started: ' + S.session.title);
  return S;
};

/* ---------------- 5. SHARED-STATE RUNTIME ----------------
   Every page runs the same simulation. One page (the "leader") integrates the model and
   saves state to localStorage (+ window.name as same-tab fallback); other open pages follow
   and send their operator actions through a command queue.                           */
const KEY = 'szsim.state', LKEY = 'szsim.leader', QKEY = 'szsim.cmdq', SNAP = 'szsim.snap';
const rt = SZ.rt = { id: Math.random().toString(36).slice(2), leader: false, S: null, last: Date.now(), lastSave: 0, lastLoad: 0, ls: true, listeners: [] };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { rt.ls = false; return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { rt.ls = false; return false; } }
function parse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function loadState() {
  let a = parse(lsGet(KEY)), b = null;
  if (typeof window.name === 'string' && window.name.startsWith('SZSIM:')) b = parse(window.name.slice(6));
  let S = a; if (b && (!a || (b.savedAt || 0) > (a.savedAt || 0))) S = b;
  if (S && S.v === 3) return SZ.upgradeState(S);
  return null;
}
function saveState() {
  const S = rt.S; if (!S) return; S.savedAt = Date.now();
  const j = JSON.stringify(S); lsSet(KEY, j);
  try { window.name = 'SZSIM:' + j; } catch (e) { }
  rt.lastSave = Date.now();
}
SZ.save = saveState;
function becomeLeader() {
  rt.leader = true;
  let S = loadState();
  if (!S) { S = SZ.initSteady('H-INJ'); }
  else if (!S.frozen && S.savedAt) { const real = Math.max(0, (Date.now() - S.savedAt) / 1000); SZ.advance(S, Math.min(real * S.speed, 7200)); }
  rt.S = S; rt.last = Date.now(); saveState();
}
// code version: a tab running newer simulator code always takes over from a tab with older code
SZ.CODE_VER = 162;
function heartbeat() { lsSet(LKEY, JSON.stringify({ id: rt.id, ts: Date.now(), ver: SZ.CODE_VER })); }
function drainQueue() {
  const q = parse(lsGet(QKEY)); if (!q || !q.length) return; lsSet(QKEY, '[]');
  for (const c of q) runCmd(c);
}
function runCmd(c) {
  const S = rt.S, lvl = c.level || (S && S.level) || 'easy';
  runCmd0(c, S);
  // a new plant (session, exercise, re-init, snapshot) keeps the chosen difficulty
  if (rt.S && rt.S !== S) {
    rt.S.level = lvl === 'hard' ? 'hard' : 'easy';
    if (rt.S.proc) rt.S.proc.easyUsed = rt.S.level !== 'hard';
    if (c.level) SZ.log(rt.S, 'INSTRUCTOR', 'Difficulty: ' + rt.S.level.toUpperCase());
  }
}
function runCmd0(c, S) {
  if (c.type === 'reinit') { rt.S = SZ.initSteady(c.grade, S); rt.S.session = { mode: 'steady', title: 'Normal operation — steady state ' + c.grade, brief: '' }; SZ.log(rt.S, 'INSTRUCTOR', 'Re-initialised (grade ' + c.grade + ')'); return; }

  tile(g2, 'Full plant start-up (cold)', 'Everything stopped, R-211 empty at 25 °C. Start utilities, heat up, pressurise, light off and bring the plant to rate and on-spec. Step tracker shown.', () => go({ type: 'session', mode: 'startup', grade: gsel.value }, 'Cold start-up ' + gsel.value), heco);
  tile(g2, 'Controlled plant shutdown', 'Plant at steady state. Stop the reaction, empty the silo, depressurise and stop the machines in a safe order. Step tracker shown.', () => go({ type: 'session', mode: 'shutdown', grade: gsel.value }, 'Shutdown from ' + gsel.value));
  const g3 = sec('Upset drills');
  const g4 = sec('Grade-change exercises');
  for (const ex of SZ.EXERCISES) {
    const isDrill = !!(ex.fail || ex.hidden || ex.poison);
    tile(isDrill ? g3 : g4, (isDrill ? 'Upset: ' : '') + ex.title, ex.brief + ' (starts on ' + ex.start + ')', () => go({ type: 'exercise', id: ex.id }, ex.title));
  }
  box.append(h('div', { class: 'hint', style: 'margin-top:8px' }, 'You can reopen this menu at any time with the ☰ SESSION button in the header. Instructors have more controls on the Instructor page.'));
  document.body.append(ov);
};

/* ---------------- 7. TREND RENDERER ---------------- */
UI.PEN = ['#1f5fbf', '#c0392b', '#2e7d32', '#8e44ad', '#d07a00', '#00838f'];
UI.drawTrend = function (cv, lg, S, keys, win, fixed) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = cv.clientHeight || +cv.getAttribute('height');
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const t = S.hist.t, t1 = S.t, t0 = t1 - win, padL = 4, padR = 4, padT = 6, padB = 16;
  x.strokeStyle = '#cfd1d3'; x.lineWidth = 1; x.font = '10px Segoe UI'; x.fillStyle = '#555';
  for (let i = 0; i <= 6; i++) { const xx = padL + (W - padL - padR) * i / 6; x.beginPath(); x.moveTo(xx, padT); x.lineTo(xx, H - padB); x.stroke();
    const tm = t0 + win * i / 6; x.textAlign = i === 0 ? 'left' : i === 6 ? 'right' : 'center'; x.fillText(SZ.fmtT(Math.max(0, tm)).slice(-8, -3), xx, H - 4); }
  for (let i = 0; i <= 4; i++) { const yy = padT + (H - padT - padB) * i / 4; x.beginPath(); x.moveTo(padL, yy); x.lineTo(W - padR, yy); x.stroke(); }
  if (lg) lg.innerHTML = '';
  keys.forEach((k, i) => {
    const d = S.hist.d[k] || [], def = SZ.HV[k];
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j < t.length; j++) if (t[j] >= t0) { lo = Math.min(lo, d[j]); hi = Math.max(hi, d[j]); }
    const cur = def[2](S); lo = Math.min(lo, cur); hi = Math.max(hi, cur);
    if (fixed && fixed[k]) { lo = fixed[k][0]; hi = fixed[k][1]; }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const pad = Math.max((hi - lo) * 0.1, Math.abs(hi) * 0.02, 0.05); lo -= pad; hi += pad;
    const X = (tt) => padL + (W - padL - padR) * (tt - t0) / win, Y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
    x.strokeStyle = UI.PEN[i % UI.PEN.length]; x.lineWidth = 1.6; x.beginPath(); let st = false;
    for (let j = 0; j < t.length; j++) { if (t[j] < t0) continue; const px = X(t[j]), py = Y(d[j]); if (!st) { x.moveTo(px, py); st = true; } else x.lineTo(px, py); }
    if (st) x.lineTo(X(t1), Y(cur)); x.stroke();
    if (lg) { lg.insertAdjacentHTML('beforeend', `<i style="background:${UI.PEN[i % UI.PEN.length]}"></i><span>${def[0]}</span><span class="v">${fx(cur, Math.abs(cur) < 10 ? 2 : 1)} ${def[1]}</span><span class="r">${fx(lo, 1)}–${fx(hi, 1)}</span>`); }
  });
};

/* ---------------- 8. ALARM BANNER ---------------- */
function buildBanner() {
  const b = $('#banner'); if (!b) return;
  const tb = h('table'); b.append(tb);
  UI.bind(tb, (S) => {
    const list = S.alarms.slice().sort((a, c) => (a.acked - c.acked) || (a.prio - c.prio) || (c.t - a.t)).slice(0, 3);
    if (!list.length) { tb.innerHTML = '<tr><td class="hint">No active alarms · <a href="alarms.html">alarm summary & event journal</a> · ' + SZ.fmtT(S.t) + '</td></tr>'; return; }
    tb.innerHTML = list.map(a => `<tr class="alm-row p${a.prio}${a.acked ? '' : ' unack'}${a.active ? '' : ' rtn'}" data-id="${a.id}" data-tag="${a.tag}"><td>P${a.prio}</td><td>${SZ.fmtT(a.t)}</td><td><b>${a.tag}</b></td><td class="msg">${a.msg}${a.active ? '' : ' (RTN)'}</td><td>${a.acked ? 'ACK' : 'UNACK'}</td></tr>`).join('') +
      (S.alarms.length > 3 ? `<tr><td colspan="5" class="hint">+${S.alarms.length - 3} more · <a href="alarms.html">alarm summary</a></td></tr>` : '');
  });
  tb.addEventListener('click', (e) => { const r = e.target.closest('tr[data-id]'); if (!r) return; SZ.cmd({ type: 'ack', id: r.dataset.id }); UI.go(r.dataset.tag); });
}

/* ---------------- 9. ALARM SOUNDS (Web Audio, synthesised — no sound files) ----------------
   P1: fast two-tone warble, repeats every 1.4 s until ACK / SILENCE
   P2: double beep, repeats every 4 s until ACK / SILENCE
   P3: single soft chime, once per new alarm
   Silence = horn off for the alarms standing now; any new alarm sounds again.                */
UI.audio = (function () {
  const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } };
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  const A = { ctx: null, on: ls('szsound') !== 'off', sounding: false, next: 0, cur: 0 };
  const silenced = new Set(JSON.parse(ss('szsil') || '[]')), played = new Set(JSON.parse(ss('szplayed') || '[]'));
  const keep = () => { ss('szsil', JSON.stringify([...silenced].slice(-200))); ss('szplayed', JSON.stringify([...played].slice(-200))); };
  const key = (a) => a.id + '@' + Math.round(a.t);
  function unlock() {
    if (!A.ctx) { try { A.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (A.ctx.state === 'suspended') A.ctx.resume();
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, true));
  function claimSound() { ls('szsndowner', JSON.stringify({ id: SZ.rt.id, ts: Date.now() })); }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, claimSound, true));
  window.addEventListener('focus', claimSound);
  function tone(f, t0, dur, type, vol, f2) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.linearRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.setValueAtTime(vol, t0 + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  A.play = function (p) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const t = A.ctx.currentTime + 0.02;
    if (p === 1) for (let i = 0; i < 6; i++) tone(i % 2 ? 700 : 1050, t + i * 0.14, 0.13, 'square', 0.10);
    else if (p === 2) { tone(620, t, 0.22, 'triangle', 0.22); tone(620, t + 0.32, 0.22, 'triangle', 0.22); }
    else tone(1046, t, 0.35, 'sine', 0.18, 784);
  };
  // PSV relief sound: filtered white noise — a "kshhhh" burst on lift, then a steady roar while relieving
  let hiss = null;
  function hissOn(level) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const c = A.ctx;
    if (!hiss) {
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
      const pk = c.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 4200; pk.Q.value = 0.8; pk.gain.value = 7;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 0.04);            // pop
      g.gain.exponentialRampToValueAtTime(0.12 + 0.16 * level, c.currentTime + 0.9);  // settle to roar
      src.connect(hp); hp.connect(pk); pk.connect(g); g.connect(c.destination); src.start();
      hiss = { src, g };
    } else hiss.g.gain.setTargetAtTime(0.12 + 0.16 * level, c.currentTime, 0.4);
  }
  function hissOff() { if (!hiss) return; const c = A.ctx, x = hiss; hiss = null; x.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.3); x.src.stop(c.currentTime + 1.5); }
  // flare roar: low-pass brown noise with a slow flicker; louder and deeper as flare load rises
  let roar = null;
  function roarOn(level) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const c = A.ctx, vol = 0.06 + 0.5 * level;
    if (!roar) {
      const len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260 + 380 * level; lp.Q.value = 0.7;
      const g = c.createGain(); g.gain.value = 0.0001;
      const flick = c.createGain(); flick.gain.value = 1;                    // flame flicker
      const lfo = c.createOscillator(); lfo.frequency.value = 2.3; const lfoG = c.createGain(); lfoG.gain.value = 0.25;
      lfo.connect(lfoG); lfoG.connect(flick.gain); lfo.start();
      src.connect(lp); lp.connect(flick); flick.connect(g); g.connect(c.destination); src.start();
      g.gain.setTargetAtTime(vol, c.currentTime, 0.6);
      roar = { src, g, lp, lfo };
    } else { roar.g.gain.setTargetAtTime(vol, c.currentTime, 0.8); roar.lp.frequency.setTargetAtTime(260 + 380 * level, c.currentTime, 0.8); }
  }
  function roarOff() { if (!roar) return; const c = A.ctx, x = roar; roar = null; x.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.8); x.src.stop(c.currentTime + 4); x.lfo.stop(c.currentTime + 4); }
  A.testRoar = () => { unlock(); setTimeout(() => { roarOn(0.5); setTimeout(roarOff, 3500); }, 60); };
  A.testHiss = () => { unlock(); setTimeout(() => { hissOn(0.6); setTimeout(hissOff, 2200); }, 60); };
  A.test = (p) => { unlock(); setTimeout(() => A.play(p), 60); };
  A.toggle = () => { A.on = !A.on; ls('szsound', A.on ? 'on' : 'off'); if (A.on) unlock(); SZ.render(); };
  A.silence = () => { const S = SZ.rt.S; if (!S) return; S.alarms.forEach(a => silenced.add(key(a))); keep(); A.sounding = false; SZ.render(); };
  A.update = function (S) {
    if (!S) return;
    const live = S.alarms.filter(a => a.active && !a.acked && !silenced.has(key(a)));
    const horn = live.filter(a => a.prio <= 2);
    const p = horn.length ? Math.min(...horn.map(a => a.prio)) : 0;
    A.sounding = p > 0;
    const relieving = S.psv ? Object.values(S.psv).filter(x => x.open) : [];
    A.relieving = relieving.length > 0;
    if (!A.on || document.hidden || S.frozen) { hissOff(); roarOff(); return; }
    // with several windows open, only one plays the horn: the last one you clicked or focused
    let o = null; try { o = JSON.parse(ls('szsndowner') || 'null'); } catch (e) { o = null; }
    if (!o || Date.now() - o.ts > 3000 || o.id === SZ.rt.id) claimSound(); else { hissOff(); roarOff(); return; }
    if (relieving.length) hissOn(Math.min(1, relieving.reduce((s, x) => s + x.f, 0) / 30)); else hissOff();
    const fl = S.p.flare || 0;                                    // flare roar above 1 t/h, full at ≈ 40 t/h
    if (fl > 1) roarOn(Math.min(1, (fl - 1) / 40)); else if (fl < 0.8) roarOff();
    const now = Date.now();
    if (p && (now >= A.next || p < A.cur)) { A.play(p); A.cur = p; A.next = now + (p === 1 ? 1400 : 4000); }
    if (!p) A.cur = 0;
    const fresh = live.filter(a => a.prio === 3 && !played.has(key(a)));
    if (fresh.length) { fresh.forEach(a => played.add(key(a))); keep(); if (!p) A.play(3); }
  };
  return A;
})();

/* ---------------- 10. POP-OUT WINDOWS ----------------
   Any page opened with ?pop=1 becomes a compact window (no page tabs, no side panel)
   that follows the same live simulation — put alarms or trends on a second screen.   */
UI.isPop = new URLSearchParams(location.search).has('pop');
UI.popout = function (page, hash, w, hh) {

};
UI.POPS = [['alarms', '', 'Alarm summary & journal', 1000, 620], ['trends', '', 'Trends (all groups)', 1100, 800],
  ['trends', 'temps', 'Trend — temperatures', 760, 460], ['trends', 'press', 'Trend — pressure vs dew point', 760, 460],
  ['trends', 'prod', 'Trend — production', 760, 460], ['index', '', 'Plant overview graphic', 1200, 760]];
function popMenuButton() {

  b.addEventListener('click', (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'none' ? '' : 'none'; });
  document.addEventListener('click', () => menu.style.display = 'none');
  wrap.append(b, menu); return wrap;
}

/* ---------------- 11. SAFETY ALERT POP-UP ----------------
   Equipment trips, PSV lifts and SIS trips open a large alert over the screen. Closing it is shared
   by all open windows. The alarm horn keeps going until the alarm itself is acknowledged.       */
let alertSig = '';
UI.alertUpdate = function (S) {
  const open = (S.alerts || []).filter(a => !a.closed);
  const sig = open.map(a => a.id).join(',');
  if (sig === alertSig) return; alertSig = sig;
  let ov = $('#szalert');
  if (!open.length) { if (ov) ov.remove(); return; }
  const a = open[0];
  if (!ov) { ov = h('div', { id: 'szalert' }); document.body.append(ov); }
  const kindTxt = { trip: 'EQUIPMENT TRIP', psv: 'PRESSURE RELIEF', sis: 'SAFETY SYSTEM' }[a.kind] || 'ALERT';
  const tag = EQTAG[a.tag] || a.tag;
  ov.className = 'k-' + a.kind;
  ov.innerHTML = `<div class="ab"><div class="ah"><span class="blink">⚠</span> ${kindTxt}<span class="at">${SZ.fmtT(a.t)}</span></div>
    <div class="abd"><div class="att">${a.title}</div><div class="amsg">${a.msg}</div>
    ${open.length > 1 ? `<div class="amore">+ ${open.length - 1} more alert${open.length > 2 ? 's' : ''} waiting</div>` : ''}</div>
    <div class="abtn"><button data-a="go">Go to ${tag}</button><button data-a="close">Close</button><button data-a="ack" class="on">Close + ACK alarms</button>${open.length > 1 ? '<button data-a="all">Close all</button>' : ''}</div></div>`;
  ov.querySelector('.abtn').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'go') { SZ.cmd({ type: 'alertClose', id: a.id }); UI.go(tag); }
    if (b.dataset.a === 'close') SZ.cmd({ type: 'alertClose', id: a.id });
    if (b.dataset.a === 'ack') SZ.cmd({ type: 'alertClose', id: a.id, ack: true });
    if (b.dataset.a === 'all') SZ.cmd({ type: 'alertClose', id: 'ALL' });
  });
};

/* ---------------- 12. APP INSTALL & AUTOMATIC UPDATES ----------------
   When served over http(s) (GitHub Pages or the local launcher) the simulator registers a service
   worker (sw.js): pages load fresh when online and still work offline. version.json is checked every
   10 min; if a newer version has been published, a banner offers to reload. Browsers that support it
   show an INSTALL APP button so the simulator gets its own window and desktop icon.              */
UI.appInit = function () {
  if (window.SZ_SINGLE) {                                       // single-file offline copy: just tell the user if a newer one is online
    setTimeout(async () => {
      try {
        const j = await (await fetch(UI.ONLINE + 'version.json?t=' + Date.now(), { cache: 'no-store' })).json();
        if (j && j.ver > SZ.CODE_VER && !$('#szupd') && !UI.isPop) {
          const b = h('div', { id: 'szupd' }, '<b>Newer version ' + (j.label || j.ver) + ' is online</b><span>' + (j.notes || '') + '</span>');
          b.append(h('button', { class: 'on', on: { click: () => window.open(UI.ONLINE, '_blank') } }, 'Open online version'),
            h('button', { on: { click: () => window.open(UI.ONLINE + 'docs/Spherizone-DCS-Simulator-offline.html', '_blank') } }, 'Download new single file'),
            h('button', { on: { click: () => b.remove() } }, 'Later'));
          document.body.append(b);
        }
      } catch (e) { }                                             // offline: nothing to check
    }, 5000);
    return;
  }
  if (!/^https?:/.test(location.protocol)) return;            // opened from a folder (file://): no app features
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  const check = async () => {
    try {
      const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (j && j.ver > SZ.CODE_VER && !$('#szupd')) {
        const b = h('div', { id: 'szupd' }, '<b>New version ' + (j.label || j.ver) + ' available</b><span>' + (j.notes || '') + '</span>');
        const r = h('button', { class: 'on', on: { click: () => { SZ.save && SZ.save(); location.reload(); } } }, 'Reload now');
        const x = h('button', { on: { click: () => b.remove() } }, 'Later');
        b.append(r, x); document.body.append(b);
      }
    } catch (e) { }
  };
  setTimeout(check, 4000); setInterval(check, 10 * 60 * 1000);
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); UI.installEvt = e;
    if ($('#szinst') || UI.isPop) return;
    const ib = h('button', { id: 'szinst', title: 'Install the simulator as an app (own window, desktop icon, works offline)' }, '⬇ INSTALL APP');
    ib.addEventListener('click', async () => { UI.installEvt.prompt(); await UI.installEvt.userChoice; ib.remove(); });
    $('#hdr .hrow').append(ib);
  });
};

UI.page = function (cfg) {
  UI.pageId = document.body.dataset.page;
  if (UI.isPop) { document.body.classList.add('pop'); document.title = '⧉ ' + document.title; }
  SZ.start();       // loads / initialises shared simulation state
  buildHeader();
  if (!UI.isPop) $('#hdr .hrow').append(popMenuButton());
  UI.appInit();
  const view = $('#view'), side = $('#side');
  if (cfg.graphic !== false) {
    const wrap = h('div', { class: 'gfxwrap' });
    const svg = sv('svg', { class: 'gfx', viewBox: cfg.viewBox || '0 0 1200 660', preserveAspectRatio: 'xMidYMid meet' });
    wrap.append(svg); view.append(wrap);
    UI.d = kit(svg); cfg.draw && cfg.draw(UI.d);
  }
  if (cfg.panels) { const pn = h('div', { class: 'panels' }); view.append(pn); cfg.panels(pn); }
  if (cfg.body) cfg.body(view);
  if (side) {
    if (UI.pageId !== 'manual') side.append(UI.sessionCard());
    if (cfg.faceplate !== false) {
      const fp = UI.card('Faceplate', ' <button class="fpclose" title="Close faceplate">✕ close</button>'); fp.id = 'fp'; side.append(fp);
      fp.querySelector('.fpclose').addEventListener('click', () => fp.classList.remove('sheet'));
    }
    (cfg.side || ['kpi']).forEach(s => { if (typeof s === 'function') side.append(s()); else if (s === 'kpi') side.append(UI.kpiCard()); else if (s.startsWith('trend:')) side.append(UI.trendCard(s.slice(6))); else if (typeof s === 'function') side.append(s()); });
  }
  buildBanner();
  const hashTag = decodeURIComponent(location.hash.slice(1));
  let sel = null; try { sel = sessionStorage.getItem('szsel.' + UI.pageId); } catch (e) { }
  UI.sel = hashTag && (SZ.CTL[hashTag] || TAGEQ[hashTag] || UI.TAGPAGE[hashTag]) ? hashTag : (sel || cfg.defaultTag || null);
  buildFaceplate();
  const foot = h('div', { class: 'disclaimer' }, 'Training-grade dynamic model — first-order and energy balances tuned for operator training. NOT licensor data. Spherizone and Avant are trademarks of the LyondellBasell family of companies.');
  document.body.append(foot);
  SZ.onRender((S) => { UI.audio.update(S); UI.alertUpdate(S); renderBinds(S); for (const [el, fn] of fpBinds) fn(S, el); });
  SZ.render();
  // first page opened in this browser session (and this tab runs the model) → ask for the plant condition
  let asked = null; try { asked = sessionStorage.getItem('szsession'); } catch (e) { asked = '1'; }
  if (!asked && SZ.rt.leader && UI.pageId !== 'manual' && !UI.isPop) UI.sessionMenu(false);
};
})(window);

<script>
(function () {
const PAGES = {"index": {"title": "Spherizone DCS — Overview", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "catalyst": {"title": "Spherizone DCS — 100 Catalyst", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "mzcr": {"title": "Spherizone DCS — 200 MZCR", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "flash": {"title": "Spherizone DCS — 300 Flash", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "gpr": {"title": "Spherizone DCS — 400 GPR", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "finishing": {"title": "Spherizone DCS — 500 Finishing & Silo", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "extrusion": {"title": "Spherizone DCS — 600 Extrusion & Pelletizing", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "utilities": {"title": "Spherizone DCS — 900 Utilities & Flare", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "trends": {"title": "Spherizone DCS — Trends", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "alarms": {"title": "Spherizone DCS — Alarms & Journal", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "quality": {"title": "Spherizone DCS — Quality & Grades", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "instructor": {"title": "Spherizone DCS — Instructor", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>"}, "manual": {"title": "Spherizone DCS — Operator Manual", "body": "<div id=\"hdr\"><\/div>\n<div id=\"main\"><section id=\"view\"><\/section><aside id=\"side\"><\/aside><\/div>\n<div id=\"banner\"><\/div>\n\n<template id=\"manual\">\n<div class=\"man\">\n<div class=\"cover\">\n<span class=\"ed\">Chemical engineering · student edition<\/span>\n<h1>Spherizone PP Plant<br>DCS Training Simulator<\/h1>\n<div class=\"st\">Student manual — operate a polypropylene plant from cold start-up to on-spec pellets<\/div>\n<div class=\"tl\">Reading about a reactor is one thing; running one is another. This simulator puts you at the panel of a complete polypropylene plant. You start it up, change grades, handle trips and shut it down, and you learn why each step matters. Mistakes here cost nothing, so try things out, trip the plant, and work out what went wrong.<\/div>\n<div class=\"band\">\n<div style=\"background:#7b5ea7\">100 · Catalyst<\/div><div style=\"background:#2f6fb3\">200 · Reactor R-211<\/div><div style=\"background:#1f8a8a\">300 · HP flash<\/div><div style=\"background:#d0782a\">400 · Gas-phase reactor<\/div><div style=\"background:#3a8a3f\">500/600 · Finishing<\/div>\n<\/div>\n<div class=\"who\">\n<div><b>Who this book is for<\/b>Chemical engineering students preparing for an internship, industrial training or a first plant job, and anyone curious about how a real process plant is run from a control room.<\/div>\n<div><b>What you will practise<\/b>Reading a DCS screen and faceplates · PID control in AUTO/MAN · heat and mass balances in action · grade changes · alarms and safety trips · full start-up and shutdown procedures.<\/div>\n<\/div>\n<div class=\"by\">Created by<span>Azhar<\/span>Designer and developer of this DCS training simulator<\/div>\n<div class=\"by\" style=\"margin-top:8px\">Version 1.6 · November 2026<\/div>\n<div class=\"fine\">For learning only. The plant model is a training-grade dynamic model built for teaching. Values are realistic in direction and size but are <b>not licensor data<\/b> and must never be used to operate a real plant. Spherizone, Spheripol and Avant are trademarks of the LyondellBasell family of companies; this is an independent educational project.<\/div>\n<\/div>\n<div class=\"warn\"><b>Training use only.<\/b> The process model is a training-grade dynamic model (first-order and energy balances). Numbers are realistic in direction and magnitude but are <b>not licensor data<\/b> and must never be used to operate a real plant.<\/div>\n\n<!-- ============================================================ -->\n<h2 id=\"s1\">1. Introduction<\/h2>\n<h3>1.1 Purpose of this manual<\/h3>\n<p>This book is written for <b>chemical engineering students<\/b>. It explains how the simulated Spherizone polypropylene plant works, how to read and use the DCS screens, how to run the plant at steady state, change grades, start it up from cold and shut it down, and how to respond to upsets and emergencies. It also explains the instructor station, so a lecturer or a study group can set exercises for each other.<\/p>\n<div class=\"tip\"><b>How to get the most out of it<\/b>\n<ul style=\"margin:4px 0\">\n<li><b>Connect it to your lectures.<\/b> Each screen shows things you have studied in class: energy balances (heat of reaction against cooler duty), vapour pressure and dew point, residence time and first-order lags, PID control, reaction kinetics (Arrhenius), and mass balances on the silo.<\/li>\n<li><b>Break it on purpose.<\/b> Stop K-211, overheat the reactor, poison the feed. Then use the trends to work out what happened first. That habit is exactly what plant engineers do.<\/li>\n<li><b>Use time control.<\/b> 1× for upsets, 20–60× for start-up, shutdown and grade changes.<\/li>\n<li><b>Keep a log book<\/b> as real operators do: what you changed, when, and what you expected to happen. Compare it with the event journal afterwards.<\/li>\n<li><b>Do the self-check questions<\/b> at the end of chapter 8 before an internship interview. They are the kind of \"why\" questions engineers get asked on site.<\/li>\n<\/ul><\/div>\n<h3>1.2 What the plant makes<\/h3>\n<p>The plant polymerises <b>propylene<\/b> (with ethylene as comonomer) into polypropylene (PP) powder, then steams, dries and extrudes it into pellets. Three product families are made:<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Family<\/th><th class=\"l\">What it is<\/th><th class=\"l\">How the plant makes it<\/th><th class=\"l\">Typical use<\/th><\/tr>\n<tr><td class=\"l\"><b>HOMO<\/b> — homopolymer<\/td><td class=\"l\">Propylene only; rigid, high crystallinity<\/td><td class=\"l\">MZCR only, GPR bypassed<\/td><td class=\"l\">Raffia, fibre, injection moulding, BOPP film<\/td><\/tr>\n<tr><td class=\"l\"><b>RACO<\/b> — random copolymer<\/td><td class=\"l\">2–5 % ethylene randomly in the chain; clearer, lower melting point, better sealing<\/td><td class=\"l\">Ethylene fed to the MZCR, GPR bypassed<\/td><td class=\"l\">Clear containers, film, pipes<\/td><\/tr>\n<tr><td class=\"l\"><b>HECO<\/b> — heterophasic (impact) copolymer<\/td><td class=\"l\">Homopolymer matrix with an ethylene-propylene rubber (EPR) phase inside each particle<\/td><td class=\"l\">MZCR makes the matrix, gas-phase reactor R-401 makes the rubber<\/td><td class=\"l\">Automotive, appliances, crates, low-temperature impact<\/td><\/tr>\n<\/table>\n<h3>1.3 The Spherizone technology<\/h3>\n<p>Spherizone (LyondellBasell) replaces the liquid-propylene loop reactors of the older Spheripol process with a single <b>Multizone Circulating Reactor (MZCR)<\/b>. Growing polymer particles circulate continuously between two zones:<\/p>\n<ul>\n<li><b>Riser<\/b> — particles are carried <i>upward<\/i> by fast-flowing gas (fast fluidisation). Gas is rich in hydrogen, so short chains (high MFR) are made here.<\/li>\n<li><b>Downer<\/b> — at the top separator the particles drop into the downer and move <i>downward<\/i> as a dense packed bed by gravity. Gas here is low in hydrogen, so long chains (low MFR) are made here.<\/li>\n<li><b>Barrier / stripping zone<\/b> — liquid propylene injected at the top of the downer stops riser gas (and its hydrogen) from following the particles down. This is what makes two different reaction zones possible inside one reactor.<\/li>\n<\/ul>\n<p>Because each particle passes through both zones many times, every particle contains an intimate blend of short and long chains. The result is a <b>broad, bimodal molecular-weight distribution<\/b> (high PI) at the same MFR — giving stiffness and melt strength that a single-zone reactor cannot reach. Narrowing the difference between the zones (less barrier) gives a narrower MWD, e.g. for fibre grades.<\/p>\n<h3>1.4 Catalyst system<\/h3>\n<p>The plant uses a Ziegler-Natta catalyst (Avant ZN type): MgCl<sub>2<\/sub>-supported TiCl<sub>4<\/sub> with an internal donor. Two more chemicals are needed:<\/p>\n<ul>\n<li><b>TEAL<\/b> (triethylaluminium) co-catalyst — activates the Ti sites and scavenges poisons (water, CO, COS, oxygen) in the feed.<\/li>\n<li><b>External donor<\/b> (silane) — controls stereo-regularity (isotacticity). More donor → lower xylene solubles (XS), slightly lower activity. <b>C-donor<\/b> gives strong hydrogen response; <b>D-donor<\/b> gives weaker H2 response and broader MWD (used for BOPP film).<\/li>\n<\/ul>\n<p><b>Hydrogen<\/b> is the chain-transfer agent: more H2 → shorter chains → higher MFR.<\/p>\n\n<!-- ============================================================ -->\n<h2 id=\"s
