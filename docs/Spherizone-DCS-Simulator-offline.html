 feed.<\/td><td class=\"l\">Start EX-601 once the silo is &gt; 20 %.<\/td><\/tr>\n<tr><td class=\"l\">Steam OFF on D-501<\/td><td class=\"l\">Pellets counted off-spec (catalyst not deactivated).<\/td><td class=\"l\">Steam ON before the extruder.<\/td><\/tr>\n<tr><td class=\"l\">Leaving full feed on during shutdown<\/td><td class=\"l\">The reactor cools, the dew margin collapses, K-211 trips, then the CO kill.<\/td><td class=\"l\">Feed down with production, and use the heater below 10 t/h.<\/td><\/tr>\n<tr><td class=\"l\">Stopping K-211 too early<\/td><td class=\"l\">CO kill after 60 s if production is &gt; 1 t/h.<\/td><td class=\"l\">Stop K-211 last (shutdown step 13).<\/td><\/tr>\n<\/table>\n\n<h3>8.9 Pocket cards<\/h3>\n<div class=\"card2\">\n<div><b>START-UP (cold)<\/b>\n<ol>\n<li>P-701 ON<\/li><li>K-211 ON<\/li><li>HIC-213 55 %<\/li><li>E-212 ON, TIC-212 AUTO 78 °C (R-7 73) → ≥ 72 °C<\/li><li>PIC-211 AUTO → recipe P<\/li><li>PIC-301 AUTO 18 barg<\/li><li>P-102, P-103 ON; FFIC-102/103 AUTO<\/li><li>FIC-212 recipe; FIC-201 5 t/h<\/li><li>AIC-211 AUTO recipe<\/li><li>D-101 ON; FIC-101 0.2 kg/h; TIC-211 AUTO<\/li><li>&gt; 5 t/h and TIC-212 OP &lt; 10 % → E-212 OFF<\/li><li>Steam ON; EX-601 ON at silo &gt; 20 %; LIC-601 AUTO<\/li><li>Ramp catalyst and C₃ → ≥ 27 t/h<\/li><li>Pellets ON-SPEC<\/li>\n<\/ol><\/div>\n<div><b>CONTROLLED SHUTDOWN<\/b>\n<ol>\n<li>FIC-101 MAN 0 %<\/li><li>FIC-203 (and AIC-401) MAN 0 %<\/li><li>FIC-201 ≈ 0.7 × production<\/li><li>&lt; 10 t/h → E-212 ON, TIC-212 AUTO 78 °C, TIC-211 AUTO<\/li><li>Wait for &lt; 2 t/h<\/li><li>HS-302 BYPASS<\/li><li>AIC-211 MAN 0 %<\/li><li>P-102, P-103 OFF<\/li><li>FIC-201, FIC-212 MAN 0 %<\/li><li>LIC-601 SP 5 % → EX-601 OFF at ≤ 10 %<\/li><li>Steam OFF<\/li><li>PIC-211 SP 3 barg → E-212 OFF<\/li><li>K-211, P-701 OFF<\/li>\n<\/ol>\n<b>EMERGENCY<\/b>: FIC-101 0 → ARM → INJECT → confirm → make safe → find the cause.<\/div>\n<\/div>\n\n<h3>8.10 Check your understanding<\/h3>\n<p>Try to answer these before reading the answers. They are the kind of \"why\" questions a supervisor asks an intern on site.<\/p>\n<ol>\n<li>Why must R-211 be heated <i>before<\/i> it is pressurised to 28 barg? What is the minimum temperature?<\/li>\n<li>The catalyst feeder starts at 01:30. Why does production only appear at about 02:00?<\/li>\n<li>Why are TEAL and donor started before the catalyst?<\/li>\n<li>At 30 t/h, how much heat does the reaction release? Why is a 4 MW heater still useful?<\/li>\n<li>During a shutdown the reactor temperature falls even though TIC-211 is in AUTO with its OP at 0 %. Where is the heat going, and what do you do?<\/li>\n<li>Why is K-211 the <i>last<\/i> machine stopped in a shutdown, when it was among the first started?<\/li>\n<li>The extruder trips with the silo at 30 % and production at 30 t/h. How long before the SIS cuts the catalyst? (The silo holds 400 t, and the cut is at 95 %.)<\/li>\n<li>What is the difference between hot standby and a cold plant, and when would you choose each?<\/li>\n<\/ol>\n<div class=\"ans\"><b>Answers.<\/b>\n1 · To keep the propylene a vapour: the reactor pressure must stay below its vapour pressure with a 3 bar margin. At 28 barg that needs ≈ 72 °C.\n2 · Catalyst passes the precontact pot (≈ 10 min) and the prepolymeriser (≈ 20 min), then has to build up in R-211. These are first-order lags in series.\n3 · TEAL activates the Ti sites and scavenges poisons, and the donor sets the stereo-regularity. Without them the catalyst is inactive or makes off-spec, sticky polymer.\n4 · 30 000 kg/h × 2 MJ/kg ÷ 3600 ≈ 17 MW. The heater cannot run the plant, but it brings an empty reactor to reaction temperature and holds the temperature when there is no reaction heat.\n5 · Into vaporising and warming the cold fresh propylene and barrier feed, plus losses to the surroundings. Cut the feed with production and start E-212.\n6 · K-211 keeps the riser fluidised and carries the heat to the cooler. With polymer still reacting, losing it means hot spots and chunks, so the SIS kills the reaction if it stops for more than 60 s. It is stopped only after the reaction is dead.\n7 · (95 − 30) % × 400 t = 260 t. At 30 t/h that is ≈ 8.7 h. Plenty of time, but only if somebody notices the trip.\n8 · Hot standby: warm, pressurised and circulating, so a restart takes about an hour. Use it for short stops. Cold: everything stopped and depressurised. Use it for maintenance or long stops. It needs the full 5–6 h start-up.\n<\/div>\n\n<!-- ============================================================ -->\n<h2 id=\"s8\">9. Emergency procedures<\/h2>\n<div class=\"warn\"><b>Golden rule:<\/b> the reactor makes about <b>17 MW<\/b> of heat at 30 t/h. Anything that removes cooling (CW pump, K-211, fouling) can take the MZCR from 80 °C to the 92 °C trip in about <b>5 minutes<\/b>. Act early: cut catalyst first, then decide on CO kill.<\/div>\n<h3>9.1 CO kill system XV-901<\/h3>\n<ol>\n<li><b>ARM<\/b> (MZCR page, kill panel).<\/li>\n<li><b>INJECT<\/b> — CO enters the reactor; polymerisation stops within ~1 min. Catalyst feed is set to MAN 0 %.<\/li>\n<li>When the cause is fixed: <b>RESET<\/b> → state <b>PURGE<\/b>. The CO is purged over ~15–30 min; activity returns gradually. Then restart catalyst feed.<\/li>\n<\/ol>\n<h3>9.2 Cooling-water pump P-701 trip<\/h3>\n<p><b>Symptoms:<\/b> P-701 alarm (P1), TIC-211 OP goes to 100 %, temperature climbs ~2–3 °C/min, CW return temperature rises.<\/p>\n<ol>\n<li>Try to restart P-701 (faceplate START). If refused, it is locked out.<\/li>\n<li>Immediately cut catalyst: FIC-101 → MAN, OP 0.<\/li>\n<li>If T passes ~88 °C and still rising: ARM and INJECT CO kill — do not wait for the SIS at 92 °C.<\/li>\n<li>Bypass GPR if in HECO (no cooling there either).<\/li>\n<\/ol>\n<h3>9.3 Cycle-gas compressor K-211 trip<\/h3>\n<p><b>Symptoms:<\/b> K-211 alarm (P1), riser defluidises, E-211 duty collapses, fouling index rises. SIS injects CO automatically after <b>60 s<\/b>.<\/p>\n<ol>\n<li>Attempt one restart. If it fails, inject CO kill yourself (controlled rather than SIS trip).<\/li>\n<li>Cut catalyst, keep P-701 running. After repair: restart K-211, RESET kill, wait for purge, restart catalyst at reduced rate.<\/li>\n<\/ol>\n<h3>9.4 Catalyst feeder plug (hidden fault)<\/h3>\n<p><b>Symptoms:<\/b> FIC-101 still reads normal (!) but production slowly falls, TIC-211 OP drops, mileage falls, TI-101 prepoly temperature drifts down, PIC-211 swings toward vent.<\/p>\n<p><b>Diagnosis:<\/b> production ÷ catalyst flow (mileage) falling with no poison and normal TEAL → suspect the feeder. <b>Action:<\/b> call field/instructor to clear the plug; meanwhile reduce fresh feed FIC-201 to stop pressure rising.<\/p>\n<h3>9.5 Feed poisoning (H2O / CO / COS)<\/h3>\n<p><b>Symptoms:<\/b> AI-001 alarm, production drops although catalyst flow is normal, \"Poison effect\" rises on the Catalyst page.<\/p>\n<ol>\n<li>Raise FFIC-102 TEAL/cat ratio (e.g. 5 → 7–8 g/g) to scavenge poisons.<\/li>\n<li>If production still low, raise FIC-101 carefully. CO cannot be scavenged by TEAL — only the source can be fixed.<\/li>\n<li>When poisons clear, return TEAL ratio to recipe (excess TEAL is costly).<\/li>\n<\/ol>\n<h3>9.6 Frozen H2 analyser<\/h3>\n<p><b>Symptoms:<\/b> AIC-211 PV stops moving (flat line on the hydrogen trend) while MFR drifts. Put AIC-211 in <b>MAN<\/b> and hold the H2 valve at its last good OP; control MFR from lab results until the analyser is repaired.<\/p>\n<h3>9.7 PIC-211 fails in AUTO<\/h3>\n<p><b>Symptoms:<\/b> PIC-211 OP ramps open though pressure is at or above SP; pressure climbs; dew-point margin shrinks. Put PIC-211 in <b>MAN<\/b> and set OP to ~50 %; trim manually.<\/p>\n<h3>9.8 Extruder EX-601 trip / silo full<\/h3>\n<p>Silo fills at production rate (~30 t/h → ~7 %/h). At <b>95 %<\/b> the SIS cuts catalyst. Reduce FIC-101 early to buy time; after the extruder is back and silo &lt; 90 %, press <b>SIS catalyst-cut RESET<\/b> on the FIC-101 faceplate and return it to AUTO.<\/p>\n<h3>9.9 GPR problems (HECO)<\/h3>\n<ul>\n<li><b>K-401 trip<\/b> — fluidisation lost, chunk index rises fast. Bypass GPR or kill; do not keep feeding powder into a dead bed.<\/li>\n<li><b>LV-401 stuck<\/b> — LIC-401 OP moves but level keeps drifting. Compare LIC-401 OP with level trend; bypass GPR if level heads to high alarm.<\/li>\n<li><b>High temperature / chunks<\/b> — reduce AIC-401 (less rubber), check K-401 and CW.<\/li>\n<\/ul>\n\n<!-- ============================================================ -->\n<h2 id=\"s9\">10. Alarms and safety system<\/h2>\n<h3>10.1 Main alarms<\/h3>\n<table class=\"t\">\n<tr><th>Pri<\/th><th class=\"l\">Alarm<\/th><th class=\"l\">Limit<\/th><\/tr>\n<tr><td>1<\/td><td class=\"l\">TIC-211 MZCR temperature HH<\/td><td class=\"l\">≥ 90 °C (H 85, L 68 → P2/P3)<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">Dew-point margin low<\/td><td class=\"l\">Pvap − P &lt; 3 bar; K-211 trips &lt; 0.5 bar<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">K-211 / P-701 stopped, K-401 stopped in service<\/td><td class=\"l\">—<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">CO kill active, catalyst SIS cut, SIS bypassed<\/td><td class=\"l\">—<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">GPR temperature HH / silo HH<\/td><td class=\"l\">≥ 90 °C / ≥ 95 %<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">PIC-211 high / low<\/td><td class=\"l\">31 / 24 barg<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">TEAL/cat low, TEAL pump stopped, feed poisons<\/td><td class=\"l\">&lt; 3 g/g, &gt; 1 ppm<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Sticky product, fouling &gt; 30 %, chunk index &gt; 40<\/td><td class=\"l\">—<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Flash pressure high, GPR level high/low, silo high<\/td><td class=\"l\">20 barg, 80/35 %, 85 %<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Extruder stopped, steam OFF<\/td><td class=\"l\">—<\/td><\/tr>\n<tr><td>3<\/td><td class=\"l\">Off-spec pellets, recipe differs from target, H2 / catalyst deviation, low production<\/td><td class=\"l\">—<\/td><\/tr>\n<\/table>\n<h3>10.2 Safety Instrumented System (SIS) trips<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Initiator<\/th><th class=\"l\">Action<\/th><\/tr>\n<tr><td class=\"l\">MZCR temperature ≥ 92 °C<\/td><td class=\"l\">CO kill injected, catalyst to 0<\/td><\/tr>\n<tr><td class=\"l\">GPR temperature ≥ 95 °C<\/td><td class=\"l\">CO kill injected<\/td><\/tr>\n<tr><td class=\"l\">K-211 stopped &gt; 60 s with reaction running<\/td><td class=\"l\">CO kill injected<\/td><\/tr>\n<tr><td class=\"l\">Silo D-601 ≥ 95 %<\/td><td class=\"l\">Catalyst feed cut (latched — manual reset at &lt; 90 %)<\/td><\/tr>\n<tr><td class=\"l\">Dew-point margin &lt; 0.5 bar<\/td><td class=\"l\">K-211 tripped (liquid carry-over protection)<\/td><\/tr>\n<tr><td class=\"l\">R-211 temperature ≥ 85 °C, or K-211 stopped<\/td><td class=\"l\">Start-up heater E-212 tripped (TSH-212 / no gas flow)<\/td><\/tr>\n<\/table>\n<h3>10.3 Alarm sounds<\/h3>\n<table class=\"t\">\n<tr><th>Pri<\/th><th class=\"l\">Sound<\/th><th class=\"l\">Repeats<\/th><\/tr>\n<tr><td>1<\/td><td class=\"l\">Fast high/low two-tone warble<\/td><td class=\"l\">Every 1.4 s until acknowledged or silenced<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Double beep<\/td><td class=\"l\">Every 4 s until acknowledged or silenced<\/td><\/tr>\n<tr><td>3<\/td><td class=\"l\">Single soft chime<\/td><td class=\"l\">Once, when the alarm comes in<\/td><\/tr>\n<\/table>\n<ul>\n<li>The horn plays the highest-priority unacknowledged alarm.<\/li>\n<li><b>🔕 SILENCE<\/b> (header) stops the horn for the alarms standing now, but leaves them unacknowledged. Any <i>new<\/i> alarm sounds again.<\/li>\n<li><b>🔊 / 🔇<\/b> (header) turns alarm sound on or off for this browser.<\/li>\n<li><b>PSV relief \"kshhhh\":<\/b> a sharp hiss burst when a PSV lifts, then a steady roar while it relieves, louder with relief flow. It stops when the valve reseats.<\/li>\n<li><b>Flare roar:<\/b> a deep rumbling roar when the flare load is above 1 t/h. It gets louder and deeper as the flare grows (see the table in 4.6).<\/li>\n<li>With several windows open, only the window you clicked last plays sound.<\/li>\n<li>Browsers only allow sound after you have clicked or pressed a key on the page. Test sounds (horns, PSV relief, flare roar) are on the <a href=\"instructor.html\">Instructor<\/a> page.<\/li>\n<\/ul>\n<p><b>Safety alert pop-up.<\/b> A large alert box opens over the screen for:<\/p>\n<ul>\n<li>an <b>equipment trip<\/b>, for example K-211, P-701 or E-212;<\/li>\n<li>a <b>PSV lift<\/b>;<\/li>\n<li>an <b>SIS trip<\/b> (CO kill, catalyst cut).<\/li>\n<\/ul>\n<p>It shows the time, what happened and why, and appears in every open window. Its buttons:<\/p>\n<ul>\n<li><b>Go to …<\/b> opens the equipment faceplate.<\/li>\n<li><b>Close<\/b> closes the box.<\/li>\n<li><b>Close + ACK alarms<\/b> also acknowledges the alarms.<\/li>\n<li><b>Close all<\/b> clears a queue of alerts.<\/li>\n<\/ul>\n<p>Closing the box does not fix anything: the alarm stays until the cause is removed.<\/p>\n<h3>10.4 Alarm handling<\/h3>\n<ol>\n<li>Read the alarm, acknowledge it (banner click or ACK on Alarms page). ACK silences the horn and the blinking — it does not fix anything.<\/li>\n<li>Click the row to go to the tag and its faceplate.<\/li>\n<li>Handle P1 first. An alarm that returns to normal while unacknowledged shows \"RTN\" until acknowledged.<\/li>\n<\/ol>\n<h3>10.5 State-based alarm suppression (plant down)<\/h3>\n<p>So that a stopped plant does not flood the operator with meaningless alarms, some alarms are suppressed automatically while the plant is down (ISA-18.2 state-based alarming):<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Plant state<\/th><th class=\"l\">Suppressed alarms<\/th><\/tr>\n<tr><td class=\"l\">Idle — production &lt; 1 t/h <b>and<\/b> catalyst flow &lt; 0.02 kg/h<\/td><td class=\"l\">K-211 stopped, P-701 stopped, TEAL pump stopped, catalyst flow deviation, TEAL/cat ratio low<\/td><\/tr>\n<tr><td class=\"l\">Low — production &lt; 5 t/h<\/td><td class=\"l\">Low production, PIC-211 low, flash pressure low, silo low, extruder stopped, steam OFF, off-spec pellets, recipe differs, riser H2 deviation<\/td><\/tr>\n<\/table>\n<p>Safety alarms (temperature, dew margin, CO kill, SIS) are never suppressed. Motor symbols for K-211 / P-701 are also not shown red while the plant is idle.<\/p>\n\n<!-- ============================================================ -->\n<h2 id=\"s10\">11. Quality control<\/h2>\n<ul>\n<li><b>Instantaneous<\/b> properties = what the reactor is making now. <b>Pellet<\/b> properties lag ~15 min (silo and extruder mixing).<\/li>\n<li>A routine lab sample is taken every 30 sim-minutes; results arrive 10 minutes later. Use <b>Take spot sample<\/b> after any change. Red cells are out of spec for the grade sampled.<\/li>\n<li>Pellets are counted ON-SPEC only if all properties are in spec <b>and<\/b> steam is ON <b>and<\/b> additives match the recipe. On/off-spec tonnes are shown in the KPI panel.<\/li>\n<li>HECO MFR is a log-blend: ln MFR = (1 − w)·ln MFR<sub>matrix<\/sub> + w·ln MFR<sub>rubber<\/sub> (w = rubber fraction). Spherizone matrix MFR is the log-blend of riser and downer MFR.<\/li>\n<\/ul>\n\n<!-- ============================================================ -->\n<h2 id=\"s11\">12. Trends<\/h2>\n<p>The <a href=\"trends.html\">Trends<\/a> page has nine groups (temperatures, production, quality, cooling OP, pressure vs vapour pressure, hydrogen zones, GPR, silo/extruder, catalyst &amp; fouling) with 15/30/60/120-minute windows. Each pen auto-scales; its range is shown in the legend. Click any small trend to enlarge it.<\/p>\n<div class=\"tip\"><b>Diagnosis habit:<\/b> when something is wrong, open the matching trend group and ask \"what changed first?\" The first variable to move is usually the cause; the rest are consequences.<\/div>\n\n<!-- ============================================================ -->\n<h2 id=\"s12\">13. Instructor station<\/h2>\n<ul>\n<li><b>☰ Session menu<\/b> — the same shift-handover menu the trainee sees at start (section 2.3): steady state, upset drills, grade-change exercises, cold start-up or controlled shutdown.<\/li>\n<li><b>Initialise cold (start-up)<\/b> — puts the plant in the cold, all-stopped condition for the grade in the selector and starts the start-up tracker.<\/li>\n<li><b>Failures<\/b> — activate/clear nine faults (CW pump, K-211, catalyst plug, TEAL pump, frozen H2 analyser, PIC-211 failure, K-401, LV-401 stuck, extruder).<\/li>\n<li><b>Feed poisons<\/b> — H2O, CO, COS sliders (ppm).<\/li>\n<li><b>SIS bypass<\/b> — disables automatic trips (raises a P1 alarm). For demonstrations only.<\/li>\n<li><b>Re-initialise at steady state<\/b> — choose any grade; the model settles silently (~4 h sim time) and clears alarms, journal, lab and tonnage counters.<\/li>\n<li><b>Snapshots<\/b> — save the current plant and restore it later to repeat a scenario.<\/li>\n<li><b>True vs measured<\/b> — shows hidden information (real catalyst flow vs meter, true H2 vs GC, actual LV-401 position).<\/li>\n<li><b>Training exercises<\/b> — eight ready scenarios: three grade changes, CW pump trip, K-211 trip, hidden-failure diagnosis, COS poisoning, extruder trip. The same scenarios appear in the session menu as <b>Upset drills<\/b> and <b>Grade-change exercises<\/b>.<\/li>\n<\/ul>\n<h3>13.1 Suggested training path<\/h3>\n<ol>\n<li>Day 1 — screens, faceplates, AUTO/MAN, rate change at 1×.<\/li>\n<li>Day 2 — grade changes H-INJ → H-RAFFIA → H-FIBER, then H-INJ → R-7.<\/li>\n<li>Day 3 — GPR start-up (R-7 → I-12) and back to H-BOPP with donor change.<\/li>\n<li>Day 4 — emergencies: CW trip, K-211 trip, extruder trip, poisoning.<\/li>\n<li>Day 5 — controlled shutdown (8.6), full cold start-up (8.4), hot standby and CO-kill restart (8.5, 8.7) at 20–60×.<\/li>\n<li>Day 6 — hidden-failure diagnosis; assessment using off-spec tonnes, SIS trips, procedure times and the event journal (procedure steps are logged as <b>PROCEDURE<\/b>).<\/li>\n<\/ol>\n\n<!-- ============================================================ -->\n<h2 id=\"s13\">14. Equipment and tag list<\/h2>\n<table class=\"t\">\n<tr><th class=\"l\">Tag<\/th><th class=\"l\">Description<\/th><th class=\"l\">Page<\/th><\/tr>\n<tr><td class=\"l\">D-101 / D-102 / D-103<\/td><td class=\"l\">Catalyst, TEAL, external donor drums<\/td><td class=\"l\">100<\/td><\/tr>\n<tr><td class=\"l\">P-102 / P-103<\/td><td class=\"l\">TEAL and donor dosing pumps<\/td><td class=\"l\">100<\/td><\/tr>\n<tr><td class=\"l\">D-104 / R-101<\/td><td class=\"l\">Precontact pot / prepolymeriser<\/td><td class=\"l\">100<\/td><\/tr>\n<tr><td class=\"l\">R-211<\/td><td class=\"l\">Multizone circulating reactor (riser + downer)<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td class=\"l\">K-211 / E-211<\/td><td class=\"l\">MZCR cycle-gas compressor / cooler<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td class=\"l\">E-212<\/td><td class=\"l\">Start-up heater on cycle gas (steam, 4 MW) — heat-up and shutdown temperature hold<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td class=\"l\">P-701<\/td><td class=\"l\">Cooling-water pump<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td class=\"l\">XV-901<\/td><td class=\"l\">CO kill injection valve<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td class=\"l\">D-301 / E-301<\/td><td class=\"l\">HP flash drum / recycle condenser<\/td><td class=\"l\">300<\/td><\/tr>\n<tr><td class=\"l\">HS-302<\/td><td class=\"l\">GPR in-service / bypass selector<\/td><td class=\"l\">300 / 400<\/td><\/tr>\n<tr><td class=\"l\">R-401 / K-401 / E-401<\/td><td class=\"l\">Gas-phase reactor / compressor / cooler<\/td><td class=\"l\">400<\/td><\/tr>\n<tr><td class=\"l\">LV-401<\/td><td class=\"l\">GPR discharge valve<\/td><td class=\"l\">400<\/td><\/tr>\n<tr><td class=\"l\">D-501<\/td><td class=\"l\">Steamer / dryer<\/td><td class=\"l\">500<\/td><\/tr>\n<tr><td class=\"l\">D-601<\/td><td class=\"l\">Powder silo, 400 t<\/td><td class=\"l\">600<\/td><\/tr>\n<tr><td class=\"l\">EX-601 · M-601 · MP-601 · SC-601 · UWP-601<\/td><td class=\"l\">Extruder, main drive, melt pump, screen changer, underwater pelletizer<\/td><td class=\"l\">600<\/td><\/tr>\n<tr><td class=\"l\">H-601…H-605 · WF-601…WF-605<\/td><td class=\"l\">Additive hoppers and loss-in-weight feeders<\/td><td class=\"l\">600<\/td><\/tr>\n<tr><td class=\"l\">H-650 · P-651<\/td><td class=\"l\">Hot-oil heater and pump (extruder barrel zones)<\/td><td class=\"l\">600<\/td><\/tr>\n<tr><td class=\"l\">D-662 · S-663 · TK-660 · P-661 · E-661<\/td><td class=\"l\">Spin dryer, pellet screen, pellet-water tank, pump and cooler<\/td><td class=\"l\">600<\/td><\/tr>\n<tr><td class=\"l\">EX-601 (finishing view)<\/td><td class=\"l\">Extruder / pelletiser with additive dosing<\/td><td class=\"l\">600<\/td><\/tr>\n<\/table>\n<p>Controllers: FIC-101, FFIC-102, FFIC-103, FIC-201, FIC-203, TIC-211, TIC-212, PIC-211, AIC-211, FIC-212, HIC-213, PIC-301, TIC-401, PIC-401, AIC-401, AIC-402, LIC-401, LIC-601. Each controller's description and range is shown on its faceplate.<\/p>\n\n<!-- ============================================================ -->\n<h2 id=\"s14\">15. Glossary<\/h2>\n<table class=\"t\">\n<tr><td class=\"l\"><b>MFR<\/b><\/td><td class=\"l\">Melt flow rate (g/10 min, 230 °C/2.16 kg). Higher = shorter chains, easier flowing melt.<\/td><\/tr>\n<tr><td class=\"l\"><b>XS<\/b><\/td><td class=\"l\">Xylene solubles (wt%) — the non-crystalline (atactic / rubbery) fraction.<\/td><\/tr>\n<tr><td class=\"l\"><b>PI<\/b><\/td><td class=\"l\">Polydispersity index Mw/Mn — breadth of the molecular-weight distribution.<\/td><\/tr>\n<tr><td class=\"l\"><b>MWD<\/b><\/td><td class=\"l\">Molecular-weight distribution. Bimodal = two populations of chain length.<\/td><\/tr>\n<tr><td class=\"l\"><b>Mileage<\/b><\/td><td class=\"l\">Catalyst yield, tonnes of PP per kg of catalyst.<\/td><\/tr>\n<tr><td class=\"l\"><b>TEAL<\/b><\/td><td class=\"l\">Triethylaluminium co-catalyst and poison scavenger.<\/td><\/tr>\n<tr><td class=\"l\"><b>Donor<\/b><\/td><td class=\"l\">Electron donor (silane) controlling stereo-regularity.<\/td><\/tr>\n<tr><td class=\"l\"><b>EPR<\/b><\/td><td class=\"l\">Ethylene-propylene rubber — the impact phase of HECO.<\/td><\/tr>\n<tr><td class=\"l\"><b>Izod<\/b><\/td><td class=\"l\">Notched impact strength (kJ/m²).<\/td><\/tr>\n<tr><td class=\"l\"><b>Barrier<\/b><\/td><td class=\"l\">Liquid propylene injected at the downer top to keep riser gas out of the downer.<\/td><\/tr>\n<tr><td class=\"l\"><b>Dew-point margin<\/b><\/td><td class=\"l\">Propylene vapour pressure at reactor T minus reactor pressure. Low margin → propylene condenses in the riser.<\/td><\/tr>\n<tr><td class=\"l\"><b>PV / SP / OP<\/b><\/td><td class=\"l\">Process value / setpoint / controller output (valve position %).<\/td><\/tr>\n<tr><td class=\"l\"><b>SIS<\/b><\/td><td class=\"l\">Safety Instrumented System — automatic trips independent of the operator.<\/td><\/tr>\n<tr><td class=\"l\"><b>CO kill<\/b><\/td><td class=\"l\">Carbon monoxide injected to poison the catalyst and stop polymerisation instantly.<\/td><\/tr>\n<\/table>\n<p class=\"hint\" style=\"margin-top:20px\">Spherizone, Spheripol and Avant are trademarks of the LyondellBasell family of companies. Process background from the LyondellBasell Spherizone and catalyst brochures; all simulator values are training-model values.<\/p>\n\n<!-- ============================================================ -->\n<h2 id=\"s16\">Appendix A. Sources, references and how this simulator was built<\/h2>\n\n<h3>A.1 Statement of origin<\/h3>\n<div class=\"note\">\n<p>This simulator and manual are an <b>independent educational project<\/b>. They were built only from <b>publicly available information<\/b> and general chemical-engineering knowledge. <b>No proprietary, confidential or licensor process data was used.<\/b> No LyondellBasell process design package, operating manual, P&amp;ID, kinetic data or software was available to the authors or used.<\/p>\n<p>The overall process concept is <b>inspired by<\/b> LyondellBasell's public marketing brochures for the Spherizone process and its polypropylene catalysts. Examples are the multizone circulating reactor with riser, downer and barrier, the optional gas-phase reactor for impact copolymers, and the product families. Every equipment tag, controller, setpoint, alarm limit, recipe, equation and coefficient in this simulator was <b>invented or estimated for training purposes<\/b>. They do not describe any real plant.<\/p>\n<p>This project is <b>not affiliated with, sponsored by or endorsed by LyondellBasell<\/b>. Spherizone, Spheripol and Avant are trademarks of the LyondellBasell family of companies and are used here only to identify the technology the training model is loosely based on.<\/p>\n<\/div>\n\n<h3>A.2 Sources used<\/h3>\n<table class=\"t\">\n<tr><th>#<\/th><th class=\"l\">Source<\/th><th class=\"l\">Type<\/th><th class=\"l\">What it was used for<\/th><\/tr>\n<tr><td>1<\/td><td class=\"l\">LyondellBasell, <i>Spherizone — Licensed polyolefin technologies and services<\/i>, brochure 8739/25/06, lyb.com/technology<\/td><td class=\"l\">Public marketing brochure<\/td><td class=\"l\">Process concept: MZCR with riser (fast fluidisation) and downer (packed plug flow), barrier/stripping zone, optional fluidised-bed gas-phase reactor, finishing steps (steaming, N₂ drying), simplified flow diagram, product families (HOMO / RACO / HECO), broad-MWD capability. Up to 550 kt/a single line.<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">LyondellBasell, <i>Catalysts for production of polypropylene<\/i> (Avant ZN / Avant M), brochure, lyb.com<\/td><td class=\"l\">Public marketing brochure<\/td><td class=\"l\">Qualitative catalyst behaviour: Ziegler-Natta catalyst generations and internal donors, external silane donors (C, P, D), role of TEAL, effect of poisons (water, oxygen, sulphur compounds), hydrogen response, selectivity (XS ≈ 1–5 %), PI &lt; 3 for fibre and ≥ 5 for BOPP.<\/td><\/tr>\n<tr><td>3<\/td><td class=\"l\">Project notes, <i>\"This plant produces polypropylene\"<\/i> (Word document in the project folder)<\/td><td class=\"l\">Author's own notes, compiled from general public information<\/td><td class=\"l\">Product families, catalyst components, additive types, typical Spheripol/Spherizone operating ranges (loop 60–80 °C / 30–40 bar, flash ≈ 18 bar, precontact ≈ 15 °C, prepolymeriser ≈ 20 °C). General modelling approaches (method of moments, PC-SAFT, Ziegler-Natta multi-site kinetics) as background only. These were not implemented.<\/td><\/tr>\n<tr><td>4<\/td><td class=\"l\">Project specification, <i>pp-simulator.md<\/i> (in the project folder)<\/td><td class=\"l\">Author's own design brief<\/td><td class=\"l\">Scope of the simulator: process areas and tag numbering, controller list, model requirements, grades and specs, HMI layout, SIS interlocks, instructor station, verification tests.<\/td><\/tr>\n<tr><td>5<\/td><td class=\"l\">ANSI/ISA-101.01, <i>Human Machine Interfaces for Process Automation Systems<\/i> (concept)<\/td><td class=\"l\">Industry standard (general principles only)<\/td><td class=\"l\">HMI style: grey background, colour reserved for abnormal states, alarm priorities. The standard's text was not reproduced.<\/td><\/tr>\n<tr><td>6<\/td><td class=\"l\">General chemical-engineering and polymer-science knowledge (textbook level)<\/td><td class=\"l\">Common knowledge<\/td><td class=\"l\">Arrhenius kinetics, energy balances, first-order lags, PID control, Clausius-Clapeyron vapour pressure, hydrogen as chain-transfer agent, log-additive blending of MFR, ethylene effect on melting point, role of CO as a catalyst kill agent.<\/td><\/tr>\n<\/table>\n<p class=\"hint\">The brochures in sources 1 and 2 are publicly downloadable marketing documents. They are <b>publicly available, not open-source<\/b>: their copyright stays with LyondellBasell. This manual only paraphrases general facts from them and does not reproduce their text or figures.<\/p>\n\n<h3>A.3 How the simulator was built<\/h3>\n<ol>\n<li><b>Specification.<\/b> The scope was written down first in <code>pp-simulator.md<\/code>: plant areas, tags, controllers, model features, grades, HMI, SIS and instructor functions. The project was then narrowed to the <b>Spherizone process only<\/b>, built as multiple linked pages.<\/li>\n<li><b>Process model<\/b> (<code>assets/model.js<\/code>). A training-grade dynamic model was written from scratch:\n  <ul>\n  <li>Catalyst path: feeder → precontact (τ ≈ 10 min) → prepolymeriser (τ ≈ 20 min) → reactor hold-up (τ ≈ 36 min).<\/li>\n  <li>Production = catalyst flow × mileage (≈ 50 t/kg) × activity factors for temperature (Arrhenius plus deactivation above 85 °C), TEAL/catalyst ratio, donor, hydrogen, pressure, comonomer, poisons and CO kill.<\/li>\n  <li>Energy balance: dT/dt = (Q<sub>reaction<\/sub> − Q<sub>feed<\/sub> − Q<sub>cooler<\/sub>) / C, with ΔH ≈ 2 MJ/kg. UA and C were sized so that normal cooling output is ≈ 35 % and a cooling-water trip reaches the 92 °C trip in ≈ 5–6 min.<\/li>\n  <li>Gas inventory pressure balance with split-range make-up/vent; propylene vapour pressure ln P = 10.03 − 2260/T (fitted, bar abs, K) for the dew-point margin.<\/li>\n  <li>Two-zone hydrogen: riser H₂ from the H₂ valve; downer H₂ = riser H₂ × (1 − barrier efficiency).<\/li>\n  <li>Product properties: MFR from a power law in H₂ per zone, log-blended; PI from the riser/downer MFR ratio; XS from donor ratio, temperature and ethylene; HECO rubber, Izod and flex modulus from simple correlations.<\/li>\n  <li>Gas-phase reactor, flash drum, silo and extruder as mass balances with first-order lags.<\/li>\n  <\/ul>\n  All coefficients were <b>chosen by the authors<\/b> to give realistic-looking behaviour. They were not fitted to plant data.<\/li>\n<li><b>Control layer.<\/b> Velocity-form PI(D) controllers with AUTO/MAN and bumpless transfer, ratio controllers for TEAL and donor, a split-range pressure controller, and a hand station for solids circulation.<\/li>\n<li><b>Safety layer.<\/b> SIS trips (CO kill on high temperature or compressor stop, catalyst cut on silo HH, compressor protection on low dew margin), plus an alarm list with three priorities.<\/li>\n<li><b>Runtime<\/b> (<code>assets/core.js<\/code>). One shared simulation for all pages. One browser tab integrates the model at 1 s steps. State is saved in the browser so it continues across pages. The same file holds the command journal, lab sampling, history for trends, instructor failures, exercises, session menu and procedure tracker.<\/li>\n<li><b>HMI<\/b> (<code>assets/ui.js<\/code>, <code>assets/dcs.css<\/code>, one HTML file per page). SVG process graphics drawn in code, tag boxes, faceplates, trends on canvas, alarm banner, alarm sounds synthesised with the Web Audio API, and EASY/HARD modes.<\/li>\n<li><b>Verification.<\/b> Each grade was initialised and run for 1 h simulated time: production ≈ 30 t/h (+ 6 t/h rubber for HECO), temperatures at setpoint, cooling output 35–40 %, pellets on-spec. Scenario tests:\n  <ul>\n  <li>Cooling-water trip: SIS trip at ≈ 5 min 40 s.<\/li>\n  <li>K-211 trip: CO kill after 61 s.<\/li>\n  <li>Catalyst plug: meter reads normal while production decays.<\/li>\n  <li>Extruder trip: catalyst cut at silo 95 %.<\/li>\n  <li>HECO start-up: rubber on-spec in ≈ 45 min.<\/li>\n  <\/ul><\/li>\n<li><b>Manual.<\/b> Written alongside the simulator. The setpoint tables were checked against the values the model calculates.<\/li>\n<\/ol>\n\n<h3>A.4 Software<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Item<\/th><th class=\"l\">Detail<\/th><\/tr>\n<tr><td class=\"l\">Languages<\/td><td class=\"l\">HTML5, CSS, plain JavaScript (no framework, no build step)<\/td><\/tr>\n<tr><td class=\"l\">Third-party code<\/td><td class=\"l\"><b>None.<\/b> No external libraries, fonts or images. All code was written for this project.<\/td><\/tr>\n<tr><td class=\"l\">Browser features used<\/td><td class=\"l\">SVG, Canvas 2D, Web Audio API, localStorage / sessionStorage<\/td><\/tr>\n<tr><td class=\"l\">Runs on<\/td><td class=\"l\">Microsoft Edge or Google Chrome on the local computer. No internet connection needed. A small local web server (Python <code>http.server<\/code>, started by <code>Start Spherizone Simulator.bat<\/code>) is optional.<\/td><\/tr>\n<tr><td class=\"l\">This PDF<\/td><td class=\"l\">Printed from <code>manual.html<\/code> with Microsoft Edge's built-in PDF printer.<\/td><\/tr>\n<\/table>\n\n<h3>A.5 Limitations<\/h3>\n<ul>\n<li>The model is a simplified, lumped training model, not a rigorous design or kinetic model. It is unsuitable for engineering design, troubleshooting a real plant, or estimating real plant performance.<\/li>\n<li>Numbers are plausible in direction and size only. A real Spherizone plant has different equipment, controls, interlocks and limits. Always follow the licensor's and the operating company's own documentation.<\/li>\n<li>Safety-system behaviour is illustrative. It does not represent any real SIS design or safety integrity level.<\/li>\n<\/ul>\n\n<h3>A.6 Revision history<\/h3>\n<table class=\"t\">\n<tr><th>Version<\/th><th class=\"l\">Changes<\/th><\/tr>\n<tr><td>1.2<\/td><td class=\"l\">Student edition: cover page, shift-handover session menu (§2.3), complete start-up and shutdown chapter with physics, pocket cards and self-test (§8), alarm sounds (§10.3), state-based alarm suppression (§10.5), six-day training path (§13.1).<\/td><\/tr>\n<tr><td>1.3<\/td><td class=\"l\">EASY / HARD difficulty modes (§2.4). Faceplate Recipe SP line and one-click \"AUTO + recipe SP\" (§3.4). Full recipe setpoint table and additive package table for every grade (§6). Cold start-up (§8.4): \"AUTO alone does nothing\" warning, start-up setpoint table per grade, an exact value in every step, staged pressurising with safe pressure per temperature, why TEAL flow stays near zero before catalyst. Pop-out windows for alarms and trends (§3.5). New Appendix A: sources, how the simulator was built, software, limitations.<\/td><\/tr>\n<tr><td>1.4<\/td><td class=\"l\">\n<ul style=\"margin:0;padding-left:16px\">\n<li>Area 900 flare, blowdown and utilities page, with live PSV-211 / 301 / 401 relieving to the flare header, knock-out drum D-901 and flare stack FL-901 (§4.6).<\/li>\n<li>Display-only relief devices, PRVs and the blowdown valve.<\/li>\n<li>Trip flaring. The flame and roar grow with flare load.<\/li>\n<li>PSV relief sound.<\/li>\n<li>Green/red run lamps, blinking when tripped (§3.2).<\/li>\n<li>Safety alert pop-up (§10.3).<\/li>\n<li>Realistic process noise and drift, with a filtered PID derivative.<\/li>\n<li>New exercise: PIC-211 failure with PSV-211 lift.<\/li>\n<li>Companion forms: start-up/shutdown checklists SZ-OPS-CL-001 and operator log sheet SZ-OPS-LOG-001.<\/li>\n<\/ul><\/td><\/tr>\n<tr><td>1.5<\/td><td class=\"l\">\n<ul style=\"margin:0;padding-left:16px\">\n<li>Every control valve tagged (FCV, TCV, PCV, LCV, HCV), and the faceplate shows its final element (§3.3).<\/li>\n<li>New page 600 Extrusion &amp; Pelletizing: additive hoppers and loss-in-weight feeders, 6-zone extruder on hot oil, melt pump, screen changer, underwater pelletizer, pellet water and dryer (§4.5b).<\/li>\n<li>Installable app that works offline and updates automatically when published online (§2.1).<\/li>\n<li>Download links for the PDFs.<\/li>\n<\/ul><\/td><\/tr>\n<tr><td>1.6<\/td><td class=\"l\">\n<ul style=\"margin:0;padding-left:16px\">\n<li>Start-up heater E-212 is now throttled by its own controller TIC-212 / TCV-212 (0–4 MW) instead of a fixed 4 MW on/off duty (§4.2, §8.4 steps 4, 10, 11).<\/li>\n<li>Temperature controllers no longer kick the cooling valve when the SP is changed.<\/li>\n<li>New warning on the light-off temperature run-down: cooling, dew margin, K-211 trip, then CO kill.<\/li>\n<li>Low-temperature alarm also active while R-211 is pressurised.<\/li>\n<li>Heater duty added to the cooling trend.<\/li>\n<\/ul><\/td><\/tr>\n<\/table>\n<\/div>\n<\/template>"}};

UI.page({

        (S.lab.length ? S.lab.map(s => {
          const ready = S.t >= s.due, g = SZ.GRADES[s.grade];
          return `<tr><td>${s.no}</td><td>${SZ.fmtT(s.t)}</td><td class="l">${s.kind}</td><td class="l">${s.grade}</td>` + keys.map(k => {
            if (!ready) return '<td class="hint">pending</td>';
            const v = s.props[k], r = g.spec[k], bad = r && (v < r[0] || v > r[1]);
            return `<td class="${bad ? 'bad' : (r ? 'okc' : '')}">${fx(v, SZ.PROPS[k].dec)}</td>`; }).join('') +
            `<td class="${ready && (!s.steam || !s.add) ? 'bad' : ''}">${ready ? (s.steam ? 'ok' : 'NO STEAM') + ' / ' + (s.add ? 'ok' : 'ADD') : '…'}</td></tr>`;
        }).join('') : `<tr><td colspan="13" class="l hint">No samples yet — first routine sample at ${SZ.fmtT(S.nextSample)}.</td></tr>`);
    });
    view.append(lab);

    // ---- live properties
    const lp = UI.card('Instantaneous vs pellet properties (target grade)');
    const pt = UI.h('table', { class: 't' }); lp.querySelector('.bd').append(pt);
    UI.bind(pt, (S) => {
      const g = SZ.GRADES[S.target];
      pt.innerHTML = '<tr><th class="l">Property</th><th>Riser zone</th><th>Downer zone</th><th>Instantaneous</th><th>Pellet (lag ~15 min)</th><th>Spec</th></tr>' + keys.map(k => {
        const P = SZ.PROPS[k], r = g.spec[k], v = S.p.pel[k], bad = r && (v < r[0] || v > r[1]);
        const z = k === 'MFR' ? [fx(S.p.MFRr, 2), fx(S.p.MFRd, 2)] : ['', ''];
        return `<tr><td class="l">${P.label} ${P.unit}</td><td>${z[0]}</td><td>${z[1]}</td><td>${fx(S.p.inst[k], P.dec)}</td><td class="${bad ? 'bad' : ''}">${fx(v, P.dec)}</td><td>${r ? r[0] + ' – ' + (r[1] >= 99 ? '∞' : r[1]) : ''}</td></tr>`; }).join('');
    });
    view.append(lp);
  }
});

  },
  "instructor": function () {

const fx = UI.fx, h = UI.h;
UI.page({
  graphic: false, faceplate: false, side: ['kpi', 'trend:prod'],
  body(view) {
    const grid = h('div', { class: 'panels' }); view.append(grid);

    // ---- failures
    const fc = UI.card('Equipment & instrument failures');
    const fg = h('div', { class: 'fail-grid' });
    for (const k in SZ.FAILS) {
      const b = h('button', { on: { click: () => SZ.cmd({ type: 'fail', name: k, on: !SZ.rt.S.fail[k], src: 'INSTRUCTOR' }) } });
      UI.bind(b, (S) => { b.textContent = S.fail[k] ? 'ACTIVE — clear' : 'Activate'; b.classList.toggle('warn', S.fail[k]); });
      fg.append(h('span', {}, SZ.FAILS[k]), b);
    }
    fc.querySelector('.bd').append(fg, h('div', { class: 'tabs', style: 'margin-top:8px' }));
    fc.querySelector('.tabs').append(h('button', { on: { click: () => SZ.cmd({ type: 'clearFails', src: 'INSTRUCTOR' }) } }, 'Clear all failures'),
      h('button', { on: { click: () => SZ.cmd({ type: 'resetFoul', src: 'INSTRUCTOR' }) } }, 'Reset fouling / chunks'));
    grid.append(fc);

    // ---- poisons + SIS
    const pc = UI.card('Feed poisons & SIS');
    const pb = pc.querySelector('.bd');
    [['H2O', 10], ['CO', 3], ['COS', 10]].forEach(([k, max]) => {
      const r = h('input', { type: 'range', min: 0, max, step: 0.1, style: 'width:100%' }), v = h('span', { class: 'v' });
      r.addEventListener('change', () => SZ.cmd({ type: 'poison', k, v: +r.value, src: 'INSTRUCTOR' }));
      UI.bind(r, (S) => { if (document.activeElement !== r) r.value = S.poison[k]; v.textContent = fx(S.poison[k], 1) + ' ppm'; });
      const row = h('div', { class: 'kv', style: 'grid-template-columns:44px 1fr 70px;margin-bottom:4px' }); row.append(h('span', { class: 'k' }, k), r, v); pb.append(row);
    });
    const sb = h('button', { on: { click: () => SZ.cmd({ type: 'sisBypass', on: !SZ.rt.S.sis.bypass, src: 'INSTRUCTOR' }) } });
    UI.bind(sb, (S) => { sb.textContent = S.sis.bypass ? 'SIS BYPASSED — restore' : 'Bypass SIS'; sb.classList.toggle('warn', S.sis.bypass); });
    const sr = h('button', { on: { click: () => SZ.cmd({ type: 'sisReset', src: 'INSTRUCTOR' }) } }, 'Reset catalyst cut');
    const kr = h('button', { on: { click: () => SZ.cmd({ type: 'kill', a: 'RESET', src: 'INSTRUCTOR' }) } }, 'Reset CO kill → purge');
    const t = h('div', { class: 'tabs', style: 'margin-top:8px' }); const nb = h('button', { title: 'Small random drifts and measurement noise, like a real plant', on: { click: () => SZ.cmd({ type: 'noise', on: SZ.rt.S.noiseOn === false, src: 'INSTRUCTOR' }) } });
    UI.bind(nb, (S) => { nb.textContent = S.noiseOn === false ? 'Process noise OFF — turn on' : 'Process noise ON — turn off'; nb.classList.toggle('warn', S.noiseOn === false); });
    t.append(sb, sr, kr, nb); pb.append(t);
    pb.append(UI.kv([['SIS status', S => S.sis.bypass ? 'BYPASSED' : 'NORMAL', '', 0, S => S.sis.bypass], ['CO kill', S => S.sis.kill, '', 0, S => S.sis.kill !== 'NORMAL'],
      ['Last trip demand', S => S.sis.lastTrip || '—', '', 0]]));
    grid.append(pc);

    // ---- init / snapshot
    const ic = UI.card('Initialise & snapshots');
    const ib = ic.querySelector('.bd');
    const sel = h('select'); for (const g in SZ.GRADES) sel.append(h('option', { value: g }, g));
    const ri = h('button', { class: 'warn', on: { click: () => { if (confirm('Re-initialise the plant at steady state on ' + sel.value + '? Current state is lost.')) SZ.cmd({ type: 'reinit', grade: sel.value }); } } }, 'Re-initialise at steady state');
    const r1 = h('div', { class: 'tabs' }); r1.append(sel, ri);
    const r2 = h('div', { class: 'tabs', style: 'margin-top:6px' });
    r2.append(h('button', { on: { click: () => SZ.cmd({ type: 'snapSave' }) } }, 'Save snapshot'), h('button', { on: { click: () => { if (confirm('Restore saved snapshot?')) SZ.cmd({ type: 'snapRestore' }); } } }, 'Restore snapshot'));
    const r0 = h('div', { class: 'tabs', style: 'margin-bottom:6px' });
    r0.append(h('button', { on: { click: () => UI.sessionMenu(true) } }, '☰ Session menu — normal / drills / start-up / shutdown'),
      h('button', { on: { click: () => { if (confirm('Initialise the plant COLD (all equipment stopped) for a start-up on ' + sel.value + '?')) SZ.cmd({ type: 'session', mode: 'startup', grade: sel.value }); } } }, 'Initialise cold (start-up)'));
    ib.append(r0, r1, h('div', { class: 'hint' }, 'Initialisation settles the model silently for ~4 h sim time.'), r2);
    grid.append(ic);

    // ---- alarm sound test
    const ac = UI.card('Alarm sounds');
    const ar = h('div', { class: 'tabs' });
    [[1, 'Test P1 (warble)'], [2, 'Test P2 (double beep)'], [3, 'Test P3 (chime)']].forEach(([p, l]) => ar.append(h('button', { on: { click: () => UI.audio.test(p) } }, l)));
    const tg = h('button', { on: { click: () => UI.audio.toggle() } }); UI.bind(tg, () => { tg.textContent = UI.audio.on ? 'Sound is ON — turn off' : 'Sound is OFF — turn on'; tg.classList.toggle('warn', !UI.audio.on); });
    ar.append(h('button', { on: { click: () => UI.audio.testHiss() } }, 'Test PSV relief (kshhh)'), h('button', { on: { click: () => UI.audio.testRoar() } }, 'Test flare roar'), tg);
    ac.querySelector('.bd').append(ar, h('div', { class: 'hint', style: 'margin-top:6px' }, 'P1 repeats every 1.4 s and P2 every 4 s until acknowledged or silenced; P3 chimes once. Browsers only allow sound after you have clicked somewhere on the page.'));
    grid.append(ac);

    // ---- hidden truth (instructor only)
    const tc = UI.card('Instructor view — true vs measured');
    tc.querySelector('.bd').append(UI.kv([
      ['Catalyst real / meter', S => fx(S.p.catAct, 3) + ' / ' + fx(S.p.catMeas, 3), 'kg/h', 3, S => Math.abs(S.p.catAct - S.p.catMeas) > 0.02],
      ['Riser H2 true / GC', S => fx(S.p.H2r, 2) + ' / ' + fx(S.p.H2gc, 2), 'mol%', 2, S => Math.abs(S.p.H2r - S.p.H2gc) > 0.1],
      ['LV-401 actual / LIC OP', S => fx(S.p.lv401, 0) + ' / ' + fx(S.ctl['LIC-401'].op, 0), '%', 0, S => Math.abs(S.p.lv401 - S.ctl['LIC-401'].op) > 2],
      ['PIC-211 OP', S => S.ctl['PIC-211'].op, '%', 1], ['Active exercise', S => S.exercise ? S.exercise.title : '—', '', 0],
      ['Scheduled events', S => S.sched.filter(x => !x.done).map(x => SZ.FAILS[x.fail] + ' @ ' + SZ.fmtT(x.t)).join(', ') || '—', '', 0]
    ]));
    grid.append(tc);

    // ---- exercises
    const ec = UI.card('Training exercises');
    const eb = ec.querySelector('.bd');
    for (const ex of SZ.EXERCISES) {
      const d = h('div', { class: 'ex' });
      d.append(h('b', {}, ex.title), h('p', {}, ex.brief), h('button', { on: { click: () => { if (confirm('Start exercise "' + ex.title + '"? The plant is re-initialised.')) SZ.cmd({ type: 'exercise', id: ex.id }); } } }, 'Start exercise'));
      eb.append(d);
    }
    view.append(ec);
  }
});

  },
  "manual": function () {

UI.page({
  graphic: false, faceplate: false,
  side: [() => {
    const c = UI.card('Contents');
    const bd = c.querySelector('.bd'); bd.classList.add('toc');
    c.style.position = 'sticky'; c.style.top = '84px';
    return c;
  }, 'kpi'],
  body(view) {
    view.append(document.getElementById('manual').content.cloneNode(true));
  }
});
// build table of contents from headings
const toc = document.querySelector('.toc');
const ptoc = UI.h('div', { class: 'print-toc' }, '<h2>Contents</h2>');
document.querySelectorAll('.man h2').forEach(h2 => { toc.append(UI.h('a', { href: '#' + h2.id }, h2.textContent)); ptoc.append(UI.h('a', { href: '#' + h2.id }, h2.textContent)); });
document.querySelector('.man .warn').after(ptoc);

  }
};
const want = new URLSearchParams(location.search).get('p');
const id = PAGES[want] ? want : 'index';
document.title = PAGES[id].title + ' (offline)';
document.body.dataset.page = id;
document.body.insertAdjacentHTML('beforeend', PAGES[id].body);
RUN[id]();
})();
</script>
</body>
