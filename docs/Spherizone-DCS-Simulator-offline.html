2\">2. Getting started<\/h2>\n<h3>2.1 Launching the simulator<\/h3>\n<ol>\n<li>Double-click <code>Start Spherizone Simulator.bat<\/code> in the project folder. Your browser opens the Overview page. <i>(Alternative: right-click <code>spherizone\\index.html<\/code> → Open with → Microsoft Edge or Chrome.)<\/i><\/li>\n<li>The <b>Shift handover<\/b> menu appears first and asks which plant condition you want for this session (see 2.3). Pick one tile — the plant is set up and the simulation starts.<\/li>\n<li>The simulation keeps running while you move between pages. If you close the browser, the state is saved; next time the menu offers <b>Continue previous session<\/b>.<\/li>\n<\/ol>\n<div class=\"tip\"><b>Tip:<\/b> Use one browser tab and the page tabs at the top. If you open several tabs, only one (marked <b>SIM ●<\/b> in the header) runs the model; the others show <b>SIM ○ follower<\/b> and send your actions to it.<\/div>\n<h3>Online version, app install and automatic updates<\/h3>\n<ul>\n<li><b>Online:<\/b> open <a href=\"https://azhartheking.github.io/spherizone-dcs/\"><b>https://azhartheking.github.io/spherizone-dcs/<\/b><\/a> in Edge or Chrome. Nothing to download, and it is always the newest version.<\/li>\n<li><b>Install as an app:<\/b> click <b>⬇ INSTALL APP<\/b> in the header (or the install icon in the address bar). The simulator gets its own window and a desktop / Start-menu icon, and keeps working offline.<\/li>\n<li><b>Automatic updates:<\/b> when online, every page loads the newest published version. If you keep the simulator open while a new version is published, a box <b>\"New version … available — Reload now\"<\/b> appears within 10 minutes. Your plant state is kept.<\/li>\n<li>Your plant and settings are stored in your own browser, so each person runs their own plant.<\/li>\n<\/ul>\n<div class=\"box\" style=\"border:1px solid #b9bcbf;background:#f4f4f4;padding:6px 10px;margin:6px 0\"><b>Downloads<\/b> (print one copy per exercise or shift):\n<a href=\"docs/Spherizone Student Manual v1.6.pdf\">Student manual (PDF)<\/a> ·\n<a href=\"docs/Spherizone Start-up and Shutdown Checklists v1.5.pdf\">Start-up &amp; shutdown checklists (PDF)<\/a> ·\n<a href=\"docs/Spherizone Operator Log Sheet v1.4.pdf\">Operator log sheet (PDF)<\/a> ·\n<a href=\"forms/checklists.html\">checklists (print from browser)<\/a> · <a href=\"forms/logsheet.html\">log sheet (print from browser)<\/a><br>\n<b>Single-file offline version:<\/b> <a href=\"docs/Spherizone-DCS-Simulator-offline.html\" download>Spherizone-DCS-Simulator-offline.html<\/a>. It is one file that runs the whole simulator when you double-click it, with no folder, installation or internet needed, so it is easy to send by e-mail or WhatsApp. It does not update itself, but it tells you when a newer version is online.<\/div>\n<h3>Phones and tablets<\/h3>\n<p>The online version also works in phone and tablet browsers:<\/p>\n<ul>\n<li>The page tabs scroll sideways.<\/li>\n<li>Each process graphic can be swiped sideways.<\/li>\n<li>Tapping a tag, valve or pump opens its faceplate from the bottom of the screen; close it with <b>✕ close<\/b>.<\/li>\n<\/ul>\n<p>A tablet in landscape gives the best view. On a phone, <b>⬇ INSTALL APP<\/b> (or \"Add to Home screen\") puts it on the home screen.<\/p>\n<h3>2.2 Time control<\/h3>\n<ul>\n<li><b>Clock<\/b> — simulation time (hh:mm:ss) in the header.<\/li>\n<li><b>❚❚ FREEZE / ▶ RUN<\/b> — stops and restarts the process.<\/li>\n<li><b>1× 5× 20× 60×<\/b> — speed. Use 1× when learning upsets; use 20–60× to watch slow things such as grade changes, donor transitions, silo filling, heat-up during start-up or the reaction dying away during shutdown.<\/li>\n<\/ul>\n<h3>2.3 Session menu (shift handover)<\/h3>\n<p>The menu opens automatically the first time you open the simulator in a browser session. Reopen it at any time with <b>☰ SESSION<\/b> in the header (or from the Instructor page); choosing a new condition replaces the current plant state after a confirmation. The header button shows the current mode, e.g. <b>☰ SESSION: START-UP<\/b>.<\/p>\n<p>First choose the <b>grade<\/b> at the top of the menu (used for steady state, start-up and shutdown). Then pick one tile:<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Section<\/th><th class=\"l\">Tile<\/th><th class=\"l\">What you get<\/th><\/tr>\n<tr><td class=\"l\">Continue<\/td><td class=\"l\">Continue previous session<\/td><td class=\"l\">Only shown when a saved plant exists. Resumes exactly where you left off.<\/td><\/tr>\n<tr><td class=\"l\">Normal operation<\/td><td class=\"l\">Steady state<\/td><td class=\"l\">Plant lined out at ~30 t/h on the chosen grade, no upset planned. Free practice.<\/td><\/tr>\n<tr><td class=\"l\">Plant start-up &amp; shutdown<\/td><td class=\"l\">Full plant start-up (cold)<\/td><td class=\"l\">All equipment stopped, R-211 empty at 25 °C / 1 barg, silo 10 %. Bring the plant to rate and on-spec — chapter 8.4. HOMO and RACO grades only (start HECO by a grade change afterwards, 7.5).<\/td><\/tr>\n<tr><td class=\"l\"><\/td><td class=\"l\">Controlled plant shutdown<\/td><td class=\"l\">Plant at steady state on the chosen grade. Take it down to a stopped, depressurised condition — chapter 8.6.<\/td><\/tr>\n<tr><td class=\"l\">Upset drills<\/td><td class=\"l\">CW pump trip · K-211 trip · hidden failure · COS poisoning · extruder trip<\/td><td class=\"l\">The instructor training exercises (chapter 13). Each starts on its own grade at steady state; the upset arrives a few minutes later.<\/td><\/tr>\n<tr><td class=\"l\">Grade-change exercises<\/td><td class=\"l\">H-INJ → R-7 · R-7 → I-12 · I-12 → H-BOPP<\/td><td class=\"l\">Planned transitions (procedures 7.4–7.6).<\/td><\/tr>\n<\/table>\n<p>The <b>Session<\/b> card at the top of the side panel (every process page) shows the session title and brief. In start-up and shutdown it also shows the <b>procedure tracker<\/b>: each step ticks green with its time the moment the plant reaches it, the next step is highlighted in blue, and clicking a step opens the page where it is done. Steps tick <i>in order<\/i>. When the last step is reached the card shows <b>COMPLETE<\/b> with the elapsed time, off-spec tonnes and the number of SIS trips — use these to score the run.<\/p>\n\n<!-- ============================================================ -->\n<h3>2.4 Difficulty: EASY and HARD mode<\/h3>\n<p>Choose the difficulty in the session menu (<b>Difficulty<\/b> row) or switch it at any time with the <b>◇ EASY / ◆ HARD<\/b> button in the header. The procedures and the step tracker are the same in both modes. Only the help changes.<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Feature<\/th><th class=\"l\">◇ EASY<\/th><th class=\"l\">◆ HARD<\/th><\/tr>\n<tr><td class=\"l\">Faceplate <b>Recipe SP<\/b> line and <b>Use recipe SP / AUTO + recipe SP<\/b> button<\/td><td class=\"l\">Shown<\/td><td class=\"l\">Hidden<\/td><\/tr>\n<tr><td class=\"l\">Quality &amp; Grades: recipe column and <b>Apply recipe SPs<\/b><\/td><td class=\"l\">Shown<\/td><td class=\"l\">Hidden. Only current SPs are listed. Apply is refused.<\/td><\/tr>\n<tr><td class=\"l\">Finishing: additive recipe ppm column<\/td><td class=\"l\">Shown<\/td><td class=\"l\">Hidden (\"— (manual)\")<\/td><\/tr>\n<tr><td class=\"l\">P3 alarm \"Current SPs differ from target-grade recipe\"<\/td><td class=\"l\">Active<\/td><td class=\"l\">Suppressed<\/td><\/tr>\n<tr><td class=\"l\">Procedure tracker, product specs, lab results, all other alarms, KPIs, trends<\/td><td class=\"l\">Shown<\/td><td class=\"l\">Shown<\/td><\/tr>\n<tr><td class=\"l\">Where setpoints come from<\/td><td class=\"l\">Faceplate hint or manual<\/td><td class=\"l\">This manual only: §5 normal conditions, §6 grade and additive tables, §8.4 start-up setpoint table<\/td><\/tr>\n<\/table>\n<div class=\"note\"><b>Scoring.<\/b> A procedure that is started in HARD and finished without switching is recorded as <b>HARD mode<\/b> in the journal and on the Session card. Switching to EASY in the middle of a run is logged, and that run is then scored as <b>EASY<\/b>.<\/div>\n\n<h2 id=\"s3\">3. The DCS screens<\/h2>\n<h3>3.1 Screen layout<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Area of screen<\/th><th class=\"l\">What it shows<\/th><\/tr>\n<tr><td class=\"l\">Header (top)<\/td><td class=\"l\">Target grade and pellet ON/OFF-SPEC status · <b>☰ SESSION<\/b> (session menu, shows current mode) · clock · freeze · speed · alarm counters P1/P2/P3 (click → Alarms page) · ACK ALL<\/td><\/tr>\n<tr><td class=\"l\">Page tabs<\/td><td class=\"l\">Navigation between pages. A coloured dot on a tab means that page has an active alarm (blinking = unacknowledged). Keyboard: Alt+1 … Alt+0.<\/td><\/tr>\n<tr><td class=\"l\">Graphic (centre)<\/td><td class=\"l\">Process schematic with tag boxes, valves, motors and indicators. Arrow boxes at the edge (e.g. <code>TO D-301 FLASH (300) ▶<\/code>) are off-page connectors — click to follow the process.<\/td><\/tr>\n<tr><td class=\"l\">Faceplate (right)<\/td><td class=\"l\">Opens when you click a tag box, valve or motor. This is where you operate it.<\/td><\/tr>\n<tr><td class=\"l\">KPI panel &amp; mini trend<\/td><td class=\"l\">Production rates, catalyst mileage, MFR/XS instantaneous vs pellet, on/off-spec tonnes, plus a trend relevant to the page.<\/td><\/tr>\n<tr><td class=\"l\">Alarm banner (bottom)<\/td><td class=\"l\">The three most important alarms. Click one to acknowledge it and jump to its tag.<\/td><\/tr>\n<\/table>\n<h3>3.2 Colour philosophy (ISA-101)<\/h3>\n<p>The screens are deliberately grey. <b>Colour means something is abnormal.<\/b><\/p>\n<ul>\n<li><span style=\"background:var(--p1);color:#fff;padding:0 5px\">Red<\/span> priority 1 alarm — immediate action.<\/li>\n<li><span style=\"background:var(--p2);padding:0 5px\">Amber<\/span> priority 2 alarm — prompt action.<\/li>\n<li><span style=\"background:var(--p3);color:#fff;padding:0 5px\">Magenta<\/span> priority 3 alarm — awareness / correct when possible.<\/li>\n<li>Blinking = not yet acknowledged. A white <b>MAN<\/b> badge on a tag box means the controller is in manual.<\/li>\n<li>Motors: <b>dark filled<\/b> = running, <b>white<\/b> = stopped. Each motor, compressor and heater has a <b>status lamp<\/b>: <span style=\"color:#22b04b;font-weight:700\">●<\/span> green = running, <span style=\"color:#d32f2f;font-weight:700\">●<\/span> red = stopped, <b>blinking red<\/b> with a blinking red outline = <b>tripped<\/b> (stopped by a fault or a protection, not by the operator). Hover the lamp to see the trip reason. Starting or stopping the motor yourself clears the trip mark.<\/li><li>Relief valves (PSV) turn <b>red<\/b> while relieving, and the flare line from them turns red and moves.<\/li>\n<li>Pipes drawn light grey are not in use (e.g. the GPR route when bypassed).<\/li>\n<\/ul>\n<h3>3.3 Reading a tag box<\/h3>\n<div class=\"flow\">┌─────────────────────────┐\n│ TIC-211           [MAN] │  ← tag and mode (badge only shown when not AUTO)\n│ 80.0                 °C │  ← process value (PV) and unit\n│ SP 80.0  OP 35%         │  ← setpoint and controller output\n└─────────────────────────┘<\/div>\n<p><b>Control valves<\/b> carry their own tag under the valve symbol, with the valve position underneath (e.g. <span class=\"tg\">TCV-211<\/span> / 35 %). The letters follow the variable the valve controls:<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Prefix<\/th><th class=\"l\">Meaning<\/th><th class=\"l\">Valves in this plant<\/th><\/tr>\n<tr><td class=\"l\">FCV<\/td><td class=\"l\">Flow control valve<\/td><td class=\"l\">FCV-201 fresh C₃, FCV-203 ethylene, FCV-211 hydrogen (set by AIC-211), FCV-212 barrier, FCV-401 ethylene and FCV-402 hydrogen to R-401 (set by AIC-401 / AIC-402)<\/td><\/tr>\n<tr><td class=\"l\">TCV<\/td><td class=\"l\">Temperature control valve<\/td><td class=\"l\">TCV-211 E-211 cooling water, TCV-401 E-401 cooling water<\/td><\/tr>\n<tr><td class=\"l\">PCV<\/td><td class=\"l\">Pressure control valve<\/td><td class=\"l\">PCV-211A/B split range (A = vent below 30 %, B = make-up above 30 %), PCV-301 flash overhead, PCV-401 R-401 make-up<\/td><\/tr>\n<tr><td class=\"l\">LCV<\/td><td class=\"l\">Level control valve<\/td><td class=\"l\">LCV-401 R-401 powder discharge<\/td><\/tr>\n<tr><td class=\"l\">HCV<\/td><td class=\"l\">Hand control valve<\/td><td class=\"l\">HCV-213 solids circulation<\/td><\/tr>\n<tr><td class=\"l\">SC<\/td><td class=\"l\">Speed controller (no valve)<\/td><td class=\"l\">SC-101 catalyst feeder, SC-102 / SC-103 pump strokes, SC-601 extruder speed<\/td><\/tr>\n<\/table>\n<p>The faceplate shows each controller's final element, for example \"final element TCV-211\".<\/p>\n<h3>3.4 Using a faceplate<\/h3>\n<ol>\n<li>Click the tag. The faceplate shows a bar (grey = PV, blue line = SP, small bar = OP), the numbers, the range and whether it is direct or reverse acting.<\/li>\n<li><b>AUTO<\/b> — the controller moves the OP to hold PV at SP. Type a new SP and press <b>Set SP<\/b> (or Enter).<\/li>\n<li><b>MAN<\/b> — you set the valve position directly: type OP and press <b>Set OP<\/b>. In MAN the SP tracks the PV, so switching back to AUTO is bumpless.<\/li>\n<li><b>▲ ▼<\/b> — in AUTO they nudge SP by 0.5 % of span; in MAN they nudge OP by 1 %.<\/li>\n<li><b>Recipe SP line<\/b> (EASY mode only) — under the SP box: the setpoint the target grade needs (or the normal value, for tags outside the recipe). Amber = your SP differs. <b>Use recipe SP<\/b> loads it; <b>AUTO + recipe SP<\/b> switches to AUTO and loads it in one click. During start-up some steps use a lower start-up value first (catalyst 0.2 kg/h, fresh C₃ 5 t/h) — see the start-up table in 8.4.<\/li>\n<li>Motors (pumps, compressors, extruder) have <b>START / STOP<\/b>. A motor tripped by a fault cannot be restarted until the fault is cleared (\"MCC lock-out\").<\/li>\n<\/ol>\n<div class=\"note\">Every operator action is written to the <b>Event journal<\/b> (Alarms &amp; Journal page) with the time. Trainers use it for debriefing.<\/div>\n\n<!-- ============================================================ -->\n<h3>3.5 Pop-out windows (second screen / split screen)<\/h3>\n<p>Click <b>⧉ POP OUT<\/b> in the header to open a view in its own small window: the alarm summary, all trends, one trend group, the overview graphic, or the page you are on. Trend cards and the Alarms page also have their own <b>⧉<\/b> button. Drag the window to a second monitor, or snap it beside the main window (Windows key + ← / →).<\/p>\n<ul>\n<li>Every window shows the <b>same live plant<\/b>. Only the main window runs the model (<b>SIM ●<\/b>); pop-outs follow it (<b>SIM ○ follower<\/b>).<\/li>\n<li>Pop-outs are compact: no page tabs or side panel. You can still acknowledge alarms and change the trend window there. Each pop-out remembers its own trend group and time window.<\/li>\n<li>Clicking an alarm in a pop-out opens that tag in the <b>main<\/b> window.<\/li>\n<li>Only one window plays the alarm horn: the one you last clicked.<\/li>\n<li>If nothing opens, allow pop-ups for the simulator in your browser (icon at the right of the address bar).<\/li>\n<\/ul>\n\n<h2 id=\"s4\">4. Process description by area<\/h2>\n<p>The block flow diagram (BFD) below shows the whole plant on one page. Read it like a story. Catalyst is activated in Area 100, polymer grows in R-211, gas is separated from the powder in the flash, rubber is added in R-401 for impact grades only, and the powder is finished into pellets.<\/p>\n<svg class=\"fig\" viewBox=\"0 0 1000 450\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Arial, sans-serif\" role=\"img\" aria-label=\"Block flow diagram of the Spherizone polypropylene plant\">\n<defs>\n<marker id=\"bA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#33373b\"/><\/marker>\n<marker id=\"bT\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f8a8a\"/><\/marker>\n<marker id=\"bG\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a8e93\"/><\/marker>\n<marker id=\"bO\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#d0782a\"/><\/marker>\n<\/defs>\n<style>\n.ar{fill:none;stroke:#33373b;stroke-width:2.2}.bl{stroke-width:1.6}.t{font-size:12.5px;font-weight:700;fill:#121416}.s{font-size:10.5px;fill:#3d4248}.al{font-size:11px;font-weight:700;letter-spacing:.06em}.n{font-size:10.5px;fill:#33373b;font-style:italic}\n<\/style>\n<!-- feeds into R-211 -->\n\n<text class=\"n\" x=\"330\" y=\"18\">propylene · H₂ · ethylene (RACO) · barrier C₃<\/text>\n<!-- recycle -->\n\n<text class=\"n\" x=\"512\" y=\"35\" fill=\"#1f8a8a\" style=\"fill:#1f8a8a\">recycled propylene (E-301)<\/text>\n<!-- AREA 100 -->\n<rect x=\"20\" y=\"58\" width=\"290\" height=\"186\" rx=\"6\" fill=\"#efe9f7\" stroke=\"#7b5ea7\" class=\"bl\"/>\n<text class=\"al\" x=\"30\" y=\"76\" fill=\"#7b5ea7\">AREA 100 · CATALYST<\/text>\n<g class=\"bl\" stroke=\"#7b5ea7\" fill=\"#fff\">\n<rect x=\"32\" y=\"92\" width=\"78\" height=\"34\" rx=\"4\"/><rect x=\"32\" y=\"136\" width=\"78\" height=\"34\" rx=\"4\"/><rect x=\"32\" y=\"180\" width=\"78\" height=\"34\" rx=\"4\"/>\n<rect x=\"134\" y=\"128\" width=\"72\" height=\"50\" rx=\"4\"/><rect x=\"226\" y=\"128\" width=\"74\" height=\"50\" rx=\"4\"/>\n<\/g>\n<text class=\"t\" x=\"40\" y=\"108\">D-101<\/text><text class=\"s\" x=\"40\" y=\"120\">ZN catalyst<\/text>\n<text class=\"t\" x=\"40\" y=\"152\">D-102<\/text><text class=\"s\" x=\"40\" y=\"164\">TEAL<\/text>\n<text class=\"t\" x=\"40\" y=\"196\">D-103<\/text><text class=\"s\" x=\"40\" y=\"208\">ext. donor<\/text>\n<path class=\"ar\" d=\"M110,109 L122,109 L122,153 M110,197 L122,197 L122,153 M110,153 L132,153\" marker-end=\"url(#bA)\"/>\n<text class=\"t\" x=\"141\" y=\"146\">D-104<\/text><text class=\"s\" x=\"141\" y=\"159\">precontact<\/text><text class=\"s\" x=\"141\" y=\"171\">≈ 10 min<\/text>\n<path class=\"ar\" d=\"M206,153 L224,153\" marker-end=\"url(#bA)\"/>\n<text class=\"t\" x=\"233\" y=\"146\">R-101<\/text><text class=\"s\" x=\"233\" y=\"159\">prepolymer<\/text><text class=\"s\" x=\"233\" y=\"171\">≈ 20 min<\/text>\n\n<!-- AREA 200 -->\n<rect x=\"330\" y=\"58\" width=\"200\" height=\"186\" rx=\"6\" fill=\"#e3edf9\" stroke=\"#2f6fb3\" class=\"bl\"/>\n<text class=\"al\" x=\"340\" y=\"76\" fill=\"#2f6fb3\">AREA 200 · REACTOR<\/text>\n<rect x=\"350\" y=\"110\" width=\"160\" height=\"86\" rx=\"5\" fill=\"#fff\" stroke=\"#2f6fb3\" stroke-width=\"2.4\"/>\n<text class=\"t\" x=\"430\" y=\"132\" text-anchor=\"middle\" style=\"font-size:14px\">R-211 MZCR<\/text>\n<text class=\"s\" x=\"430\" y=\"150\" text-anchor=\"middle\">riser (high H₂) + downer (low H₂)<\/text>\n<text class=\"s\" x=\"430\" y=\"166\" text-anchor=\"middle\">80 °C · 28 barg · ~30 t/h<\/text>\n<text class=\"s\" x=\"430\" y=\"182\" text-anchor=\"middle\">heat of reaction ≈ 17 MW<\/text>\n<text class=\"s\" x=\"340\" y=\"214\">K-211 cycle gas · E-211 · P-701 CW<\/text>\n<text class=\"s\" x=\"340\" y=\"228\">E-212 heater · XV-901 CO kill<\/text>\n\n<text class=\"n\" x=\"516\" y=\"146\">powder<\/text>\n<!-- AREA 300 -->\n<rect x=\"560\" y=\"58\" width=\"160\" height=\"186\" rx=\"6\" fill=\"#e0f3f2\" stroke=\"#1f8a8a\" class=\"bl\"/>\n<text class=\"al\" x=\"570\" y=\"76\" fill=\"#1f8a8a\">AREA 300 · FLASH<\/text>\n<rect x=\"580\" y=\"110\" width=\"120\" height=\"86\" rx=\"5\" fill=\"#fff\" stroke=\"#1f8a8a\" stroke-width=\"2.2\"/>\n<text class=\"t\" x=\"640\" y=\"134\" text-anchor=\"middle\">D-301<\/text><text class=\"s\" x=\"640\" y=\"150\" text-anchor=\"middle\">HP flash drum<\/text><text class=\"s\" x=\"640\" y=\"166\" text-anchor=\"middle\">18 barg<\/text><text class=\"s\" x=\"640\" y=\"182\" text-anchor=\"middle\">gas → E-301<\/text>\n<!-- to GPR -->\n\n\n<!-- AREA 400 -->\n<rect x=\"750\" y=\"58\" width=\"230\" height=\"186\" rx=\"6\" fill=\"#fcecdd\" stroke=\"#d0782a\" class=\"bl\" stroke-dasharray=\"7 4\"/>\n<text class=\"al\" x=\"760\" y=\"76\" fill=\"#d0782a\">AREA 400 · GAS-PHASE<\/text>\n<text class=\"s\" x=\"760\" y=\"90\" style=\"fill:#d0782a;font-weight:600\">HECO (impact) grades only<\/text>\n<path d=\"M945,30 L945,106\" fill=\"none\" stroke=\"#d0782a\" stroke-width=\"2\" marker-end=\"url(#bO)\"/>\n<text class=\"n\" x=\"868\" y=\"24\">ethylene + H₂<\/text>\n<rect x=\"780\" y=\"108\" width=\"180\" height=\"76\" rx=\"5\" fill=\"#fff\" stroke=\"#d0782a\" stroke-width=\"2.2\"/>\n<text class=\"t\" x=\"870\" y=\"130\" text-anchor=\"middle\">R-401 GPR<\/text><text class=\"s\" x=\"870\" y=\"146\" text-anchor=\"middle\">fluidised bed · K-401 / E-401<\/text><text class=\"s\" x=\"870\" y=\"162\" text-anchor=\"middle\">makes EPR rubber in particles<\/text><text class=\"s\" x=\"870\" y=\"176\" text-anchor=\"middle\">75 °C · 14 barg<\/text>\n\n<!-- bypass -->\n\n<text class=\"n\" x=\"652\" y=\"256\" style=\"fill:#5d6166\">HS-302: in service → R-401 (HECO) · bypass → D-501<\/text>\n<!-- AREA 500/600 -->\n<rect x=\"330\" y=\"282\" width=\"650\" height=\"124\" rx=\"6\" fill=\"#e5f3e5\" stroke=\"#3a8a3f\" class=\"bl\"/>\n<text class=\"al\" x=\"340\" y=\"300\" fill=\"#3a8a3f\">AREAS 500/600 · FINISHING<\/text>\n<g stroke=\"#3a8a3f\" stroke-width=\"2.2\" fill=\"#fff\"><rect x=\"800\" y=\"308\" width=\"160\" height=\"70\" rx=\"5\"/><rect x=\"590\" y=\"308\" width=\"160\" height=\"70\" rx=\"5\"/><rect x=\"380\" y=\"308\" width=\"160\" height=\"70\" rx=\"5\"/><\/g>\n<text class=\"t\" x=\"880\" y=\"330\" text-anchor=\"middle\">D-501 steamer / dryer<\/text><text class=\"s\" x=\"880\" y=\"346\" text-anchor=\"middle\">steam kills catalyst,<\/text><text class=\"s\" x=\"880\" y=\"360\" text-anchor=\"middle\">strips monomer · N₂ dries<\/text>\n<path class=\"ar\" d=\"M800,343 L752,343\" marker-end=\"url(#bA)\"/>\n<text class=\"t\" x=\"670\" y=\"330\" text-anchor=\"middle\">D-601 powder silo<\/text><text class=\"s\" x=\"670\" y=\"346\" text-anchor=\"middle\">400 t buffer<\/text><text class=\"s\" x=\"670\" y=\"360\" text-anchor=\"middle\">LIC-601 sets extruder rate<\/text>\n<path class=\"ar\" d=\"M590,343 L542,343\" marker-end=\"url(#bA)\"/>\n<text class=\"t\" x=\"460\" y=\"330\" text-anchor=\"middle\">EX-601 extruder<\/text><text class=\"s\" x=\"460\" y=\"346\" text-anchor=\"middle\">melts, mixes additives,<\/text><text class=\"s\" x=\"460\" y=\"360\" text-anchor=\"middle\">cuts pellets<\/text>\n<path class=\"ar\" d=\"M460,432 L460,380\" marker-end=\"url(#bA)\"/>\n<text class=\"n\" x=\"470\" y=\"428\">additives: AO · acid scavenger · nucleator · antistatic · slip<\/text>\n<path class=\"ar\" d=\"M380,343 L292,343\" marker-end=\"url(#bA)\"/>\n<rect x=\"170\" y=\"316\" width=\"120\" height=\"54\" rx=\"6\" fill=\"#2b2f33\"/>\n<text x=\"230\" y=\"339\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:#fff\">PP PELLETS<\/text><text x=\"230\" y=\"356\" text-anchor=\"middle\" style=\"font-size:10.5px;fill:#d9dbdc\">to bagging / sale<\/text>\n<path d=\"M700,140 L778,140\" fill=\"none\" stroke=\"#d0782a\" stroke-width=\"2.2\" marker-end=\"url(#bO)\"/>\n<path d=\"M900,184 L900,306\" fill=\"none\" stroke=\"#d0782a\" stroke-width=\"2.2\" marker-end=\"url(#bO)\"/>\n<path class=\"ar\" d=\"M482,24 L482,108\" marker-end=\"url(#bA)\"/>\n<path d=\"M688,108 L688,40 L500,40 L500,108\" fill=\"none\" stroke=\"#1f8a8a\" stroke-width=\"2\" stroke-dasharray=\"6 4\" marker-end=\"url(#bT)\"/>\n<path class=\"ar\" d=\"M300,153 L348,153\" marker-end=\"url(#bA)\"/>\n<path class=\"ar\" d=\"M510,153 L578,153\" marker-end=\"url(#bA)\"/>\n<path d=\"M640,196 L640,262 L850,262 L850,306\" fill=\"none\" stroke=\"#8a8e93\" stroke-width=\"2.2\" stroke-dasharray=\"7 4\" marker-end=\"url(#bG)\"/>\n<!-- legend -->\n<g transform=\"translate(20,270)\">\n<text class=\"al\" x=\"0\" y=\"0\" fill=\"#45494e\">LEGEND<\/text>\n<path class=\"ar\" d=\"M0,16 L34,16\" marker-end=\"url(#bA)\"/><text class=\"s\" x=\"42\" y=\"20\">main process flow<\/text>\n<path d=\"M0,34 L34,34\" stroke=\"#1f8a8a\" stroke-width=\"2\" stroke-dasharray=\"6 4\" marker-end=\"url(#bT)\"/><text class=\"s\" x=\"42\" y=\"38\">recycle<\/text>\n<path d=\"M0,52 L34,52\" stroke=\"#8a8e93\" stroke-width=\"2.2\" stroke-dasharray=\"7 4\" marker-end=\"url(#bG)\"/><text class=\"s\" x=\"42\" y=\"56\">bypass route<\/text>\n<rect x=\"0\" y=\"66\" width=\"34\" height=\"14\" rx=\"3\" fill=\"#fcecdd\" stroke=\"#d0782a\" stroke-dasharray=\"5 3\"/><text class=\"s\" x=\"42\" y=\"77\">used for HECO only<\/text>\n<\/g>\n<\/svg>\n<div class=\"cap\">Figure 4.1 — Block flow diagram of the Spherizone PP plant. Colours match the area numbers used on the DCS pages.<\/div>\n\n<h3>4.1 Area 100 — Catalyst feed, precontact and prepolymerisation <a href=\"catalyst.html\">(open page)<\/a><\/h3>\n<ul>\n<li><b>D-101<\/b> catalyst drum with feeder, flow controlled by <span class=\"tg\">FIC-101<\/span> (kg/h).<\/li>\n<li><b>D-102<\/b> TEAL drum and pump P-102. <span class=\"tg\">FFIC-102<\/span> holds the <b>TEAL/catalyst ratio<\/b> (g/g).<\/li>\n<li><b>D-103<\/b> donor drum and pump P-103. <span class=\"tg\">FFIC-103<\/span> holds the <b>TEAL/donor ratio<\/b> (g/g). C-donor / D-donor selector buttons are next to the drum.<\/li>\n<li><b>D-104<\/b> precontact pot (~15 °C, ~10 min): catalyst, TEAL and donor are mixed and activated.<\/li>\n<li><b>R-101<\/b> prepolymeriser (~20 °C, ~20 min): a thin polymer shell is grown on each catalyst particle so it does not break up in the hot main reactor.<\/li>\n<li><b>AI-001<\/b> feed-impurity analyser (H2O, CO, COS in ppm).<\/li>\n<\/ul>\n<div class=\"note\">Anything you change in Area 100 reaches the reactor only after precontact + prepoly + reactor residence time — roughly <b>1 hour<\/b> for the full effect. Plan ahead.<\/div>\n\n<h3>4.2 Area 200 — Multizone circulating reactor R-211 <a href=\"mzcr.html\">(open page)<\/a><\/h3>\n<ul>\n<li><b>Riser<\/b> and <b>downer<\/b> joined at the top by the separator and at the bottom by a leg with the solids circulation hand station <span class=\"tg\">HIC-213<\/span>.<\/li>\n<li><b>K-211<\/b> cycle-gas compressor takes gas from the top separator, through cooler <b>E-211<\/b>, back to the riser bottom. K-211 keeps the riser fluidised — <b>if K-211 stops, the reactor cannot run<\/b>.<\/li>\n<li><b>E-211<\/b> cooling water (pump <b>P-701<\/b>) removes the heat of reaction. <span class=\"tg\">TIC-211<\/span> controls reactor temperature by opening the CW valve.<\/li>\n<li><b>E-212<\/b> start-up heater (LP steam, 0–4 MW) warms the cycle gas when there is little or no reaction: at start-up, shutdown and hot standby. <span class=\"tg\">TIC-212<\/span> throttles its steam valve TCV-212. Run it 2 °C below TIC-211 so heating and cooling never work against each other. The temperature loops act on PV changes for P (no output kick when you change the SP).<\/li>\n<li>Feeds into the cycle gas: fresh propylene <span class=\"tg\">FIC-201<\/span>, pressure make-up <span class=\"tg\">PIC-211<\/span>, hydrogen <span class=\"tg\">AIC-211<\/span> (controlled on riser H2 from the on-line GC), ethylene <span class=\"tg\">FIC-203<\/span> (RACO only).<\/li>\n<li><b>Barrier<\/b> liquid propylene into the downer stripping zone: <span class=\"tg\">FIC-212<\/span>. More barrier → less H2 in the downer (AI-212) → bigger MFR difference between zones → higher PI.<\/li>\n<li><span class=\"tg\">PIC-211<\/span> is <b>split range<\/b>: OP 0–30 % opens a vent to D-301; OP 30–100 % opens propylene make-up.<\/li>\n<li><b>XV-901 CO kill<\/b> panel: ARM → INJECT → RESET (purge). Injecting CO stops polymerisation in seconds.<\/li>\n<li>Key indicators: dew-point margin (propylene vapour pressure minus reactor pressure), heat of reaction vs E-211 duty, riser/downer MFR, fouling index, stickiness margin.<\/li>\n<\/ul>\n\n<h3>4.3 Area 300 — HP flash and GPR routing <a href=\"flash.html\">(open page)<\/a><\/h3>\n<ul>\n<li>Polymer and gas leave R-211 through a steam-jacketed flash line into <b>D-301<\/b> (~18 barg). <span class=\"tg\">PIC-301<\/span> controls D-301 pressure by sending gas to condenser E-301; condensed propylene is recycled to R-211.<\/li>\n<li>Selector <b>HS-302<\/b>: <b>IN SERVICE<\/b> sends powder to the gas-phase reactor R-401 (HECO). <b>BYPASS<\/b> sends powder straight to the steamer (HOMO, RACO).<\/li>\n<\/ul>\n\n<h3>4.4 Area 400 — Gas-phase reactor R-401 (HECO only) <a href=\"gpr.html\">(open page)<\/a><\/h3>\n<ul>\n<li>Fluidised-bed reactor; cycle-gas compressor <b>K-401<\/b> and cooler <b>E-401<\/b>.<\/li>\n<li>Rubber (EPR) is made inside the homopolymer particles from R-211.<\/li>\n<li>Controls: <span class=\"tg\">TIC-401<\/span> temperature, <span class=\"tg\">PIC-401<\/span> pressure (C3 make-up), <span class=\"tg\">AIC-401<\/span> gas ratio C2/(C2+C3) (sets rubber composition and rate), <span class=\"tg\">AIC-402<\/span> H2/C2 ratio (sets rubber MFR), <span class=\"tg\">LIC-401<\/span> bed level → discharge valve LV-401 (sets residence time).<\/li>\n<li>Chunk / sheeting index rises with rubber &gt; 25 %, temperature &gt; 85 °C, or loss of fluidisation (K-401 stopped).<\/li>\n<\/ul>\n\n<h3>4.5 Area 500 — Finishing and silo <a href=\"finishing.html\">(open page)<\/a><\/h3>\n<ul>\n<li><b>D-501<\/b> steamer/dryer: steam kills remaining catalyst and strips monomer; nitrogen dries the powder. <b>Steam must be ON<\/b> — otherwise product is off-spec (odour / volatiles).<\/li>\n<li><b>D-601<\/b> powder silo (400 t). <span class=\"tg\">LIC-601<\/span> controls silo level by adjusting the extruder rate.<\/li>\n<li><b>EX-601<\/b> extruder/pelletiser with additive dosing: antioxidant (AO), acid scavenger (AS), nucleator/clarifier (NUC), antistatic (AST), slip. Additives must be within ±10 % of the grade recipe.<\/li>\n<\/ul>\n\n<h3>4.5b Area 600 — Additives, extrusion and pelletizing <a href=\"extrusion.html\">(open page)<\/a><\/h3>\n<ol>\n<li><b>Feed:<\/b> powder from silo D-601 enters feed hopper H-600, then the extruder feed throat.<\/li>\n<li><b>Additives:<\/b> five additive hoppers (H-601 antioxidant, H-602 acid scavenger, H-603 nucleator/clarifier, H-604 antistatic, H-605 slip) each have a <b>loss-in-weight feeder<\/b> (WF-601 … WF-605). The feeder doses in proportion to the powder rate:\n<div style=\"margin:4px 0 2px\"><b>feed (kg/h) = dose (ppm) × extruder rate (t/h) ÷ 1000<\/b><\/div>\nFor example, 1000 ppm AO at 30 t/h = 30 kg/h. Hopper levels fall and are refilled at 25 %. Set the doses in the table on the page; they must be within ±10 % of the recipe.<\/li>\n<li><b>Extruder EX-601:<\/b> main drive M-601 and gearbox. Six barrel zones Z1–Z6 (TI-611 … TI-616, set 180 → 235 °C) are heated by <b>hot oil<\/b> from heater H-650 (supply ≈ 262 °C), circulated by pump P-651. Typical readings at design rate: screw ≈ 230 rpm, motor ≈ 7 MW, specific energy ≈ 0.24 kWh/kg, melt ≈ 232 °C.<\/li>\n<li><b>Melt pump MP-601<\/b> builds steady pressure, then <b>screen changer SC-601<\/b> filters gels and dirt. Its ΔP (PDI-622) rises from ≈ 22 to ≈ 40 bar as the screen fouls, and the screen is changed every 24 h.<\/li>\n<li><b>Die and pelletizer:<\/b> the heated die plate feeds the <b>underwater pelletizer UWP-601<\/b> (cutter motor M-602, ≈ 2500 rpm). Die pressure PI-621 is about 125 bar at design rate.<\/li>\n<li><b>Pellet water and drying:<\/b> pellets and tempered water (≈ 60 °C, TI-661) flow to <b>spin dryer D-662<\/b>. The water returns through tank TK-660, pump P-661 and cooler E-661. The dried pellets pass <b>screen S-663<\/b> to the blending silos and bagging.<\/li>\n<\/ol>\n<p class=\"hint\">The extrusion readings are training correlations driven by extruder rate, grade MFR and additive doses. They are shown for understanding and are not separately controlled.<\/p>\n\n<h3>4.6 Area 900 — Flare, blowdown and utilities <a href=\"utilities.html\">(open page)<\/a><\/h3>\n<ul>\n<li><b>Relief valves.<\/b> These three are live. They open by themselves at set pressure and relieve gas to the flare; they cannot be operated from the DCS. Click one to see pressure, set point, flow and number of lifts.\n<ul>\n<li><span class=\"tg\">PSV-211<\/span> on R-211: set <b>34 barg<\/b>, reseats at 31.<\/li>\n<li><span class=\"tg\">PSV-301<\/span> on D-301: set <b>24 barg<\/b>, reseats at 21.5.<\/li>\n<li><span class=\"tg\">PSV-401<\/span> on R-401: set <b>20 barg<\/b>, reseats at 18.<\/li>\n<\/ul><\/li>\n<li><b>Display-only devices<\/b> (not simulated yet): PSV-102 (TEAL drum), PSV-212 (E-211 thermal relief), PSV-501 (steamer, to atmosphere), PSV-701 (CW header), PRV-801 (LP steam reducing valve), PRV-802 (nitrogen reducing valve) and BDV-211 (R-211 emergency blowdown valve, fail-open).<\/li>\n<li><b>Flare system.<\/b> All relief and blowdown lines join the N₂-purged <b>flare header<\/b>. The gas passes the <b>D-901 knock-out drum<\/b>, which catches liquid, and goes to the <b>FL-901 flare stack<\/b>. Normal load is the 0.3 t/h purge, which gives a pilot flame only.<\/li>\n<li><b>Trip flaring.<\/b> A trip sends gas to the flare as a burst that dies away over ≈ 5 min:\n<ul>\n<li>K-211 trip: +10 t/h.<\/li>\n<li>K-401 trip: +6 t/h.<\/li>\n<li>P-701 trip: +3 t/h.<\/li>\n<li>CO kill (reactor trip): +15 t/h.<\/li>\n<\/ul>\nPSV relief adds on top. Trips add up, so a reactor trip plus a compressor trip gives a much bigger fire.<\/li>\n<\/ul>\n<table class=\"t\">\n<tr><th class=\"l\">Flare load<\/th><th class=\"l\">Flare status<\/th><th class=\"l\">What you see and hear<\/th><\/tr>\n<tr><td class=\"l\">≤ 1 t/h<\/td><td class=\"l\">PILOT ONLY<\/td><td class=\"l\">Small yellow pilot flame, silent<\/td><\/tr>\n<tr><td class=\"l\">1–5 t/h<\/td><td class=\"l\">SMALL FLARE<\/td><td class=\"l\">Larger orange flame, quiet roar<\/td><\/tr>\n<tr><td class=\"l\">5–15 t/h<\/td><td class=\"l\">FLARING (P2 alarm &gt; 5 t/h)<\/td><td class=\"l\">Tall flame, clear roar<\/td><\/tr>\n<tr><td class=\"l\">15–30 t/h<\/td><td class=\"l\">HEAVY FLARING<\/td><td class=\"l\">Very large flame with smoke, loud deep roar<\/td><\/tr>\n<tr><td class=\"l\">&gt; 30 t/h<\/td><td class=\"l\">MAJOR FLARING<\/td><td class=\"l\">Deep red-orange fire with smoke, full roar (design capacity 60 t/h)<\/td><\/tr>\n<\/table>\n<p><b>Utility headers<\/b> (information only, except P-701):<\/p>\n<ul>\n<li><b>Cooling water:<\/b> from CT-701, pumped by P-701, to E-211, E-401, E-301 and the pellet-water cooler.<\/li>\n<li><b>LP steam (4 barg):<\/b> to E-212, D-501, flash-line tracing and smokeless flaring.<\/li>\n<li><b>Nitrogen (7 barg):<\/b> to the D-501 dryer, flare purge, reactor blanketing and drum padding.<\/li>\n<li><b>Instrument air (6.5 barg):<\/b> to all control valves, XV-901 and BDV-211.<\/li>\n<\/ul>\n<div class=\"note\"><b>Process noise.<\/b> Like a real plant, the simulator is never perfectly steady. Slow random drifts act on catalyst activity, cooling-water temperature, feed vaporisation, hydrogen uptake and the reactor gas balance. Cooling water also follows a day/night cycle of ±0.8 °C, and every transmitter has a little measurement jitter. Expect these normal ranges:\n<ul>\n<li>R-211 temperature: about ±0.1 °C.<\/li>\n<li>Pressure: about ±0.1 bar.<\/li>\n<li>Production: about ±1 t/h.<\/li>\n<li>TIC-211 output: about ±3 %.<\/li>\n<\/ul>\nThis is what the controllers are for. The instructor can switch it off (Instructor page, <i>Process noise<\/i>).<\/div>\n\n<!-- ============================================================ -->\n<h2 id=\"s5\">5. Normal operating conditions<\/h2>\n<table class=\"t\">\n<tr><th class=\"l\">Tag<\/th><th class=\"l\">Description<\/th><th>Normal<\/th><th class=\"l\">Notes<\/th><\/tr>\n<tr><td class=\"l\">FIC-101<\/td><td class=\"l\">Catalyst feed<\/td><td>≈ 0.59 kg/h<\/td><td class=\"l\">Gives ~30 t/h at ~50 t PP per kg catalyst<\/td><\/tr>\n<tr><td class=\"l\">FFIC-102<\/td><td class=\"l\">TEAL / catalyst<\/td><td>5 g/g<\/td><td class=\"l\">Below 3 g/g → alarm; activity drops<\/td><\/tr>\n<tr><td class=\"l\">FFIC-103<\/td><td class=\"l\">TEAL / donor<\/td><td>10 g/g (BOPP 50)<\/td><td class=\"l\">Higher ratio → less donor → higher XS<\/td><\/tr>\n<tr><td class=\"l\">TIC-211<\/td><td class=\"l\">MZCR temperature<\/td><td>80 °C (RACO 75)<\/td><td class=\"l\">OP ≈ 30–40 % at 30 t/h, PV within ± 0.2 °C of SP<\/td><\/tr>\n<tr><td class=\"l\">TIC-212<\/td><td class=\"l\">Heater E-212 (standby)<\/td><td>78 °C (RACO 73)<\/td><td class=\"l\">Shows <b>OFF · standby<\/b>, OP 0 %. It reads the same R-211 temperature as TIC-211, so its PV is 2 °C above its SP. That is normal: the heater is not needed while the reaction runs.<\/td><\/tr>\n<tr><td class=\"l\">PIC-211<\/td><td class=\"l\">MZCR pressure<\/td><td>28 barg (RACO 27)<\/td><td class=\"l\">OP ≈ 50–75 % (make-up side)<\/td><\/tr>\n<tr><td class=\"l\">AIC-211<\/td><td class=\"l\">Riser H2<\/td><td>1–6 mol%<\/td><td class=\"l\">Grade dependent (see section 6)<\/td><\/tr>\n<tr><td class=\"l\">FIC-212<\/td><td class=\"l\">Barrier flow<\/td><td>6 t/h (fibre 1.5)<\/td><td class=\"l\">Barrier efficiency ≈ 90 % at 6 t/h<\/td><\/tr>\n<tr><td class=\"l\">HIC-213<\/td><td class=\"l\">Solids circulation<\/td><td>55 %<\/td><td class=\"l\">&lt; 30 % → fouling; &gt; 60 % → barrier less effective<\/td><\/tr>\n<tr><td class=\"l\">FIC-201<\/td><td class=\"l\">Fresh propylene<\/td><td>22 t/h<\/td><td class=\"l\"><\/td><\/tr>\n<tr><td class=\"l\">PIC-301<\/td><td class=\"l\">Flash D-301 pressure<\/td><td>18 barg<\/td><td class=\"l\"><\/td><\/tr>\n<tr><td class=\"l\">TIC-401 / PIC-401<\/td><td class=\"l\">GPR temperature / pressure<\/td><td>75 °C / 14 barg<\/td><td class=\"l\">HECO only<\/td><\/tr>\n<tr><td class=\"l\">AIC-401 / AIC-402<\/td><td class=\"l\">C2/(C2+C3) / H2/C2<\/td><td>0.40 / 0.05<\/td><td class=\"l\">HECO only<\/td><\/tr>\n<tr><td class=\"l\">LIC-401<\/td><td class=\"l\">GPR bed level<\/td><td>60 %<\/td><td class=\"l\">≈ 36 t bed<\/td><\/tr>\n<tr><td class=\"l\">LIC-601<\/td><td class=\"l\">Silo level<\/td><td>50 %<\/td><td class=\"l\">Extruder ≈ 30 t/h (HECO 36 t/h)<\/td><\/tr>\n<tr><td class=\"l\">—<\/td><td class=\"l\">Dew-point margin<\/td><td>≈ 9 bar<\/td><td class=\"l\">Must stay &gt; 3 bar<\/td><\/tr>\n<\/table>\n\n<!-- ============================================================ -->\n<h2 id=\"s6\">6. Product grades<\/h2>\n<table class=\"t\">\n<tr><th class=\"l\">Grade<\/th><th class=\"l\">Family<\/th><th>Donor<\/th><th>Riser H2 mol%<\/th><th>Barrier t/h<\/th><th>T °C<\/th><th>GPR<\/th><th class=\"l\">Specification<\/th><\/tr>\n<tr><td class=\"l\"><b>H-RAFFIA<\/b><\/td><td class=\"l\">HOMO<\/td><td>C<\/td><td>≈ 1.0<\/td><td>6<\/td><td>80<\/td><td>bypass<\/td><td class=\"l\">MFR 3.0–4.0 · XS ≤ 4.0<\/td><\/tr>\n<tr><td class=\"l\"><b>H-INJ<\/b><\/td><td class=\"l\">HOMO<\/td><td>C<\/td><td>≈ 3.0<\/td><td>6<\/td><td>80<\/td><td>bypass<\/td><td class=\"l\">MFR 10.5–13.5 · XS ≤ 4.0<\/td><\/tr>\n<tr><td class=\"l\"><b>H-FIBER<\/b><\/td><td class=\"l\">HOMO<\/td><td>C<\/td><td>≈ 2.4<\/td><td>1.5<\/td><td>80<\/td><td>bypass<\/td><td class=\"l\">MFR 22–28 · XS ≤ 4.0 · PI ≤ 4.6<\/td><\/tr>\n<tr><td class=\"l\"><b>H-BOPP<\/b><\/td><td class=\"l\">HOMO<\/td><td>D<\/td><td>≈ 1.0<\/td><td>6<\/td><td>80<\/td><td>bypass<\/td><td class=\"l\">MFR 2.6–3.4 · XS 3.5–5.5 · PI ≥ 5.0<\/td><\/tr>\n<tr><td class=\"l\"><b>R-7<\/b><\/td><td class=\"l\">RACO<\/td><td>C<\/td><td>≈ 1.7<\/td><td>6<\/td><td>75<\/td><td>bypass<\/td><td class=\"l\">MFR 6–8 · C2 3.0–4.0 wt% (ethylene ≈ 1170 kg/h)<\/td><\/tr>\n<tr><td class=\"l\"><b>I-12<\/b><\/td><td class=\"l\">HECO<\/td><td>C<\/td><td>≈ 3.8<\/td><td>6<\/td><td>80<\/td><td>SERVICE<\/td><td class=\"l\">MFR 10.5–13.5 · rubber 15–19 % · Izod ≥ 8 kJ/m²<\/td><\/tr>\n<\/table>\n<p>In EASY mode the exact recipe values (solved from the model) are also on the <a href=\"quality.html\">Quality &amp; Grades<\/a> page, with rows highlighted in amber where they differ from the current setpoints. In HARD mode use the tables in this manual.<\/p>\n<h3>Full recipe setpoints (final, at design rate)<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Grade<\/th><th>FIC-101 kg/h<\/th><th>FFIC-102 g/g<\/th><th>FFIC-103 g/g<\/th><th>TIC-211 °C<\/th><th>PIC-211 barg<\/th><th>AIC-211 mol%<\/th><th>FIC-212 t/h<\/th><th>HIC-213 %<\/th><th>FIC-203 kg/h<\/th><th>FIC-201 t/h<\/th><\/tr>\n<tr><td class=\"l\">H-RAFFIA<\/td><td>0.62<\/td><td>5<\/td><td>10<\/td><td>80<\/td><td>28<\/td><td>0.97<\/td><td>6<\/td><td>55<\/td><td>0<\/td><td>22<\/td><\/tr>\n<tr><td class=\"l\">H-INJ<\/td><td>0.59<\/td><td>5<\/td><td>10<\/td><td>80<\/td><td>28<\/td><td>2.98<\/td><td>6<\/td><td>55<\/td><td>0<\/td><td>22<\/td><\/tr>\n<tr><td class=\"l\">H-FIBER<\/td><td>0.60<\/td><td>5<\/td><td>10<\/td><td>80<\/td><td>28<\/td><td>2.36<\/td><td>1.5<\/td><td>55<\/td><td>0<\/td><td>22<\/td><\/tr>\n<tr><td class=\"l\">H-BOPP<\/td><td>0.50<\/td><td>5<\/td><td>50<\/td><td>80<\/td><td>28<\/td><td>1.04<\/td><td>6<\/td><td>55<\/td><td>0<\/td><td>22<\/td><\/tr>\n<tr><td class=\"l\">R-7<\/td><td>0.70<\/td><td>5<\/td><td>10<\/td><td>75<\/td><td>27<\/td><td>1.75<\/td><td>6<\/td><td>55<\/td><td>1167<\/td><td>22<\/td><\/tr>\n<tr><td class=\"l\">I-12<\/td><td>0.58<\/td><td>5<\/td><td>10<\/td><td>80<\/td><td>28<\/td><td>3.76<\/td><td>6<\/td><td>55<\/td><td>0<\/td><td>22<\/td><\/tr>\n<\/table>\n<p>I-12 also needs the GPR in service with TIC-401 75 °C, PIC-401 14 barg, AIC-401 0.40, AIC-402 0.05 and LIC-401 60 %. Common to all grades: PIC-301 18 barg, LIC-601 50 %.<\/p>\n<h3>Additive package (EX-601, ppm)<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Grade<\/th><th>Antioxidant AO<\/th><th>Acid scavenger AS<\/th><th>Nucleator / clarifier NUC<\/th><th>Antistatic AST<\/th><th>Slip SLIP<\/th><\/tr>\n<tr><td class=\"l\">H-RAFFIA<\/td><td>1500<\/td><td>500<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td class=\"l\">H-INJ<\/td><td>1000<\/td><td>500<\/td><td>1000<\/td><td>500<\/td><td>0<\/td><\/tr>\n<tr><td class=\"l\">H-FIBER<\/td><td>800<\/td><td>400<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td class=\"l\">H-BOPP<\/td><td>1200<\/td><td>400<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td class=\"l\">R-7<\/td><td>1000<\/td><td>500<\/td><td>2000<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td class=\"l\">I-12<\/td><td>1500<\/td><td>800<\/td><td>1000<\/td><td>500<\/td><td>1000<\/td><\/tr>\n<\/table>\n<p class=\"hint\">Pellets are off-spec if any additive is more than ±10 % (minimum ±50 ppm) from this table.<\/p>\n<h3>6.1 Property levers — what moves what<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">To change…<\/th><th class=\"l\">Use<\/th><th class=\"l\">Effect / side effects<\/th><\/tr>\n<tr><td class=\"l\">MFR (melt flow)<\/td><td class=\"l\">AIC-211 riser H2<\/td><td class=\"l\">More H2 → higher MFR. Response time ~ 5 min for gas, ~ 15 min for pellets.<\/td><\/tr>\n<tr><td class=\"l\">PI (MWD breadth)<\/td><td class=\"l\">FIC-212 barrier; donor type<\/td><td class=\"l\">More barrier → bigger riser/downer difference → higher PI. Re-adjust H2 to hold MFR.<\/td><\/tr>\n<tr><td class=\"l\">XS (solubles)<\/td><td class=\"l\">FFIC-103 TEAL/donor; temperature; ethylene<\/td><td class=\"l\">Less donor or lower T → higher XS. Ethylene raises XS strongly.<\/td><\/tr>\n<tr><td class=\"l\">C2 content (RACO)<\/td><td class=\"l\">FIC-203 ethylene<\/td><td class=\"l\">≈ 5 °C melting-point drop per wt% C2. High XS + high T → sticky powder → fouling.<\/td><\/tr>\n<tr><td class=\"l\">Rubber % (HECO)<\/td><td class=\"l\">AIC-401 gas ratio, LIC-401 level, PIC-401 pressure<\/td><td class=\"l\">More C2, higher level or pressure → more rubber → higher Izod, lower stiffness.<\/td><\/tr>\n<tr><td class=\"l\">Rubber MFR<\/td><td class=\"l\">AIC-402 H2/C2<\/td><td class=\"l\">Affects final HECO MFR through log-blending with the matrix.<\/td><\/tr>\n<tr><td class=\"l\">Production rate<\/td><td class=\"l\">FIC-101 catalyst<\/td><td class=\"l\">Proportional, but lagged ~1 h. Check cooling capacity (TIC-211 OP) first.<\/td><\/tr>\n<\/table>\n\n<!-- ============================================================ -->\n<h2 id=\"s7\">7. Operating procedures<\/h2>\n<h3>7.1 Shift start / routine checks<\/h3>\n<ol>\n<li>Overview: all areas grey, no blinking dots on page tabs. Acknowledge and read any standing alarms.<\/li>\n<li>Header shows the expected target grade and <b>ON-SPEC<\/b>.<\/li>\n<li>MZCR: TIC-211 at SP, OP 30–45 % (spare cooling!), dew margin &gt; 3 bar, fouling index near 0.<\/li>\n<li>Catalyst: FIC-101, FFIC-102, FFIC-103 in AUTO at recipe SPs. Mileage ~ 50 t/kg. AI-001 poisons ≈ 0.<\/li>\n<li>Silo between 30–70 %, extruder running, steam ON, additives match recipe.<\/li>\n<li>Quality page: last lab results inside spec.<\/li>\n<\/ol>\n<h3>7.2 Changing production rate<\/h3>\n<ol>\n<li>Check TIC-211 OP has margin (a +10 % rate needs roughly +4 % cooling OP).<\/li>\n<li>Change FIC-101 in steps of ≤ 5 %. Keep TEAL and donor in ratio control (they follow automatically).<\/li>\n<li>Watch production trend for ~1 h; adjust AIC-211 if MFR drifts.<\/li>\n<\/ol>\n<h3>7.3 Grade change — general method<\/h3>\n<ol>\n<li>Quality &amp; Grades page → select the new grade → <b>Set as target<\/b>. The amber rows show what must change.<\/li>\n<li>Either press <b>Apply recipe SPs<\/b> (all at once) or change SPs one by one in a planned order (preferred for difficult transitions).<\/li>\n<li>Watch instantaneous properties (KPI panel) — pellets follow ~15 min later.<\/li>\n<li>Off-spec tonnes accumulate during the transition; a good change minimises them.<\/li>\n<\/ol>\n<h3>7.4 HOMO → RACO (e.g. H-INJ → R-7)<\/h3>\n<ol>\n<li>Set target R-7.<\/li>\n<li><b>First lower TIC-211 SP to 75 °C<\/b> (RACO powder is sticky at high T).<\/li>\n<li>Lower PIC-211 SP to 27 barg, reduce AIC-211 SP to the recipe (~1.7 mol%).<\/li>\n<li>Bring FIC-203 ethylene up to ≈ 1170 kg/h gradually (e.g. in 3 steps over 30 min).<\/li>\n<li>Watch \"Stickiness margin\" on the MZCR page — it must stay positive. If it goes negative, cut ethylene or lower temperature.<\/li>\n<li>Change nucleator/clarifier on the Finishing page to recipe.<\/li>\n<\/ol>\n<h3>7.5 GPR start-up — RACO/HOMO → HECO (e.g. R-7 → I-12)<\/h3>\n<ol>\n<li>Set target I-12. Cut ethylene to the MZCR (FIC-203 → 0), restore TIC-211 to 80 °C.<\/li>\n<li>Flash page (or GPR page): HS-302 → <b>IN SERVICE<\/b>.<\/li>\n<li>GPR page: start <b>K-401<\/b>; check TIC-401, PIC-401 in AUTO.<\/li>\n<li>Put LIC-401 in AUTO at 60 %. Set AIC-401 = 0.40, AIC-402 = 0.05.<\/li>\n<li>Raise AIC-211 so the matrix MFR is ~15 (recipe) — final MFR is lower once rubber is added.<\/li>\n<li>Rubber % rises over ~45 min. Adjust AIC-401 / LIC-401 to land rubber at 15–19 % and Izod ≥ 8.<\/li>\n<li>Set additive package to I-12 recipe.<\/li>\n<\/ol>\n<h3>7.6 HECO → HOMO with donor change (e.g. I-12 → H-BOPP)<\/h3>\n<ol>\n<li>Set target H-BOPP. HS-302 → <b>BYPASS<\/b> (GPR controllers hold; LIC-401 goes to MAN 0 %).<\/li>\n<li>Catalyst page: switch donor to <b>D-donor<\/b>; set FFIC-103 to 50 g/g.<\/li>\n<li>Lower AIC-211 to ≈ 1 mol%.<\/li>\n<li>The donor change takes about an hour to fully reach the reactor. PI rises and XS rises slowly — be patient; do not chase the transition with H2.<\/li>\n<\/ol>\n<h3>7.7 Start-up and shutdown<\/h3>\n<p>Full cold start-up, controlled shutdown, hot standby, emergency shutdown and restart are all in <b>chapter 8<\/b>.<\/p>\n\n<!-- ============================================================ -->\n<h2 id=\"s8su\">8. Plant start-up and shutdown — complete procedures<\/h2>\n<h3>8.1 Why start-up and shutdown deserve their own chapter<\/h3>\n<p>At steady state the controllers do most of the work. During start-up and shutdown nothing is steady: temperatures, pressures, flows and compositions all move at once, many controllers are in MAN, alarms are expected, and equipment runs well away from its design point. That is why, in the real process industry, a <b>disproportionate share of process-safety incidents happens during these transient operations<\/b>. It is also why operators and engineers follow written, step-by-step procedures, and why interviewers like to ask \"what would you check before you start this up?\"<\/p>\n<p>This chapter collects every start-up and shutdown procedure of the simulated plant in one place, explains the engineering reason behind each step, and lists the mistakes the simulator will punish. Run each procedure from the session menu (☰ SESSION). The Session card ticks the steps off as you go.<\/p>\n\n<h3>8.2 The big picture — phases and plant states<\/h3>\n<svg class=\"fig\" viewBox=\"0 0 1000 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Arial, sans-serif\" role=\"img\" aria-label=\"Start-up and shutdown phases\">\n<style>.ph{font-size:12px;font-weight:700;fill:#fff}.ps{font-size:10.5px;fill:#fff}.hd{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#33373b}<\/style>\n<text class=\"hd\" x=\"10\" y=\"18\">START-UP · cold plant → on-spec pellets · ≈ 5–6 h sim time (steps 1–14)<\/text>\n<g transform=\"translate(10,28)\">\n<path d=\"M0,0 h124 l14,34 l-14,34 h-124 z\" fill=\"#6c7177\"/><text class=\"ph\" x=\"10\" y=\"24\">A · Utilities<\/text><text class=\"ps\" x=\"10\" y=\"41\">steps 1–3<\/text><text class=\"ps\" x=\"10\" y=\"56\">P-701 · K-211 · HIC-213<\/text>\n<path d=\"M140,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#c0532b\"/><text class=\"ph\" x=\"158\" y=\"24\">B · Heat-up<\/text><text class=\"ps\" x=\"158\" y=\"41\">step 4<\/text><text class=\"ps\" x=\"158\" y=\"56\">E-212 → R-211 ≥ 72 °C<\/text>\n<path d=\"M280,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#2f6fb3\"/><text class=\"ph\" x=\"298\" y=\"24\">C · Pressurise<\/text><text class=\"ps\" x=\"298\" y=\"41\">steps 5–6<\/text><text class=\"ps\" x=\"298\" y=\"56\">PIC-211 · PIC-301<\/text>\n<path d=\"M420,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#7b5ea7\"/><text class=\"ph\" x=\"438\" y=\"24\">D · Chemicals<\/text><text class=\"ps\" x=\"438\" y=\"41\">steps 7–9<\/text><text class=\"ps\" x=\"438\" y=\"56\">TEAL · donor · C₃ · H₂<\/text>\n<path d=\"M560,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#d0782a\"/><text class=\"ph\" x=\"578\" y=\"24\">E · Light-off<\/text><text class=\"ps\" x=\"578\" y=\"41\">steps 10–11<\/text><text class=\"ps\" x=\"578\" y=\"56\">catalyst · heater off<\/text>\n<path d=\"M700,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#3a8a3f\"/><text class=\"ph\" x=\"718\" y=\"24\">F · Finishing<\/text><text class=\"ps\" x=\"718\" y=\"41\">step 12<\/text><text class=\"ps\" x=\"718\" y=\"56\">steam · EX-601<\/text>\n<path d=\"M840,0 h124 l14,34 l-14,34 h-124 l14,-34 z\" fill=\"#1f8a8a\"/><text class=\"ph\" x=\"858\" y=\"24\">G · Rate &amp; spec<\/text><text class=\"ps\" x=\"858\" y=\"41\">steps 13–14<\/text><text class=\"ps\" x=\"858\" y=\"56\">≥ 27 t/h · ON-SPEC<\/text>\n<\/g>\n<text class=\"hd\" x=\"10\" y=\"138\">CONTROLLED SHUTDOWN · running plant → stopped and depressurised · ≈ 5½ h sim time (steps 1–13)<\/text>\n<g transform=\"translate(10,148)\">\n<path d=\"M0,0 h182 l14,34 l-14,34 h-182 z\" fill=\"#d0782a\"/><text class=\"ph\" x=\"10\" y=\"24\">A · Stop the reaction<\/text><text class=\"ps\" x=\"10\" y=\"41\">steps 1–2<\/text><text class=\"ps\" x=\"10\" y=\"56\">catalyst and comonomer off<\/text>\n<path d=\"M196,0 h182 l14,34 l-14,34 h-182 l14,-34 z\" fill=\"#c0532b\"/><text class=\"ph\" x=\"214\" y=\"24\">B · Feed down, hold T<\/text><text class=\"ps\" x=\"214\" y=\"41\">steps 3–5<\/text><text class=\"ps\" x=\"214\" y=\"56\">FIC-201 with rate · E-212 on<\/text>\n<path d=\"M392,0 h182 l14,34 l-14,34 h-182 l14,-34 z\" fill=\"#7b5ea7\"/><text class=\"ph\" x=\"410\" y=\"24\">C · Isolate<\/text><text class=\"ps\" x=\"410\" y=\"41\">steps 6–9<\/text><text class=\"ps\" x=\"410\" y=\"56\">GPR · H₂ · TEAL/donor · feeds<\/text>\n<path d=\"M588,0 h182 l14,34 l-14,34 h-182 l14,-34 z\" fill=\"#3a8a3f\"/><text class=\"ph\" x=\"606\" y=\"24\">D · Empty finishing<\/text><text class=\"ps\" x=\"606\" y=\"41\">steps 10–11<\/text><text class=\"ps\" x=\"606\" y=\"56\">silo ≤ 10 % · EX-601 · steam<\/text>\n<path d=\"M784,0 h182 l14,34 l-14,34 h-182 l14,-34 z\" fill=\"#6c7177\"/><text class=\"ph\" x=\"802\" y=\"24\">E · Depressurise, stop<\/text><text class=\"ps\" x=\"802\" y=\"41\">steps 12–13<\/text><text class=\"ps\" x=\"802\" y=\"56\">vent · E-212 · K-211 · P-701<\/text>\n<\/g>\n<\/svg>\n<div class=\"cap\">Figure 8.1 — Start-up and shutdown phases. Each phase must be finished before the next one begins. The step numbers match the Session-card tracker.<\/div>\n\n<svg class=\"fig\" viewBox=\"0 0 1000 235\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Arial, sans-serif\" role=\"img\" aria-label=\"Plant states\">\n<defs><marker id=\"sA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#33373b\"/><\/marker>\n<marker id=\"sR\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c62828\"/><\/marker><\/defs>\n<style>.bt{font-size:14px;font-weight:700}.bs{font-size:10.5px;fill:#3d4248}.lb{font-size:11px;fill:#33373b}.ln{fill:none;stroke:#33373b;stroke-width:2}<\/style>\n<rect x=\"40\" y=\"55\" width=\"180\" height=\"70\" rx=\"8\" fill=\"#e6e7e8\" stroke=\"#6c7177\" stroke-width=\"2\"/>\n<text class=\"bt\" x=\"130\" y=\"82\" text-anchor=\"middle\">COLD<\/text><text class=\"bs\" x=\"130\" y=\"99\" text-anchor=\"middle\">all stopped · 25 °C · 1 barg<\/text><text class=\"bs\" x=\"130\" y=\"113\" text-anchor=\"middle\">reactor empty<\/text>\n<rect x=\"410\" y=\"55\" width=\"180\" height=\"70\" rx=\"8\" fill=\"#fbe3d6\" stroke=\"#c0532b\" stroke-width=\"2\"/>\n<text class=\"bt\" x=\"500\" y=\"82\" text-anchor=\"middle\">HOT STANDBY<\/text><text class=\"bs\" x=\"500\" y=\"99\" text-anchor=\"middle\">warm · pressurised · K-211 on<\/text><text class=\"bs\" x=\"500\" y=\"113\" text-anchor=\"middle\">no catalyst, no production<\/text>\n<rect x=\"780\" y=\"55\" width=\"180\" height=\"70\" rx=\"8\" fill=\"#e1f2e2\" stroke=\"#3a8a3f\" stroke-width=\"2\"/>\n<text class=\"bt\" x=\"870\" y=\"82\" text-anchor=\"middle\">RUNNING<\/text><text class=\"bs\" x=\"870\" y=\"99\" text-anchor=\"middle\">~30 t/h · controllers AUTO<\/text><text class=\"bs\" x=\"870\" y=\"113\" text-anchor=\"middle\">pellets on-spec<\/text>\n<rect x=\"410\" y=\"165\" width=\"180\" height=\"58\" rx=\"8\" fill=\"#fbdcdc\" stroke=\"#c62828\" stroke-width=\"2\"/>\n<text class=\"bt\" x=\"500\" y=\"190\" text-anchor=\"middle\" style=\"fill:#c62828\">TRIPPED<\/text><text class=\"bs\" x=\"500\" y=\"207\" text-anchor=\"middle\">CO kill injected · reaction dead<\/text>\n<path class=\"ln\" d=\"M220,72 L408,72\" marker-end=\"url(#sA)\"/><text class=\"lb\" x=\"314\" y=\"64\" text-anchor=\"middle\">start-up steps 1–9<\/text>\n<path class=\"ln\" d=\"M590,72 L778,72\" marker-end=\"url(#sA)\"/><text class=\"lb\" x=\"684\" y=\"64\" text-anchor=\"middle\">start-up steps 10–14<\/text>\n<path class=\"ln\" d=\"M780,110 L592,110\" marker-end=\"url(#sA)\"/><text class=\"lb\" x=\"686\" y=\"126\" text-anchor=\"middle\">shutdown steps 1–9<\/text>\n<path class=\"ln\" d=\"M410,110 L222,110\" marker-end=\"url(#sA)\"/><text class=\"lb\" x=\"316\" y=\"126\" text-anchor=\"middle\">shutdown steps 10–13<\/text>\n<path d=\"M870,125 L870,194 L592,194\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\" marker-end=\"url(#sR)\"/><text class=\"lb\" x=\"740\" y=\"186\" text-anchor=\"middle\" style=\"fill:#c62828\">CO kill (operator or SIS)<\/text>\n<path class=\"ln\" d=\"M470,165 L470,127\" marker-end=\"url(#sA)\"/><text class=\"lb\" x=\"460\" y=\"150\" text-anchor=\"end\">fix cause · RESET → purge<\/text>\n<text class=\"lb\" x=\"30\" y=\"30\" style=\"font-weight:700;letter-spacing:.05em\">PLANT STATES<\/text>\n<\/svg>\n<div class=\"cap\">Figure 8.2 — The four plant states and the procedures that move the plant between them. Hot standby is the \"parking\" state, ready to restart within an hour.<\/div>\n\n<h3>8.3 The physics you need<\/h3>\n<p><b>1 · Dew point: heat before you pressurise.<\/b> The reactor runs as a <i>gas-phase<\/i> fluidised system, so the propylene must stay a vapour. Its vapour pressure depends only on temperature. If the reactor pressure goes above the vapour pressure, propylene condenses: liquid in the riser, wet sticky powder, and liquid slugs reaching K-211. The DCS shows the <b>dew-point margin<\/b> = P<sub>vap<\/sub>(T) − P<sub>reactor<\/sub>. Keep it above 3 bar. Below 0.5 bar the SIS trips K-211.<\/p>\n<table class=\"t\" style=\"max-width:620px\">\n<tr><th>R-211 temperature<\/th><th>Propylene vapour pressure<\/th><th>Highest safe pressure (3 bar margin)<\/th><\/tr>\n<tr><td>25 °C<\/td><td>10.6 barg<\/td><td>7.6 barg<\/td><\/tr>\n<tr><td>40 °C<\/td><td>15.6 barg<\/td><td>12.6 barg<\/td><\/tr>\n<tr><td>50 °C<\/td><td>19.8 barg<\/td><td>16.8 barg<\/td><\/tr>\n<tr><td>60 °C<\/td><td>24.7 barg<\/td><td>21.7 barg<\/td><\/tr>\n<tr><td>70 °C<\/td><td>30.3 barg<\/td><td>27.3 barg<\/td><\/tr>\n<tr><td>75 °C<\/td><td>33.4 barg<\/td><td>30.4 barg<\/td><\/tr>\n<tr><td>80 °C<\/td><td>36.7 barg<\/td><td>33.7 barg<\/td><\/tr>\n<\/table>\n<p class=\"hint\">Simulator correlation: ln P<sub>vap<\/sub>[bar abs] = 10.03 − 2260 / T[K]. So the normal 28 barg needs R-211 at about <b>72 °C or more<\/b>.<\/p>\n<p><b>2 · Heat balance: the heater only starts the reaction.<\/b> The heat of polymerisation is about 2 MJ/kg, so at 30 t/h the reactor releases 30 000 × 2 / 3600 ≈ <b>17 MW<\/b>. The start-up heater E-212 gives only 4 MW. It is enough to warm an empty reactor at ≈ 0.8 °C/min, but once the reaction is running, the cooler E-211 must take the load. Cold liquid feed takes heat too: vaporising and warming fresh propylene removes ≈ 0.12 MW per t/h. With no reaction heat, 28 t/h of feed chills the reactor by about 0.7 °C/min. That is the trap in the shutdown.<\/p>\n<p><b>3 · Residence time: nothing happens instantly.<\/b> Catalyst passes the precontact pot (≈ 10 min) and the prepolymeriser (≈ 20 min), then lives in R-211 for ≈ 36 min. Production after a catalyst change therefore behaves like a chain of first-order lags. The first polymer appears ≈ 30 min after light-off, and the reaction needs 1½–2 h to die away after the catalyst is cut. Be patient, and do not \"chase\" the plant by over-correcting.<\/p>\n<p><b>4 · Mass balance on pressure.<\/b> R-211 pressure rises when more gas comes in than is consumed or vented. PIC-211 can vent only ≈ 12 t/h through its split range (OP 0–30 %). Before light-off the reaction consumes nothing, so keep fresh C₃ + barrier below ≈ 12 t/h, or the pressure will keep climbing.<\/p>\n<p><b>5 · Chemistry: TEAL before catalyst.<\/b> TEAL activates the titanium sites and scavenges water, CO and COS. Catalyst fed without TEAL does almost nothing, and the feed poisons kill it. The donor sets the isotacticity (XS) from the first gram of polymer.<\/p>\n\n<h3>8.4 Full plant start-up from cold<\/h3>\n<p>Start it from the session menu: <b>Full plant start-up (cold)<\/b>, on a HOMO or RACO grade. HECO is reached afterwards by the grade change in 7.5. <b>Initial state:<\/b> all motors stopped, all controllers MAN 0 % (PIC-211 at 30 %, so the vent and make-up are both closed), R-211 empty at 25 °C and 1 barg, no catalyst in the system, silo 10 %, GPR bypassed. Run at 20–60×.<\/p>\n<p><b>Pre-start-up checklist<\/b>: do this before step 1, as an operator would do at a pre-start-up safety review.<\/p>\n<ul class=\"chk\">\n<li>Session card shows <i>Full plant start-up from cold<\/i> and the correct target grade (header chip).<\/li>\n<li>Alarm list read and acknowledged. SIS status <b>NORMAL<\/b> (not bypassed), CO kill <b>NORMAL<\/b>, no SIS catalyst cut.<\/li>\n<li>Catalyst page: correct external donor drum (C or D) for the grade.<\/li>\n<li>Finishing page: additive package matches the grade recipe.<\/li>\n<li>Quality &amp; Grades page: note the recipe SPs you will need (PIC-211, AIC-211, FIC-212, TEAL and donor ratios, catalyst rate, TIC-211).<\/li>\n<li>Instructor page (if you are the trainer): no failures active, no feed poisons.<\/li>\n<\/ul>\n<div class=\"warn\"><b>AUTO alone does nothing on a cold plant.<\/b> In MAN the SP follows the PV, which is 0 on a cold plant. Switching to AUTO then keeps <b>SP = 0<\/b>, so the controller holds zero flow. <b>Every time you put a controller in AUTO, type the SP as well.<\/b> In HARD mode, take every value from the table below. In EASY mode the faceplate also helps: under the SP box an amber <b>Recipe SP<\/b> line shows the value for the target grade, and <b>Use recipe SP<\/b> (or <b>AUTO + recipe SP<\/b>) loads it with one click.<\/div>\n<h3>Start-up setpoints for each grade<\/h3>\n<p>Write these down before you start. <i>Start-up<\/i> values are used first; <i>final<\/i> values are reached in step 13.<\/p>\n<table class=\"t\">\n<tr><th class=\"l\">Controller<\/th><th class=\"l\">What it sets<\/th><th>H-RAFFIA<\/th><th>H-INJ<\/th><th>H-FIBER<\/th><th>H-BOPP<\/th><th>R-7<\/th><th class=\"l\">Used in step<\/th><\/tr>\n<tr><td class=\"l\">HIC-213<\/td><td class=\"l\">Solids circulation OP<\/td><td>55 %<\/td><td>55 %<\/td><td>55 %<\/td><td>55 %<\/td><td>55 %<\/td><td class=\"l\">3<\/td><\/tr>\n<tr><td class=\"l\">TIC-211<\/td><td class=\"l\">MZCR temperature<\/td><td>80 °C<\/td><td>80 °C<\/td><td>80 °C<\/td><td>80 °C<\/td><td>75 °C<\/td><td class=\"l\">10 (MAN 0 % before)<\/td><\/tr>\n<tr><td class=\"l\">TIC-212<\/td><td class=\"l\">Heater E-212 (recipe − 2 °C)<\/td><td>78 °C<\/td><td>78 °C<\/td><td>78 °C<\/td><td>78 °C<\/td><td>73 °C<\/td><td class=\"l\">4 (and shutdown 4)<\/td><\/tr>\n<tr><td class=\"l\">PIC-211<\/td><td class=\"l\">MZCR pressure<\/td><td>28 barg<\/td><td>28 barg<\/td><td>28 barg<\/td><td>28 barg<\/td><td>27 barg<\/td><td class=\"l\">5<\/td><\/tr>\n<tr><td class=\"l\">PIC-301<\/td><td class=\"l\">Flash pressure<\/td><td colspan=\"5\">18 barg<\/td><td class=\"l\">6<\/td><\/tr>\n<tr><td class=\"l\">External donor<\/td><td class=\"l\">Drum selector<\/td><td>C<\/td><td>C<\/td><td>C<\/td><td><b>D<\/b><\/td><td>C<\/td><td class=\"l\">checklist<\/td><\/tr>\n<tr><td class=\"l\">FFIC-102<\/td><td class=\"l\">TEAL / catalyst<\/td><td colspan=\"5\">5 g/g<\/td><td class=\"l\">7<\/td><\/tr>\n<tr><td class=\"l\">FFIC-103<\/td><td class=\"l\">TEAL / donor<\/td><td>10 g/g<\/td><td>10 g/g<\/td><td>10 g/g<\/td><td><b>50 g/g<\/b><\/td><td>10 g/g<\/td><td class=\"l\">7<\/td><\/tr>\n<tr><td class=\"l\">FIC-212<\/td><td class=\"l\">Barrier liquid C₃<\/td><td>6 t/h<\/td><td>6 t/h<\/td><td><b>1.5 t/h<\/b><\/td><td>6 t/h<\/td><td>6 t/h<\/td><td class=\"l\">8<\/td><\/tr>\n<tr><td class=\"l\">FIC-201<\/td><td class=\"l\">Fresh C₃ — start-up / final<\/td><td colspan=\"5\">5 t/h → 22 t/h<\/td><td class=\"l\">8 → 13<\/td><\/tr>\n<tr><td class=\"l\">AIC-211<\/td><td class=\"l\">Riser H₂<\/td><td>0.97 mol%<\/td><td>2.98 mol%<\/td><td>2.36 mol%<\/td><td>1.04 mol%<\/td><td>1.75 mol%<\/td><td class=\"l\">9<\/td><\/tr>\n<tr><td class=\"l\">FIC-101<\/td><td class=\"l\">Catalyst — start-up / final<\/td><td>0.2 → 0.62<\/td><td>0.2 → 0.59<\/td><td>0.2 → 0.60<\/td><td>0.2 → 0.50<\/td><td>0.2 → 0.70<\/td><td class=\"l\">10 → 13 (kg/h)<\/td><\/tr>\n<tr><td class=\"l\">FIC-203<\/td><td class=\"l\">Ethylene (RACO only)<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1167 kg/h<\/td><td class=\"l\">13<\/td><\/tr>\n<tr><td class=\"l\">LIC-601<\/td><td class=\"l\">Silo level<\/td><td colspan=\"5\">50 %<\/td><td class=\"l\">12<\/td><\/tr>\n<\/table>\n<table class=\"t\">\n<tr><th>#<\/th><th class=\"l\">Step<\/th><th class=\"l\">How to do it<\/th><th class=\"l\">You should see<\/th><th class=\"l\">Page<\/th><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#6c7177;color:#fff;font-weight:600\">Phase A — Utilities and circulation<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">Start cooling water P-701<\/td><td class=\"l\">Click the P-701 pump symbol → faceplate → <b>START<\/b>.<\/td><td class=\"l\">P-701 dark (running). CW return ≈ 30 °C.<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Start cycle-gas compressor K-211<\/td><td class=\"l\">Click the K-211 compressor symbol → <b>START<\/b>. If it trips at once, the dew margin is below 0.5 bar: lower PIC-211 SP first.<\/td><td class=\"l\">K-211 running. Gas flow is needed before the heater can run.<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td>3<\/td><td class=\"l\">Solids circulation 50–60 %<\/td><td class=\"l\">Click HIC-213 (hand station, always MAN) → type OP <b>55<\/b> → <b>Set OP<\/b>.<\/td><td class=\"l\">Particle animation in the riser and downer.<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#c0532b;color:#fff;font-weight:600\">Phase B — Heat-up<\/td><\/tr>\n<tr><td>4<\/td><td class=\"l\">Warm R-211 to ≥ 70 °C (aim for 75 °C)<\/td><td class=\"l\">Click <span class=\"tg\">E-212<\/span> → START (needs K-211 running). Then click <span class=\"tg\">TIC-212<\/span> (heater controller, under TIC-211) → <b>AUTO<\/b>, SP <b>78 °C<\/b> (R-7: <b>73 °C<\/b>) = recipe temperature − 2 °C. Leave TIC-211 in <b>MAN, OP 0 %<\/b> for now. Keep PIC-211 SP low (≤ 5 barg). The step ticks at 70 °C, but keep heating to ≈ 75 °C before step 5 — it gives the dew margin you need at 27–28 barg.<\/td><td class=\"l\">E-212 \"heater ON 4.0 MW\", TCV-212 100 %. TIC-211 PV rises ≈ 0.8 °C/min, 70 °C after ≈ 1 h. Near 78 °C TCV-212 closes by itself and the heater holds the temperature — it can no longer overheat to the 85 °C trip.<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#2f6fb3;color:#fff;font-weight:600\">Phase C — Pressurise and line up<\/td><\/tr>\n<tr><td>5<\/td><td class=\"l\">Pressurise R-211<\/td><td class=\"l\">Keep the heater on. PIC-211 → AUTO, then raise the SP <b>in stages<\/b>: 10 → 18 → 24 → <b>27 barg (RACO) / 28 barg (HOMO)<\/b>. Before each raise check the <b>Dew-point margin<\/b> box is &gt; 3 bar. Safe maximum: ≈ 22 barg at 65 °C, 26 barg at 70 °C, 30 barg at 75 °C.<\/td><td class=\"l\">PIC-211 OP rises above 30 % (make-up side). Pressure reaches SP in ≈ 30 min. Dew margin stays &gt; 3 bar. If it falls, lower the SP and heat more.<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td>6<\/td><td class=\"l\">Line up the HP flash<\/td><td class=\"l\">300 Flash page: click PIC-301 → AUTO → SP <b>18<\/b> → Set SP.<\/td><td class=\"l\">PIC-301 in AUTO (pressure builds slowly as gas arrives).<\/td><td class=\"l\">300<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#7b5ea7;color:#fff;font-weight:600\">Phase D — Chemicals and feeds (plant now in HOT STANDBY)<\/td><\/tr>\n<tr><td>7<\/td><td class=\"l\">TEAL and donor<\/td><td class=\"l\">Start P-102 and P-103. FFIC-102 → AUTO, SP <b>5 g/g<\/b>. FFIC-103 → AUTO, SP <b>10 g/g<\/b> (C-donor) or <b>50 g/g<\/b> (D-donor, H-BOPP).<\/td><td class=\"l\">Both ratio controllers in AUTO at their SP. <b>TEAL and donor flows stay near zero<\/b> — normal: TEAL is dosed in proportion to catalyst, which only starts in step 10.<\/td><td class=\"l\">100<\/td><\/tr>\n<tr><td>8<\/td><td class=\"l\">Barrier and low fresh C₃<\/td><td class=\"l\">FIC-212 → AUTO, SP <b>6 t/h<\/b> (H-FIBER <b>1.5 t/h<\/b>). FIC-201 → AUTO, SP <b>5 t/h<\/b>.<\/td><td class=\"l\">Total feed ≤ 12 t/h. PIC-211 holds pressure by venting (OP &lt; 30 %).<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td>9<\/td><td class=\"l\">Riser hydrogen<\/td><td class=\"l\">AIC-211 → AUTO, SP from the start-up table: R-7 <b>1.75<\/b>, H-INJ <b>2.98<\/b>, H-RAFFIA <b>0.97<\/b>, H-FIBER <b>2.36<\/b>, H-BOPP <b>1.04 mol%<\/b>.<\/td><td class=\"l\">Riser H₂ rises to SP over ≈ 10–20 min. Downer H₂ stays low (barrier working).<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#d0782a;color:#fff;font-weight:600\">Phase E — Light-off<\/td><\/tr>\n<tr><td>10<\/td><td class=\"l\">Catalyst in<\/td><td class=\"l\">Start feeder D-101. FIC-101 → AUTO, SP <b>0.2 kg/h<\/b> (not the recipe value yet). TIC-211 → AUTO, SP <b>75 °C<\/b> (R-7) or <b>80 °C<\/b> (HOMO). Keep the heater running with TIC-212 in AUTO.<\/td><td class=\"l\">Catalyst flow ≈ 0.2 kg/h. Production appears after ≈ 30 min and builds over 1 h. As the heat of reaction grows, <b>TIC-212 OP falls by itself<\/b> (100 → 0 %). TIC-211 only opens the cooler above its SP: the 2 °C gap stops heater and cooler fighting.<\/td><td class=\"l\">100<\/td><\/tr>\n<tr><td>11<\/td><td class=\"l\">Reaction lit off (&gt; 5 t/h)<\/td><td class=\"l\">Wait until production &gt; 5 t/h <b>and TIC-212 OP &lt; 10 %<\/b>, then click E-212 → STOP.<\/td><td class=\"l\">The reaction now carries the heat. Stopping the heater costs almost nothing, so the temperature stays put. <b>Do not stop it while TIC-212 OP is still high<\/b>: you would lose up to 4 MW at once and R-211 cools (see the warning below).<\/td><td class=\"l\">200<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#3a8a3f;color:#fff;font-weight:600\">Phase F — Finishing on line<\/td><\/tr>\n<tr><td>12<\/td><td class=\"l\">Steam, extruder, silo level<\/td><td class=\"l\">Finishing page: <b>STEAM ON<\/b>. When the silo is &gt; 20 %, start EX-601, then LIC-601 → AUTO, SP <b>50 %<\/b>.<\/td><td class=\"l\">Silo level rises, then the extruder rate follows production.<\/td><td class=\"l\">500/600<\/td><\/tr>\n<tr><td colspan=\"5\" class=\"l\" style=\"background:#1f8a8a;color:#fff;font-weight:600\">Phase G — Rate and specification<\/td><\/tr>\n<tr><td>13<\/td><td class=\"l\">Ramp to rate<\/td><td class=\"l\">Raise FIC-101 SP by ≈ 0.05 kg/h every 10 min up to the final value (R-7 <b>0.70<\/b>, H-INJ <b>0.59<\/b> kg/h…). Raise FIC-201 with production: ≈ 0.75 × production, up to <b>22 t/h<\/b>. RACO: when production &gt; 15 t/h add ethylene FIC-203 in three steps (400 → 800 → <b>1167 kg/h<\/b>).<\/td><td class=\"l\">Production climbs to ≥ 27 t/h. TIC-211 OP stays below 50 % (spare cooling). PIC-211 OP moves to the make-up side.<\/td><td class=\"l\">100 / 200<\/td><\/tr>\n<tr><td>14<\/td><td class=\"l\">Pellets on-spec<\/td><td class=\"l\">Check MFR, XS and C₂ on the KPI panel and take a spot sample on the Quality page. Correct with AIC-211 if needed.<\/td><td class=\"l\">Header shows <b>ON-SPEC<\/b>. Session card shows <b>COMPLETE<\/b>.<\/td><td class=\"l\">Quality<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>Why the temperature can run away downwards at light-off.<\/b> At 1–3 t/h the reaction makes only 0.5–1.5 MW, but the cold feed (FIC-201 + barrier + make-up) and the heat losses take 1.5–2.5 MW. Without the heater the balance is negative, so R-211 cools. Colder catalyst is less active, so it cools faster still. The vapour pressure falls with the temperature: at 28 barg the dew margin reaches 0 bar near 66 °C. K-211 trips on liquid carry-over (margin &lt; 0.5 bar) and 60 s later the SIS fires the CO kill. <b>Prevention:<\/b> keep the heater on with TIC-212 in AUTO until it is no longer working (OP &lt; 10 %), keep FIC-201 at ≈ 5 t/h until light-off, and never leave TIC-212 in MAN 100 % (full 4 MW, trips at 85 °C). <b>If it happens:<\/b> restart E-212 at once (allowed below 85 °C) with TIC-212 in AUTO, and cut FIC-201. If the margin falls below 3 bar, lower PIC-211 SP by 2–3 barg.<\/div>\n<div class=\"tip\"><b>Alarms during start-up:<\/b> the simulator suppresses alarms that only make sense in operation while the plant is down (section 10.5), so a cold plant starts quiet. Alarms come back automatically as production passes 1–5 t/h. A few (extruder stopped, low production) are normal until finishing is on line.<\/div>\n\n<h3>8.5 Hot standby and restart<\/h3>\n<p><b>Hot standby<\/b> means the reactor is warm, pressurised and circulating, with K-211 and P-701 running and no catalyst. It is the normal \"parking\" state for a short stop, for example while a downstream problem is fixed. A restart from hot standby takes about an hour instead of six.<\/p>\n<ul>\n<li><b>To park the plant:<\/b> do shutdown steps 1–9 (8.6) and stop there. Keep E-212 on with TIC-212 in AUTO (recipe − 2 °C) and TIC-211 in AUTO to hold the temperature, and keep PIC-211 at its normal SP. Watch the dew margin.<\/li>\n<li><b>To restart from hot standby:<\/b> do start-up steps 7–14 (8.4). Check first that the temperature is ≥ 72 °C and the dew margin is &gt; 3 bar.<\/li>\n<\/ul>\n\n<h3>8.6 Controlled plant shutdown<\/h3>\n<p>Start it from the session menu: <b>Controlled plant shutdown<\/b>, or run it on any steady plant. The Session card tracks 13 steps. It takes ≈ 5½ h sim time, most of it waiting for the reaction to die away and the silo to empty.<\/p>\n<div class=\"warn\"><b>The trap in this procedure:<\/b> as production falls, the cold fresh propylene and the barrier keep removing heat. If you leave FIC-201 at 22 t/h, R-211 cools by ≈ 0.7 °C/min once the reaction heat is gone. The vapour pressure then falls below the reactor pressure, the dew margin collapses, K-211 trips on liquid carry-over and the SIS fires the CO kill. Reduce the feed with production, and hold the temperature with E-212.<\/div>\n<table class=\"t\">\n<tr><th>#<\/th><th class=\"l\">Step<\/th><th class=\"l\">How to do it<\/th><th class=\"l\">Why / what to watch<\/th><\/tr>\n<tr><td colspan=\"4\" class=\"l\" style=\"background:#d0782a;color:#fff;font-weight:600\">Phase A — Stop the reaction<\/td><\/tr>\n<tr><td>1<\/td><td class=\"l\">Cut catalyst<\/td><td class=\"l\">FIC-101 → MAN, OP 0 % (or stop feeder D-101).<\/td><td class=\"l\">Production now decays over 1½–2 h (residence time).<\/td><\/tr>\n<tr><td>2<\/td><td class=\"l\">Comonomer off<\/td><td class=\"l\">FIC-203 → MAN 0 % (RACO). On HECO also AIC-401 → MAN 0 %.<\/td><td class=\"l\">Stops sticky, high-C₂ material being made at low rate.<\/td><\/tr>\n<tr><td colspan=\"4\" class=\"l\" style=\"background:#c0532b;color:#fff;font-weight:600\">Phase B — Feed down, hold temperature<\/td><\/tr>\n<tr><td>3<\/td><td class=\"l\">Fresh C₃ with production<\/td><td class=\"l\">Keep the FIC-201 SP ≈ 0.7 × production (30 t/h → 21, 15 t/h → 10, 5 t/h → 3.5).<\/td><td class=\"l\">Less cold feed = less chilling. Pressure stays on PIC-211.<\/td><\/tr>\n<tr><td>4<\/td><td class=\"l\">Heater on below 10 t/h<\/td><td class=\"l\">E-212 → START. TIC-212 AUTO, SP recipe − 2 °C (78, R-7 73). Keep TIC-211 in AUTO.<\/td><td class=\"l\">TIC-212 OP rises as the reaction heat fades. Temperature stays near SP. Dew margin stays &gt; 3 bar.<\/td><\/tr>\n<tr><td>5<\/td><td class=\"l\">Production &lt; 2 t/h<\/td><td class=\"l\">Wait.<\/td><td class=\"l\">Heat of reaction ≈ 0. The reaction is practically dead.<\/td><\/tr>\n<tr><td colspan=\"4\" class=\"l\" style=\"background:#7b5ea7;color:#fff;font-weight:600\">Phase C — Isolate chemicals and feeds (plant now in HOT STANDBY after step 9)<\/td><\/tr>\n<tr><td>6<\/td><td class=\"l\">GPR to bypass<\/td><td class=\"l\">HS-302 → BYPASS (Flash or GPR page).<\/td><td class=\"l\">Ticks at once on HOMO/RACO grades.<\/td><\/tr>\n<tr><td>7<\/td><td class=\"l\">Hydrogen off<\/td><td class=\"l\">AIC-211 → MAN, OP 0 %.<\/td><td class=\"l\"><\/td><\/tr>\n<tr><td>8<\/td><td class=\"l\">TEAL and donor off<\/td><td class=\"l\">Stop P-102 and P-103.<\/td><td class=\"l\">No catalyst left to activate.<\/td><\/tr>\n<tr><td>9<\/td><td class=\"l\">Feeds off<\/td><td class=\"l\">FIC-201 and FIC-212 → MAN, OP 0 %.<\/td><td class=\"l\">PIC-211 holds the pressure on its own.<\/td><\/tr>\n<tr><td colspan=\"4\" class=\"l\" style=\"background:#3a8a3f;color:#fff;font-weight:600\">Phase D — Empty the finishing section<\/td><\/tr>\n<tr><td>10<\/td><td class=\"l\">Run the silo down<\/td><td class=\"l\">LIC-601 SP → ≈ 5 %. At ≤ 10 % stop EX-601.<\/td><td class=\"l\">The extruder runs at up to 50 t/h (≈ 3 h from 50 %).<\/td><\/tr>\n<tr><td>11<\/td><td class=\"l\">Steam off<\/td><td class=\"l\">D-501 steam → OFF.<\/td><td class=\"l\"><\/td><\/tr>\n<tr><td colspan=\"4\" class=\"l\" style=\"background:#6c7177;color:#fff;font-weight:600\">Phase E — Depressurise and stop the machines<\/td><\/tr>\n<tr><td>12<\/td><td class=\"l\">Depressurise<\/td><td class=\"l\">PIC-211 SP → ≈ 3 barg (the split range opens the vent to D-301). At ≤ 5 barg stop E-212.<\/td><td class=\"l\">Lower pressure only increases the dew margin, so this is safe at any temperature.<\/td><\/tr>\n<tr><td>13<\/td><td class=\"l\">Stop K-211 and P-701<\/td><td class=\"l\">Only with production &lt; 1 t/h.<\/td><td class=\"l\">If K-211 stops earlier with the reaction still running, the SIS fires the CO kill after 60 s.<\/td><\/tr>\n<\/table>\n\n<h3>8.7 Emergency shutdown (CO kill) and restart after a trip<\/h3>\n<p>Use the emergency shutdown when the reaction can no longer be held by the cooling. Examples: TIC-211 OP at 100 % with the temperature still rising, loss of K-211 or P-701 with the reaction running, or a temperature heading for 90 °C. The SIS does the same thing automatically at 92 °C, or when K-211 has been stopped for 60 s, but an operator who acts earlier keeps more options open.<\/p>\n<ol>\n<li><b>Cut catalyst<\/b>: FIC-101 → MAN, OP 0 %. This is always the first move.<\/li>\n<li><b>Kill<\/b>: MZCR page, XV-901 <b>ARM<\/b> → <b>INJECT<\/b>. CO poisons the catalyst. The heat of reaction falls to zero within about a minute.<\/li>\n<li><b>Confirm<\/b>: heat of reaction ≈ 0, TIC-211 OP falling, temperature turning down.<\/li>\n<li><b>Make safe<\/b>: ethylene and H₂ → MAN 0 %. On HECO put the GPR in bypass. Keep K-211 and P-701 running if they are available. If R-211 starts to cool, start E-212 to protect the dew margin.<\/li>\n<li><b>Find the cause<\/b>: alarm list, event journal and trends (\"what moved first?\"). Fix it, or ask the instructor to clear the failure.<\/li>\n<li><b>Decide<\/b>: restart (below), or a full shutdown (continue with 8.6 from step 6).<\/li>\n<\/ol>\n<p><b>Restart after a CO kill:<\/b> XV-901 <b>RESET<\/b> → state <b>PURGE<\/b>. The CO is purged over 15–30 min, until the state returns to NORMAL. If the silo cut the catalyst, reset the SIS catalyst cut (FIC-101 faceplate). Check that TEAL, donor, feeds and H₂ are lined up (start-up steps 7–9), then light off again with start-up steps 10–14.<\/p>\n\n<h3>8.8 Common mistakes, and what the simulator does to you<\/h3>\n<table class=\"t\">\n<tr><th class=\"l\">Mistake<\/th><th class=\"l\">What happens<\/th><th class=\"l\">Do this instead<\/th><\/tr>\n<tr><td class=\"l\">Pressurising the reactor while it is cold<\/td><td class=\"l\">Dew-margin P1 alarm. Below 0.5 bar K-211 trips (liquid carry-over).<\/td><td class=\"l\">Heat to ≥ 72 °C first (table in 8.3).<\/td><\/tr>\n<tr><td class=\"l\">Starting E-212 before K-211<\/td><td class=\"l\">START refused: \"no cycle-gas flow\".<\/td><td class=\"l\">Follow phase A before phase B.<\/td><\/tr>\n<tr><td class=\"l\">Full fresh C₃ (22 t/h) before light-off<\/td><td class=\"l\">Pressure keeps rising (the vent is limited to ≈ 12 t/h). Feed vaporisation chills the reactor.<\/td><td class=\"l\">≈ 5 t/h until production builds, then ≈ 0.75 × rate.<\/td><\/tr>\n<tr><td class=\"l\">Catalyst before TEAL<\/td><td class=\"l\">Almost no activity, TEAL/cat ratio low alarm, wasted catalyst.<\/td><td class=\"l\">TEAL and donor in AUTO first (step 7).<\/td><\/tr>\n<tr><td class=\"l\">Heater left on after light-off<\/td><td class=\"l\">Extra 4 MW, so the cooler works harder. The heater trips at 85 °C and the trip is counted as an SIS trip on your score.<\/td><td class=\"l\">Stop E-212 at &gt; 5 t/h (step 11).<\/td><\/tr>\n<tr><td class=\"l\">Ramping catalyst too fast<\/td><td class=\"l\">Temperature overshoot, TAH-211 at 85 °C, possible 92 °C CO-kill trip.<\/td><td class=\"l\">≤ 0.05 kg/h every 10 min. Watch the TIC-211 OP margin.<\/td><\/tr>\n<tr><td class=\"l\">Forgetting the extruder<\/td><td class=\"l\">The silo fills. At 95 % the SIS cuts catalyst
